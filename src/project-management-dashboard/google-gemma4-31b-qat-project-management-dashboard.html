<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">

    <title>Nexus Command | Enterprise Project Management Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.5);
            --accent: #06b6d4;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            --bg-dark: #0f172a;
            --card-dark: rgba(30, 41, 59, 0.7);
            --border-dark: rgba(51, 65, 85, 0.5);
            --text-dark: #f8fafc;
            --text-muted-dark: #94a3b8;

            --bg-light: #f1f5f9;
            --card-light: rgba(255, 255, 255, 0.8);
            --border-light: rgba(226, 232, 240, 0.8);
            --text-light: #1e293b;
            --text-muted-light: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        .glass {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-dark);
        }

        .dark .glass {
            background: var(--card-dark);
            border-color: var(--border-dark);
            color: var(--text-dark);
        }

        .light .glass {
            background: var(--card-light);
            border-color: var(--border-light);
            color: var(--text-light);
        }

        .neon-border-primary {
            box-shadow: 0 0 10px var(--primary-glow);
            border: 1px solid var(--primary);
        }

        .neon-text-primary {
            color: var(--primary);
            text-shadow: 0 0 8px var(--primary-glow);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--border-dark);
            border-radius: 10px;
        }

        .view-transition {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-pill {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-on-track {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .status-at-risk {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .status-delayed {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .timeline-grid {
            display: grid;
            grid-template-columns: 200px 1fr;
        }

        .mode-toggle-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mode-toggle-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>

                return state.sortDir === 'asc' ? valA - valB : valB - valA;
            });

            document.getElementById('project-count').innerText = filtered.length;

            // Render Cards
            grid.innerHTML = filtered.map(p => ` <div class="glass p-6 rounded-3xl hover:neon-border-primary transition-all cursor-pointer group" > <div class="flex justify-between items-start mb-4" > <span class="status-pill status-${p.status}" >$ {
                    p.status.replace('-', ' ')
                }

                </span> <div class="text-right" > <p class="text-xs text-slate-400" >Health Score</p> <p class="text-xl font-bold mono ${p.health > 80 ? 'text-success' : p.health > 60 ? 'text-warning' : 'text-danger'}" >$ {
                    p.health
                }

                %</p> </div> </div> <h4 class="text-lg font-bold mb-4 group-hover:text-indigo-400 transition-colors" >$ {
                    p.name
                }

                </h4> <div class="grid grid-cols-2 gap-4 mb-6" > <div class="p-3 rounded-xl bg-slate-800/50 border border-slate-700" > <p class="text-[10px] uppercase text-slate-400 font-bold" >Progress</p> <p class="text-lg font-bold mono" >$ {
                    p.progress
                }

                %</p> </div> <div class="p-3 rounded-xl bg-slate-800/50 border border-slate-700" > <p class="text-[10px] uppercase text-slate-400 font-bold" >Team Size</p> <p class="text-lg font-bold mono" >$ {
                    p.team
                }

                </p> </div> <div class="p-3 rounded-xl bg-slate-800/50 border border-slate-700" > <p class="text-[10px] uppercase text-slate-400 font-bold" >Open Risks</p> <p class="text-lg font-bold mono ${p.risks > 3 ? 'text-danger' : ''}" >$ {
                    p.risks
                }

                </p> </div> <div class="p-3 rounded-xl bg-slate-800/50 border border-slate-700" > <p class="text-[10px] uppercase text-slate-400 font-bold" >Blocked</p> <p class="text-lg font-bold mono ${p.blocked > 0 ? 'text-danger' : ''}" >$ {
                    p.blocked
                }

                </p> </div> </div> <div class="flex justify-between items-center pt-4 border-t border-slate-700" > <div class="flex items-center gap-2" > <div class="w-6 h-6 rounded-full bg-slate-600 text-[10px] flex items-center justify-center font-bold" >$ {
                    p.owner[0]
                }

                </div> <span class="text-xs text-slate-400" >$ {
                    p.owner
                }

                </span> </div> <span class="text-xs mono text-slate-500" >$ {
                    p.date
                }

                </span> </div> </div> `).join('');

            // Render Table
            tableBody.innerHTML = filtered.map(p => ` <tr class="border-b border-slate-800 hover:bg-slate-800/30 transition-colors cursor-pointer group" onclick="toggleRow(${p.id})" > <td class="p-4 font-medium" >$ {
                    p.name
                }

                </td> <td class="p-4" > <div class="flex items-center gap-2" > <div class="w-16 bg-slate-700 h-1.5 rounded-full overflow-hidden" > <div class="bg-indigo-500 h-full" style="width: ${p.progress}%" ></div> </div> <span class="mono text-xs" >$ {
                    p.progress
                }

                %</span> </div> </td> <td class="p-4 mono ${p.health > 80 ? 'text-success' : p.health > 60 ? 'text-warning' : 'text-danger'}" >$ {
                    p.health
                }

                %</td> <td class="p-4 mono" >$$ {
                    (p.budget/1000000).toFixed(1)
                }

                M</td> <td class="p-4 mono" >$$ {
                    (p.spend/1000000).toFixed(1)
                }

                M</td> <td class="p-4 text-slate-400" >$ {
                    p.owner
                }

                </td> <td class="p-4" ><span class="status-pill status-${p.status}" >$ {
                    p.status
                }

                </span></td> </tr> <tr id="row-${p.id}" class="hidden bg-slate-900/50" > <td colspan="7" class="p-6" > <div class="grid grid-cols-1 md:grid-cols-3 gap-8" > <div class="space-y-3" > <h5 class="text-xs font-bold uppercase text-indigo-400" >Financial Detail</h5> <div class="flex justify-between text-sm" ><span>Total Budget:</span><span class="mono" >$$ {
                    p.budget.toLocaleString()
                }

                </span></div> <div class="flex justify-between text-sm" ><span>Actual Spend:</span><span class="mono" >$$ {
                    p.spend.toLocaleString()
                }

                </span></div> <div class="flex justify-between text-sm" ><span>Remaining:</span><span class="mono" >$$ {
                    (p.budget - p.spend).toLocaleString()
                }

                </span></div> <div class="flex justify-between text-sm" ><span>Variance:</span><span class="mono ${p.spend > p.budget ? 'text-danger' : 'text-success'}" >$ {
                    (((p.spend-p.budget)/p.budget)*100).toFixed(1)
                }

                %</span></div> </div> <div class="space-y-3" > <h5 class="text-xs font-bold uppercase text-indigo-400" >Delivery Metrics</h5> <div class="flex justify-between text-sm" ><span>Team Velocity:</span><span class="mono" >42 pts/sprint</span></div> <div class="flex justify-between text-sm" ><span>Cycle Time:</span><span class="mono" >6.2 days</span></div> <div class="flex justify-between text-sm" ><span>Lead Time:</span><span class="mono" >14.1 days</span></div> <div class="flex justify-between text-sm" ><span>Throughput:</span><span class="mono" >8 tasks/week</span></div> </div> <div class="space-y-3" > <h5 class="text-xs font-bold uppercase text-indigo-400" >Project Governance</h5> <div class="flex justify-between text-sm" ><span>Dept:</span><span class="mono" >$ {
                    p.dept
                }

                </span></div> <div class="flex justify-between text-sm" ><span>Priority:</span><span class="mono" >P1 - Critical</span></div> <div class="flex justify-between text-sm" ><span>Quarter:</span><span class="mono" >Q4 2024</span></div> <div class="flex justify-between text-sm" ><span>Fiscal Year:</span><span class="mono" >FY25</span></div> </div> </div> </td> </tr> `).join('');
        }

        function filterProjects() {
            state.filter.search = document.getElementById('project-search').value;
            state.filter.status = document.getElementById('filter-status').value;
            state.filter.dept = document.getElementById('filter-dept').value;
            renderProjects();
        }

        function sortProjects(key) {
            if (state.sortKey === key) {
                state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
            }

            else {
                state.sortKey = key;
                state.sortDir = 'asc';
            }

            renderProjects();
        }

        function toggleRow(id) {
            const row = document.getElementById(`row-$ {
                    id
                }

                `);
            row.classList.toggle('hidden');
        }

        // --- TIMELINE VIEW LOGIC ---
        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            const tableBody = document.getElementById('milestone-table-body');

            // Group projects for timeline
            const projects = DATA.projects.slice(0, 4);

            container.innerHTML = projects.map(p => ` <div class="space-y-4" > <div class="flex items-center justify-between" > <h4 class="font-bold text-indigo-400" >$ {
                    p.name
                }

                </h4> <span class="text-xs mono text-slate-500" >$ {
                    p.progress
                }

                % Complete</span> </div> <div class="relative h-12 w-full bg-slate-800/50 rounded-2xl border border-slate-700 flex items-center px-4 gap-4 overflow-hidden" > <div class="absolute left-0 top-0 h-full bg-indigo-600/30 transition-all duration-1000" style="width: ${p.progress}%" ></div> <div class="flex w-full justify-between items-center relative z-10" > <div class="flex items-center gap-2" > <div class="w-3 h-3 rounded-full bg-indigo-500 neon-border-primary" ></div> <span class="text-[10px] font-bold uppercase" >Kickoff</span> </div> <div class="flex items-center gap-2" > <div class="w-3 h-3 rounded-full bg-indigo-500 neon-border-primary" ></div> <span class="text-[10px] font-bold uppercase" >MVP</span> </div> <div class="flex items-center gap-2" > <div class="w-3 h-3 rounded-full ${p.progress > 80 ? 'bg-indigo-500 neon-border-primary' : 'bg-slate-600'}" ></div> <span class="text-[10px] font-bold uppercase" >Beta</span> </div> <div class="flex items-center gap-2" > <div class="w-3 h-3 rounded-full ${p.progress > 95 ? 'bg-indigo-500 neon-border-primary' : 'bg-slate-600'}" ></div> <span class="text-[10px] font-bold uppercase" >Release</span> </div> </div> </div> </div> `).join('');

            tableBody.innerHTML = DATA.milestones.map(m => ` <tr class="border-b border-slate-800 hover:bg-slate-800/30 transition-colors cursor-pointer group" onclick="toggleMilestoneRow(${m.id})" > <td class="p-4 font-medium" >Sprint $ {
                    Math.floor(Math.random()*10)+1
                }

                </td> <td class="p-4" >$ {
                    m.name
                }

                </td> <td class="p-4 mono" >$ {
                    m.date
                }

                </td> <td class="p-4" ><span class="status-pill status-${m.status === 'completed' ? 'on-track' : m.status === 'delayed' ? 'delayed' : 'at-risk'}" >$ {
                    m.status
                }

                </span></td> <td class="p-4 text-slate-400" >$ {
                    m.owner
                }

                </td> <td class="p-4" ><span class="text-xs font-bold ${m.risk === 'High' ? 'text-danger' : m.risk === 'Medium' ? 'text-warning' : 'text-success'}" >$ {
                    m.risk
                }

                </span></td> </tr> <tr id="ms-row-${m.id}" class="hidden bg-slate-900/50" > <td colspan="6" class="p-6" > <div class="grid grid-cols-1 md:grid-cols-3 gap-8" > <div class="space-y-3" > <h5 class="text-xs font-bold uppercase text-indigo-400" >Task Breakdown</h5> <div class="flex items-center gap-2 text-sm" ><i data-lucide="check-circle-2" class="w-4 h-4 text-success" ></i> Initial Requirements</div> <div class="flex items-center gap-2 text-sm" ><i data-lucide="check-circle-2" class="w-4 h-4 text-success" ></i> Architecture Design</div> <div class="flex items-center gap-2 text-sm" ><i data-lucide="circle" class="w-4 h-4 text-slate-500" ></i> Integration Testing</div> </div> <div class="space-y-3" > <h5 class="text-xs font-bold uppercase text-indigo-400" >Blockers & Dependencies</h5> <div class="p-2 rounded bg-rose-500/10 border border-rose-500/30 text-xs text-rose-400" > <strong>Blocker:</strong> Waiting on Security sign-off for API Gateway. </div> <div class="p-2 rounded bg-slate-800 border border-slate-700 text-xs text-slate-400" > <strong>Dependency:</strong> Requires completion of Project Alpha's Auth module.
 </div> </div> <div class="space-y-3" > <h5 class="text-xs font-bold uppercase text-indigo-400" >Comments</h5> <p class="text-xs text-slate-400 italic" >"The delay in data lake integration is causing a ripple effect on the dashboard MVP. We are exploring a mock-data approach for the first demo." - Marcus</p> </div> </div> </td> </tr> `).join('');
            lucide.createIcons();
        }

        function toggleMilestoneRow(id) {
            document.getElementById(`ms-row-$ {
                    id
                }

                `).classList.toggle('hidden');
        }

        // --- RESOURCE VIEW LOGIC ---
        function renderResources() {
            const list = document.getElementById('resource-list');

            list.innerHTML = DATA.resources.map(r => ` <div class="p-4 rounded-2xl bg-slate-800/40 border border-slate-700 space-y-4" > <div class="flex justify-between items-center" > <h4 class="font-bold" >$ {
                    r.name
                }

                </h4> <span class="text-xs font-bold ${r.status === 'Overloaded' ? 'text-danger' : 'text-success'}" >$ {
                    r.status
                }

                </span> </div> <div class="grid grid-cols-3 gap-4" > <div class="text-center" > <p class="text-[10px] uppercase text-slate-400 font-bold" >Utilization</p> <p class="text-lg font-bold mono" >$ {
                    r.utilization
                }

                %</p> </div> <div class="text-center" > <p class="text-[10px] uppercase text-slate-400 font-bold" >Capacity</p> <p class="text-lg font-bold mono" >$ {
                    r.capacity
                }

                %</p> </div> <div class="text-center" > <p class="text-[10px] uppercase text-slate-400 font-bold" >OT Risk</p> <p class="text-lg font-bold mono ${r.overtimeRisk === 'High' || r.overtimeRisk === 'Critical' ? 'text-danger' : ''}" >$ {
                    r.overtimeRisk
                }

                </p> </div> </div> <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden" > <div class="h-full transition-all duration-1000 ${r.utilization > 100 ? 'bg-rose-500' : r.utilization > 80 ? 'bg-amber-500' : 'bg-indigo-500'}" style="width: ${Math.min(r.utilization, 100)}%" ></div> </div> </div> `).join('');
        }

        // --- RISK VIEW LOGIC ---
        function renderRisks() {
            const body = document.getElementById('risk-table-body');

            body.innerHTML = DATA.risks.map(r => ` <tr class="border-b border-slate-800 hover:bg-slate-800/30 transition-colors" > <td class="p-4" >$ {
                    r.desc
                }

                </td> <td class="p-4" ><span class="status-pill ${r.severity === 'Critical' ? 'status-delayed' : r.severity === 'High' ? 'status-at-risk' : 'status-on-track'}" >$ {
                    r.severity
                }

                </span></td> <td class="p-4 mono" >$ {
                    r.prob
                }

                </td> <td class="p-4 mono" >$ {
                    r.impact
                }

                </td> <td class="p-4 text-slate-400 text-xs" >$ {
                    r.mitigation
                }

                </td> <td class="p-4 font-medium" >$ {
                    r.owner
                }

                </td> </tr> `).join('');
        }

        // --- OPERATIONS VIEW LOGIC ---
        function renderOperations() {
            const list = document.getElementById('integrations-list');

            list.innerHTML = DATA.integrations.map(i => ` <div class="flex items-center justify-between p-4 rounded-2xl bg-slate-800/40 border border-slate-700" > <div class="flex items-center gap-3" > <div class="w-10 h-10 rounded-xl bg-slate-700 flex items-center justify-center" > <i data-lucide="${i.icon}" class="w-5 h-5" ></i> </div> <div> <p class="text-sm font-bold" >$ {
                    i.name
                }

                </p> <p class="text-[10px] text-slate-400" >Last sync: $ {
                    i.sync
                }

                </p> </div> </div> <div class="text-right" > <div class="flex items-center gap-2 justify-end" > <span class="w-2 h-2 rounded-full ${i.status === 'online' ? 'bg-emerald-500' : 'bg-amber-500'}" ></span> <span class="text-xs font-bold uppercase ${i.status === 'online' ? 'text-emerald-500' : 'text-amber-500'}" >$ {
                    i.status
                }

                </span> </div> <p class="text-[10px] mono text-slate-500" >$ {
                    i.latency
                }

                </p> </div> </div> `).join('');
            lucide.createIcons();
        }

        // --- CHARTING LOGIC ---
        function renderSummaryCharts() {
            const isDark = state.theme === 'dark';

            const colors = {
                primary: '#6366f1',
                success: '#10b981',
                warning: '#f59e0b',
                danger: '#ef4444',
                text: isDark ? '#94a3b8' : '#64748b',
                grid: isDark ? 'rgba(51, 65, 85, 0.2)' : 'rgba(226, 232, 240, 0.5)'
            }

                ;

            const chartConfig = (type, data, options = {}) => ({

                type,
                data,
                options: {

                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }

                        ,
                        tooltip: {
                            backgroundColor: isDark ? '#1e293b' : '#fff',
                            titleColor: isDark ? '#f8fafc' : '#1e293b',
                            bodyColor: isDark ? '#94a3b8' : '#64748b',
                            borderColor: colors.primary,
                            borderWidth: 1
                        }
                    }

                    ,
                    scales: {
                        y: {
                            grid: {
                                color: colors.grid
                            }

                            ,
                            ticks: {
                                color: colors.text, font: {
                                    family: 'JetBrains Mono'
                                }
                            }
                        }

                        ,
                        x: {
                            grid: {
                                display: false
                            }

                            ,
                            ticks: {
                                color: colors.text, font: {
                                    family: 'JetBrains Mono'
                                }
                            }
                        }
                    }

                    ,
                    ...options
                }
            });

            // Completion Trend
            new Chart(document.getElementById('chart-completion'), chartConfig('line', {

                labels: ['Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'],
                datasets: [{
                    label: 'Completion %',
                    data: [40, 45, 60, 72, 85, 91],
                    borderColor: colors.primary,
                    backgroundColor: 'rgba(99, 102, 241, 0.1)',
                    fill: true,
                    tension: 0.4,
                    borderWidth: 3,
                    pointRadius: 4,
                    pointBackgroundColor: colors.primary
                }

                ]
            }));

            // Budget vs Actual
            new Chart(document.getElementById('chart-budget'), chartConfig('bar', {

                labels: ['P1', 'P2', 'P3', 'P4', 'P5'],
                datasets: [{
                    label: 'Budget', data: [1.2, 0.8, 2.5, 0.5, 3.0], backgroundColor: colors.primary
                }

                    ,
                {
                    label: 'Actual', data: [1.1, 0.9, 2.4, 0.3, 1.8], backgroundColor: colors.success
                }

                ]
            }));

            // Resource Allocation
            new Chart(document.getElementById('chart-resources'), chartConfig('doughnut', {

                labels: ['Eng', 'Prod', 'Mkt', 'Ops'],
                datasets: [{
                    data: [40, 25, 15, 20],
                    backgroundColor: [colors.primary, colors.success, colors.warning, colors.danger],
                    borderWidth: 0,
                    hoverOffset: 10
                }

                ]
            }

                , {

                    cutout: '70%',
                    plugins: {
                        legend: {
                            display: true, position: 'bottom', labels: {
                                color: colors.text, font: {
                                    family: 'Inter'
                                }
                            }
                        }
                    }
                }));

            // Risks Severity
            new Chart(document.getElementById('chart-risks'), chartConfig('polarArea', {

                labels: ['Critical', 'High', 'Medium', 'Low'],
                datasets: [{
                    data: [2, 5, 8, 12],
                    backgroundColor: [colors.danger, '#f97316', colors.warning, colors.success],
                    borderWidth: 0
                }

                ]
            }));

            // Velocity
            new Chart(document.getElementById('chart-velocity'), chartConfig('line', {

                labels: ['S1', 'S2', 'S3', 'S4', 'S5', 'S6'],
                datasets: [{
                    label: 'Velocity',
                    data: [30, 35, 32, 45, 40, 48],
                    borderColor: colors.success,
                    tension: 0,
                    borderDash: [5, 5],
                    pointStyle: 'rectRot',
                    pointRadius: 6
                }

                ]
            }));

            // Milestones
            new Chart(document.getElementById('chart-milestones'), chartConfig('bar', {

                labels: ['Q1', 'Q2', 'Q3', 'Q4'],
                datasets: [{
                    label: 'Milestones',
                    data: [12, 19, 15, 22],
                    backgroundColor: colors.primary,
                    borderRadius: 8
                }

                ]
            }

                , {
                    indexAxis: 'y'
                }));
        }

    </script>
