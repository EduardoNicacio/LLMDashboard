<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Enterprise PMO Command Center</title>
    <!-- Chart.js for Data Visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            /* Light Theme Variables */
            --bg-body: #f3f4f6;
            --bg-surface: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.7);
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --accent-primary: #4f46e5;
            /* Indigo */
            --accent-glow: rgba(79, 70, 229, 0.3);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;

            /* Glassmorphism & Effects */
            --glass-border: 1px solid rgba(255, 255, 255, 0.5);
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);

            /* Transitions */
            --transition-speed: 0.3s;
        }

        [data-theme="dark"] {
            /* Dark Theme Variables */
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --bg-glass: rgba(30, 41, 59, 0.6);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;

            --accent-primary: #6366f1;
            /* Lighter Indigo for dark mode */
            --accent-glow: rgba(99, 102, 241, 0.15);

            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);

            /* Neon Accents for Dark Mode */
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --info: #60a5fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Layout & Grid --- */
        .app-container {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }

        /* Sidebar */
        aside {
            background-color: var(--bg-surface);
            border-right: var(--glass-border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            transition: all var(--transition-speed);
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            color: var(--text-primary);
        }

        nav ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        nav button {
            width: 100%;
            text-align: left;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        nav button:hover {
            background-color: var(--bg-body);
            color: var(--text-primary);
        }

        nav button.active {
            background-color: var(--accent-glow);
            color: var(--accent-primary);
            border-left: 3px solid var(--accent-primary);
        }

        /* Main Content */
        main {
            padding: 2rem;
            overflow-y: auto;
            position: relative;
        }

        /* --- Components --- */

        /* Header / Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .search-container {
            position: relative;
            width: 300px;
        }

        .search-input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            border-radius: 99px;
            border: var(--glass-border);
            background-color: var(--bg-glass);
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .theme-toggle {
            background: var(--bg-glass);
            border: var(--glass-border);
            padding: 0.5rem;
            border-radius: 99px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 1.2rem;
            transition: transform 0.2s;
        }

        .icon-btn:hover {
            transform: scale(1.1);
        }

        /* Cards & Grid */
        .dashboard-grid {
            display: grid;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background-color: var(--bg-surface);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow-sm);
            border: var(--glass-border);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        /* Hero KPIs */
        .kpi-grid {
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        .kpi-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .kpi-value {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 0.5rem;
        }

        .kpi-trend {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .trend-up {
            color: var(--success);
        }

        .trend-down {
            color: var(--danger);
        }

        /* Head to Head Panel */
        .h2h-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: center;
        }

        .project-vs-card {
            text-align: center;
            padding: 2rem;
            border-radius: 16px;
            background: var(--bg-glass);
            border: var(--glass-border);
            position: relative;
            overflow: hidden;
        }

        /* Winner Badge */
        .winner-badge {
            position: absolute;
            top: -20px;
            right: -20px;
            width: 100px;
            height: 100px;
            background: var(--accent-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: white;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .h2h-metric {
            margin-bottom: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .metric-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .metric-val {
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Charts Section */
        .charts-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        /* Project Table */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: var(--glass-border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th {
            background-color: var(--bg-glass);
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        th:hover {
            color: var(--accent-primary);
        }

        tr:hover td {
            background-color: rgba(99, 102, 241, 0.05);
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .bg-green {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .bg-yellow {
            background-color: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .bg-red {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        /* Timeline & History */
        .timeline-item {
            padding: 1rem;
            border-left: 2px solid var(--border-color);
            margin-bottom: 1rem;
            position: relative;
            transition: all 0.3s;
            cursor: pointer;
        }

        .timeline-item:hover {
            border-left-color: var(--accent-primary);
            background-color: var(--bg-glass);
            padding-left: 1.5rem;
        }

        /* Expandable Rows */
        details {
            margin-top: 0.5rem;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
        }

        summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--accent-primary);
            font-weight: 600;
            padding-top: 1rem;
        }

        summary::after {
            content: '+';
            font-size: 1.2rem;
            transition: transform 0.3s;
        }

        details[open] summary::after {
            transform: rotate(45deg);
        }

        .details-content {
            padding-bottom: 1rem;
            border-top: 1px solid var(--border-color);
            margin-top: 0.75rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.6;
        }

        /* Integrations & API */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            text-align: center;
        }

        .service-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-bottom: 0.5rem;
            background-color: var(--border-color);
            transition: all 0.3s;
        }

        .status-online {
            box-shadow: 0 0 8px currentColor;
            border: 2px solid white;
        }

        /* Winner Breakdown */
        .winner-breakdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        .win-card {
            background: var(--bg-glass);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .win-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .win-score {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-primary);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .app-container {
                grid-template-columns: 80px 1fr;
            }

            aside nav button span,
            aside .logo span {
                display: none;
            }

            aside {
                align-items: center;
                padding: 1rem;
            }

            .h2h-container {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
            }

            aside {
                display: none;
                /* In a real app, this would be a hamburger menu */
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .kpi-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body data-theme="dark">

    <div class="app-container">
        <!-- Sidebar -->
        <aside>
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            <!-- Dynamic Content Injection Point -->

        </main>

    <script>
        // --- 1. Mock Data Generation ---

        const projects = [

            { id: 'P-102', name: 'Customer Analytics Initiative', status: 'Delayed', health: 62, budget: 1800000, spent: 1950000, teamSize: 28, completion: 45, riskScore: 7.8, owner: 'Mike Ross' },
            { id: 'P-103', name: 'Global ERP Migration', status: 'On Track', health: 92, budget: 5000000, spent: 3200000, teamSize: 85, completion: 64, riskScore: 2.1, owner: 'David Kim' },
            { id: 'P-104', name: 'AI Customer Support Bot', status: 'Planning', health: 98, budget: 800000, spent: 50000, teamSize: 12, completion: 10, riskScore: 1.5, owner: 'Elena Rodriguez' },

        const milestones = [

            { id: 2, project: 'Customer Analytics Initiative', severity: 'Critical', probability: 'High', impact: 'High', owner: 'Mike Ross', desc: 'Data privacy compliance audit pending.' },
            { id: 3, project: 'Global ERP Migration', severity: 'Low', probability: 'Low', impact: 'Medium', owner: 'David Kim', desc: 'Minor hardware latency in staging environment.' }
        ];

        const integrations = [
            { name: 'Jira Cloud', status: 'online', latency: 45 },
            { name: 'Azure DevOps', status: 'online', latency: 120 },
            { name: 'GitHub Actions', status: 'degraded', latency: 890 },
            { name: 'Slack API', status: 'online', latency: 30 },
            { name: 'Salesforce', status: 'offline', latency: null }
        ];

        // --- 2. State Management ---

        const state = {
            currentView: 'dashboard',
            theme: 'dark',
            filterDept: '',
            agileMode: true,
            sortCol: 'health',
            sortOrder: 'desc'
        };

        let charts = {}; // Store chart instances to destroy/recreate

        // --- 3. Theme Engine ---

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');

            if (state.theme === 'dark') {
                body.setAttribute('data-theme', 'light');
                state.theme = 'light';
                icon.innerText = '🌙';
            } else {
                body.setAttribute('data-theme', 'dark');
                state.theme = 'dark';
                icon.innerText = '☀️';

                // Re-render charts for color updates
                updateChartColors();
            }

            localStorage.setItem('nexus_theme', state.theme);
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('nexus_theme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);
            toggleTheme(); // Sets icon to correct initial state
        }

        // --- 4. UI Rendering Logic ---

            const container = document.getElementById('dashboard-view');

            // Calculate Aggregate Stats
            const totalBudget = projects.reduce((acc, p) => acc + p.budget, 0);
            const totalSpent = projects.reduce((acc, p) => acc + p.spent, 0);
            const avgHealth = Math.round(projects.reduce((acc, p) => acc + p.health, 0) / projects.length);

            // HTML Fragments
            let html = `
            <!-- Hero KPIs -->
            <div class="dashboard-grid kpi-grid">
                <div class="card">
                    <div class="kpi-header"><span>Active Projects</span><i class="icon">📈</i></div>

                    <div class="kpi-trend trend-up">▲ 12% vs last quarter</div>

                </div>
                <div class="card">

                    <div class="kpi-value">4.8 pts/spin</div>
                    <div class="kpi-trend trend-up">▲ 5% efficiency gain</div>

            <!-- Head to Head Comparison -->
            <div class="dashboard-grid" style="grid-template-columns: 2fr 1fr;">
                <div class="card h2h-container">

                    <div class="project-vs-card" id="p101-card">
                        <div class="winner-badge">WINNER</div>

                        </div>
                        <div class="h2h-metric">

                        </div>
                        <div class="h2h-metric">

                            <div style="height: 6px; background: var(--border-color); border-radius: 3px;"><div style="width: 32%; height: 100%; background: var(--info); border-radius: 3px;"></div></div>
                        </div>
                    </div>

                    <div class="project-vs-card" id="p102-card">

                        <p style="color:var(--text-secondary); margin-bottom:1.5rem;">Owner: ${projects[1].owner}</p>
                        
                        <div class="h2h-metric">
                            <div class="metric-label"><span>Schedule Adherence</span><span>68%</span></div>
                            <div style="height: 6px; background: var(--border-color); border-radius: 3px;"><div style="width: 68%; height: 100%; background: var(--danger); border-radius: 3px;"></div></div>
                        </div>
                        <div class="h2h-metric">
                            <div class="metric-label"><span>Budget Variance</span><span>-8%</span></div>
                            <div style="height: 6px; background: var(--border-color); border-radius: 3px;"><div style="width: 92%; height: 100%; background: var(--warning); border-radius: 3px;"></div></div>
                        </div>
                         <div class="h2h-metric">
                            <div class="metric-label"><span>Risk Score</span><span>Critical (7.8)</span></div>
                            <div style="height: 6px; background: var(--border-color); border-radius: 3px;"><div style="width: 78%; height: 100%; background: var(--danger); border-radius: 3px;"></div></div>
                        </div>
                    </div>

                    <div class="winner-breakdown">
                        <div class="win-card"><div class="win-title">Schedule</div><div class="win-score">P-101</div></div>
                        <div class="win-card"><div class="win-title">Budget</div><div class="win-score">Tie</div></div>
                        <div class="win-card"><div class="win-title">Quality</div><div class="win-score">P-101</div></div>
                        <div class="win-card"><div class="win-title">Risk Mgmt</div><div class="win-score">P-101</div></div>
                    </div>
                </div>

                <!-- Integrations Panel -->
                <div class="card">
                    <h3 style="margin-bottom: 1rem;">System Health</h3>
                    <div class="status-grid">
                        ${integrations.map(i => `
                            <div>
                                <div class="service-dot" style="${i.status === 'online' ? 'color: var(--success)' : (i.status === 'degraded' ? 'color: var(--warning)' : 'color: var(--danger)')}"></div>
                                <span style="font-size: 0.85rem; display:block;">${i.name}</span>
                                <span style="font-size: 0.7rem; color:var(--text-secondary);">${i.latency ? i.latency + 'ms' : '-'}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>

            <!-- Charts Row -->
            <div class="dashboard-grid charts-grid">
                <div class="card">
                    <h3 style="margin-bottom: 1rem;">Budget vs Actual Spend</h3>
                    <div class="chart-container">
                        <canvas id="budgetChart"></canvas>
                    </div>
                </div>
                <div class="card">
                    <h3 style="margin-bottom: 1rem;">Project Completion Trend</h3>
                    <div class="chart-container">
                        <canvas id="completionChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Project Table -->
            <div class="card" style="margin-top: 1rem;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1rem;">
                    <h3>All Projects</h3>
                    <button style="background:var(--accent-primary); color:white; border:none; padding:0.5rem 1rem; border-radius:6px; cursor:pointer;" onclick="renderProjectsTable()">Refresh Data</button>
                </div>
                <div class="table-wrapper">
                    <table id="projects-table">
                        <thead>
                            <tr>
                                <th onclick="sortData('name')">Project Name ↕</th>
                                <th onclick="sortData('status')">Status ↕</th>
                                <th onclick="sortData('completion')">Completion ↕</th>
                                <th onclick="sortData('budget')">Budget ↕</th>
                                <th onclick="sortData('health')">Health Score ↕</th>
                            </tr>
                        </thead>
                        <tbody id="projects-tbody">
                            <!-- JS Injected -->
                        </tbody>
                    </table>
                </div>
            </div>

             <!-- Timeline & History -->
             <div class="dashboard-grid" style="grid-template-columns: 1fr 2fr;">
                 <div class="card">
                     <h3 style="margin-bottom: 1rem;">Recent Milestones</h3>
                     ${milestones.map(m => `
                        <details>
                            <summary>${m.name} <span style="font-weight:normal; font-size:0.8rem; color:var(--text-secondary);">(${m.date})</span></summary>
                            <div class="details-content">
                                <p><strong>Status:</strong> ${m.status}</p>
                                <p><strong>Project:</strong> ID-${m.projId.split('-')[1]}</p>
                                <p style="margin-top:0.5rem; font-size:0.8rem;">Associated tasks: 42 • Dependencies: API Gateway</p>
                            </div>
                        </details>
                     `).join('')}
                 </div>

                 <div class="card">
                    <h3 style="margin-bottom: 1rem;">Risk Management</h3>
                    ${risks.map(r => `
                        <div style="padding:0.75rem; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <span style="font-weight:600; font-size:0.9rem;">${r.project}</span><br>
                                <span style="font-size:0.75rem; color:var(--text-secondary);">${r.desc.substring(0, 40)}...</span>
                            </div>
                            <div style="display:flex; flex-direction:column; align-items:flex-end;">
                                <span class="status-badge ${r.severity === 'Critical' ? 'bg-red' : (r.severity === 'High' ? 'bg-yellow' : 'bg-green')}">${r.severity}</span>
                                <span style="font-size:0.7rem; color:var(--text-secondary);">Owner: ${r.owner}</span>
                            </div>
                        </div>
                    `).join('')}
                 </div>
             </div>
        `;

            container.innerHTML = html;

            // Render Table Data
            renderProjectsTable();
        }

        function renderProjectsTable() {
            const tbody = document.getElementById('projects-tbody');
            let data = [...projects];

            // Apply Filter
            if (state.filterDept) {
                data = data.filter(p => p.owner.toLowerCase().includes(state.filterDept.toLowerCase()));
            }

            // Apply Sort
            data.sort((a, b) => {
                let valA = a[state.sortCol];
                let valB = b[state.sortCol];

                if (typeof valA === 'string') valA = valA.toLowerCase();
                if (typeof valB === 'string') valB = valB.toLowerCase();

                if (valA < valB) return state.sortOrder === 'asc' ? -1 : 1;
                if (valA > valB) return state.sortOrder === 'asc' ? 1 : -1;
                return 0;
            });

            tbody.innerHTML = data.map(p => `
            <tr>
                <td style="font-weight:600;">${p.name}</td>
                <td><span class="status-badge ${p.status === 'Completed' ? 'bg-green' : (p.status === 'Delayed' ? 'bg-red' : 'bg-yellow')}">${p.status}</span></td>
                <td>${p.completion}%</td>
                <td>$${(p.budget / 1000).toFixed(0)}k</td>
                <td style="color:${p.health > 80 ? 'var(--success)' : (p.health > 60 ? 'var(--warning)' : 'var(--danger)')}">${p.health}</td>
            </tr>
        `).join('');
        }

        function sortData(col) {
            if (state.sortCol === col) {
                state.sortOrder = state.sortOrder === 'asc' ? 'desc' : 'asc';
            } else {
                state.sortCol = col;
                state.sortOrder = 'desc';
            }
            renderProjectsTable();
        }

        function applyFilter(val) {
            state.filterDept = val;
            renderDashboard(); // Re-render to update table
        }

        function switchTab(tabName) {
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');

            if (tabName === 'dashboard') {
                document.getElementById('content-area').innerHTML = ''; // Clear previous content
                renderDashboard();
            } else {
                alert(`This view (${tabName}) is a placeholder for the demo.`);
            }
        }

        function toggleAgileMode() {
            state.agileMode = !state.agileMode;
            const btn = event.currentTarget;
            if (state.agileMode) {
                btn.style.color = 'var(--accent-primary)';
                alert('Switched to Agile View (Sprints, Velocity, Kanban).');
            } else {
                btn.style.color = 'var(--text-secondary)';
                alert('Switched to Waterfall View (Gantt, Milestones, Phases).');
            }
        }

        // --- 5. Chart.js Initialization ---

        function initCharts() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';

            // Common Options
            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: isDark ? '#94a3b8' : '#6b7280' } } },
                scales: {
                    x: { ticks: { color: isDark ? '#94a3b8' : '#6b7280' }, grid: { color: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' } },
                    y: { ticks: { color: isDark ? '#94a3b8' : '#6b7280' }, grid: { color: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' } }
                }
            };

            // Budget Chart (Doughnut)
            const ctxBudget = document.getElementById('budgetChart').getContext('2d');
            charts.budget = new Chart(ctxBudget, {
                type: 'doughnut',
                data: {
                    labels: ['Planned Budget', 'Actual Spend'],
                    datasets: [{
                        data: [totalBudget - totalSpent, totalSpent],
                        backgroundColor: ['#6366f1', '#94a3b8'], // Indigo & Grey
                        borderWidth: 0
                    }]
                },
                options: { ...commonOptions, cutout: '70%' }
            });

            // Completion Chart (Line)
            const ctxComp = document.getElementById('completionChart').getContext('2d');
            charts.completion = new Chart(ctxComp, {
                type: 'line',
                data: {
                    labels: ['Q1', 'Q2', 'Q3', 'Q4'],
                    datasets: [{
                        label: 'Avg Completion %',
                        data: [20, 45, 65, 82],
                        borderColor: '#10b981', // Emerald
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: commonOptions
            });
        }

        function updateChartColors() {
            // Re-render charts to pick up new theme colors from CSS variables if needed
            // (In a real app with dynamic color mapping, we'd rebuild the chart instances)
            initCharts();
        }

        // --- 6. Initialization ---

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderDashboard();
            initCharts();

            // Global Search Listener
            document.getElementById('global-search').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                if (term.length > 2) {
                    alert(`Searching for "${term}"... (Simulated)`);
                }
            });
        });

    </script>
</body>

</html>
