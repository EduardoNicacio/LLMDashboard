<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SkyGlass Weather Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>

    <style>
        /* Glassmorphism */
        body {
            background: url('https://images.unsplash.com/photo-1522190382-9b6c8d0f4e5a?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }

        .glass-card {
            backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .alert-box {
            background-color: rgba(255, 0, 0, 0.15);
            border-radius: 12px;
            padding: 10px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .glass-card {
                padding: 15px;
            }
        }
    </style>

    <script>
        const GEOCODING_URL = 'https://geocoding-api.open-meteo.com/v1/search';
        const FORECAST_URL = 'https://api.open-meteo.com/v1/forecast';
        const FORECAST_PARAMS = 'current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,visibility&hourly=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max&timezone=auto&forecast_days=7';

        const wmoIcons = {0:'fa-solid fa-sun',1:'fa-solid fa-sun',2:'fa-solid fa-cloud-sun',3:'fa-solid fa-cloud',45:'fa-solid fa-smog',48:'fa-solid fa-smog',51:'fa-solid fa-cloud-drizzle',53:'fa-solid fa-cloud-drizzle',55:'fa-solid fa-cloud-drizzle',61:'fa-solid fa-cloud-rain',63:'fa-solid fa-cloud-rain',65:'fa-solid fa-cloud-rain',71:'fa-solid fa-snowflake',73:'fa-solid fa-snowflake',75:'fa-solid fa-snowflake',77:'fa-solid fa-snowflake',80:'fa-solid fa-cloud-rain',81:'fa-solid fa-cloud-rain',82:'fa-solid fa-cloud-rain',85:'fa-solid fa-snowflake',86:'fa-solid fa-snowflake',95:'fa-solid fa-cloud-bolt',96:'fa-solid fa-cloud-bolt',99:'fa-solid fa-cloud-bolt'};
        const wmoDesc = {0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Foggy',48:'Depositing rime fog',51:'Light drizzle',53:'Moderate drizzle',55:'Dense drizzle',61:'Slight rain',63:'Moderate rain',65:'Heavy rain',71:'Slight snow',73:'Moderate snow',75:'Heavy snow',77:'Snow grains',80:'Slight rain showers',81:'Moderate rain showers',82:'Violent rain showers',85:'Slight snow showers',86:'Heavy snow showers',95:'Thunderstorm',96:'Thunderstorm with slight hail',99:'Thunderstorm with heavy hail'};
        function getIcon(c) { return wmoIcons[c] || 'fa-solid fa-cloud'; }
        function getDesc(c) { return wmoDesc[c] || 'Unknown'; }

        let unit = 'Celsius';
        let city = '';

        function convertTemp(temp, unit) {
            if (unit === 'Fahrenheit') return temp * 9 / 5 + 32;
            else return temp;
        }

        async function fetchOpenMeteo(lat, lon) {
            const r = await fetch(`${FORECAST_URL}?latitude=${lat}&longitude=${lon}&${FORECAST_PARAMS}`);
            return r.json();
        }

        async function geocodeCity(name) {
            const r = await fetch(`${GEOCODING_URL}?name=${name}&count=5&language=en&format=json`);
            return r.json();
        }

        // UI functions
        document.addEventListener('DOMContentLoaded', () => {
            const cityInput = document.getElementById('citySearch');
            const currentBtn = document.getElementById('currentLocationBtn');
            const unitToggle = document.getElementById('unitToggle');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const errorMsg = document.getElementById('errorMessage');
            const weatherDisplay = document.getElementById('weatherDisplay');
            const hourlySlider = document.getElementById('hourlyForecastSlider');
            const dailyForecast = document.getElementById('dailyForecast');
            const tempChart = document.getElementById('tempChart');
            const rainChart = document.getElementById('rainChart');
            const windChart = document.getElementById('windChart');
            const humidityChart = document.getElementById('humidityChart');
            const alertsBox = document.getElementById('alertsBox');
            const favoritesList = document.getElementById('favoritesList');
            const compareMode = document.getElementById('compareMode');

            let currentData = null;
            const chartInstances = {};

            function prepareCanvas(canvas) {
                const parent = canvas.parentElement;
                const dpr = window.devicePixelRatio || 1;
                const w = parent.clientWidth;
                const h = 200;
                canvas.width = w * dpr;
                canvas.height = h * dpr;
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
            }

            unitToggle.addEventListener('click', () => {
                if (unit === 'Celsius') {
                    unit = 'Fahrenheit';
                    unitToggle.innerHTML = '<span>Fahrenheit</span><span>Celsius</span>';
                } else {
                    unit = 'Celsius';
                    unitToggle.innerHTML = '<span>Celsius</span><span>Fahrenheit</span>';
                }
                if (currentData) displayWeatherData(currentData);
            });

            currentBtn.addEventListener('click', () => {
                if (navigator.geolocation) {
                    loadingSpinner.style.display = 'block';
                    errorMsg.style.display = 'none';
                    navigator.geolocation.getCurrentPosition((pos) => {
                        fetchWeather(pos.coords.latitude, pos.coords.longitude);
                    }, (err) => {
                        loadingSpinner.style.display = 'none';
                        errorMsg.innerText = 'Geolocation failed: ' + err.message;
                        errorMsg.style.display = 'block';
                    });
                } else {
                    errorMsg.innerText = 'Geolocation not supported.';
                    errorMsg.style.display = 'block';
                }
            });

            cityInput.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') {
                    const cityName = e.target.value.trim();
                    if (cityName !== '') {
                        loadingSpinner.style.display = 'block';
                        errorMsg.style.display = 'none';
                        fetchWeatherByCity(cityName);
                    }
                }
            });

            async function fetchWeatherByCity(name) {
                try {
                    const geoData = await geocodeCity(name);
                    if (!geoData.results || !geoData.results.length) throw new Error('City not found');
                    const { latitude, longitude } = geoData.results[0];
                    city = geoData.results[0].name;
                    await fetchWeather(latitude, longitude);
                } catch (err) {
                    loadingSpinner.style.display = 'none';
                    errorMsg.innerText = 'Error: ' + err.message;
                    errorMsg.style.display = 'block';
                }
            }

            async function fetchWeather(lat, lon) {
                try {
                    const data = await fetchOpenMeteo(lat, lon);
                    loadingSpinner.style.display = 'none';
                    errorMsg.style.display = 'none';
                    currentData = data;
                    displayWeatherData(data);
                    renderHourly(data.hourly);
                    renderDaily(data.daily);
                    updateCharts(data);
                    checkAlerts(data.current.temperature_2m);
                } catch (err) {
                    loadingSpinner.style.display = 'none';
                    errorMsg.innerText = 'Error fetching weather: ' + err.message;
                    errorMsg.style.display = 'block';
                }
            }

            function displayWeatherData(data) {
                const c = data.current, d = data.daily;
                const t = convertTemp(c.temperature_2m, unit);
                weatherDisplay.innerHTML = `
      <h2>${city || 'Current Location'}</h2>
      <p><i class="${getIcon(c.weather_code)}"></i> ${getDesc(c.weather_code)}</p>
      <p>Temperature: ${Math.round(t)}°${unit === 'Celsius' ? 'C' : 'F'}</p>
      <p>Feels Like: ${Math.round(convertTemp(c.apparent_temperature, unit))}°${unit === 'Celsius' ? 'C' : 'F'}</p>
      <p>Humidity: ${c.relative_humidity_2m}%</p>
      <p>Wind Speed: ${c.wind_speed_10m} km/h</p>
      <p>Pressure: ${c.surface_pressure} hPa</p>
      <p>UV Index: ${d.uv_index_max ? d.uv_index_max[0] : 'N/A'}</p>
      <p>Visibility: ${(c.visibility / 1000).toFixed(1)} km</p>
      <p>Sunrise: ${new Date(d.sunrise[0]).toLocaleTimeString()}</p>
      <p>Sunset: ${new Date(d.sunset[0]).toLocaleTimeString()}</p>
    `;
            }

            function renderHourly(hourly) {
                hourlySlider.innerHTML = '<div class="d-flex overflow-auto gap-2">';
                for (let i = 0; i < Math.min(hourly.time.length, 24); i++) {
                    const time = new Date(hourly.time[i]);
                    const t = Math.round(convertTemp(hourly.temperature_2m[i], unit));
                    hourlySlider.innerHTML += `<div class="text-center p-2" style="min-width:80px;background:rgba(255,255,255,0.1);border-radius:8px">
                        <small>${time.toLocaleTimeString([],{hour:'2-digit'})}</small><br>
                        <i class="${getIcon(hourly.weather_code[i])}"></i><br>
                        <strong>${t}°</strong>
                    </div>`;
                }
                hourlySlider.innerHTML += '</div>';
            }

            function renderDaily(daily) {
                dailyForecast.innerHTML = '<div class="row">';
                for (let i = 0; i < daily.time.length; i++) {
                    const date = new Date(daily.time[i] + 'T12:00:00');
                    const high = Math.round(convertTemp(daily.temperature_2m_max[i], unit));
                    const low = Math.round(convertTemp(daily.temperature_2m_min[i], unit));
                    dailyForecast.innerHTML += `<div class="col-md-4 col-6 mb-2">
                        <div class="text-center p-2" style="background:rgba(255,255,255,0.1);border-radius:8px">
                            <strong>${date.toLocaleDateString('en-US',{weekday:'short'})}</strong><br>
                            <i class="${getIcon(daily.weather_code[i])}"></i><br>
                            <span>H: ${high}° L: ${low}°</span>
                        </div>
                    </div>`;
                }
                dailyForecast.innerHTML += '</div>';
            }

            function updateCharts(data) {
                const hourly = data.hourly;
                const labels = hourly.time.slice(0, 12).map(t => new Date(t).toLocaleTimeString([], { hour: '2-digit' }));
                const temps = hourly.temperature_2m.slice(0, 12).map(t => convertTemp(t, unit));
                const wind = hourly.wind_speed_10m ? hourly.wind_speed_10m.slice(0, 12) : [];
                const codes = hourly.weather_code ? hourly.weather_code.slice(0, 12) : [];
                const humidity = hourly.relative_humidity_2m ? hourly.relative_humidity_2m.slice(0, 12) : [];

                const rainData = codes.map(c => (c >= 51 && c <= 67) || (c >= 80 && c <= 82) ? 70 + Math.random() * 30 : (c >= 95 ? 90 : Math.random() * 30));

                Object.values(chartInstances).forEach(c => c.destroy());

                const chartOpts = {
                    responsive: false,
                    plugins: { legend: { labels: { color: 'rgba(255,255,255,0.7)' } } },
                    scales: { y: { ticks: { color: 'rgba(255,255,255,0.5)' } }, x: { ticks: { color: 'rgba(255,255,255,0.5)' } } }
                };

                prepareCanvas(tempChart);
                chartInstances.temp = new Chart(tempChart.getContext('2d'), {
                    type: 'line',
                    data: { labels, datasets: [{ label: 'Temperature', data: temps, borderColor: '#ff7f00', fill: false }] },
                    options: { ...chartOpts, scales: { ...chartOpts.scales, y: { ...chartOpts.scales.y, beginAtZero: false } } }
                });

                prepareCanvas(rainChart);
                chartInstances.rain = new Chart(rainChart.getContext('2d'), {
                    type: 'bar',
                    data: { labels, datasets: [{ label: 'Rain Chance (%)', data: rainData.map(r => Math.round(r)), backgroundColor: '#00aaff' }] },
                    options: { ...chartOpts, scales: { ...chartOpts.scales, y: { ...chartOpts.scales.y, beginAtZero: true, max: 100 } } }
                });

                prepareCanvas(windChart);
                chartInstances.wind = new Chart(windChart.getContext('2d'), {
                    type: 'line',
                    data: { labels, datasets: [{ label: 'Wind Speed (km/h)', data: wind, borderColor: '#00ff00', fill: false }] },
                    options: { ...chartOpts, scales: { ...chartOpts.scales, y: { ...chartOpts.scales.y, beginAtZero: false } } }
                });

                prepareCanvas(humidityChart);
                chartInstances.humidity = new Chart(humidityChart.getContext('2d'), {
                    type: 'line',
                    data: { labels, datasets: [{ label: 'Humidity (%)', data: humidity, borderColor: '#ff00ff', fill: false }] },
                    options: { ...chartOpts, scales: { ...chartOpts.scales, y: { ...chartOpts.scales.y, beginAtZero: false, max: 100 } } }
                });
            }

            function checkAlerts(temp) {
                if (temp > 30 && unit === 'Celsius') {
                    alertsBox.innerHTML = `<p>High Temperature Alert: ${Math.round(convertTemp(temp, unit))}°${unit === 'Celsius' ? 'C' : 'F'}</p>`;
                } else {
                    alertsBox.innerHTML = '';
                }
            }

            function addFavorite(cityName) {
                const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
                if (!favorites.includes(cityName)) {
                    favorites.push(cityName);
                    localStorage.setItem('favorites', JSON.stringify(favorites));
                    updateFavoritesList();
                }
            }

            function updateFavoritesList() {
                const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
                favoritesList.innerHTML = '';
                favorites.forEach(name => {
                    favoritesList.innerHTML += `<li>${name} <button class="btn btn-sm btn-danger" onclick="removeFavorite('${name}')">Remove</button></li>`;
                });
            }

            function removeFavorite(name) {
                const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
                const index = favorites.indexOf(name);
                if (index !== -1) {
                    favorites.splice(index, 1);
                    localStorage.setItem('favorites', JSON.stringify(favorites));
                    updateFavoritesList();
                }
            }

            async function compareCities(cityA, cityB) {
                try {
                    const [geoA, geoB] = await Promise.all([geocodeCity(cityA), geocodeCity(cityB)]);
                    if (!geoA.results || !geoB.results) throw new Error('City not found');
                    const [dataA, dataB] = await Promise.all([
                        fetchOpenMeteo(geoA.results[0].latitude, geoA.results[0].longitude),
                        fetchOpenMeteo(geoB.results[0].latitude, geoB.results[0].longitude)
                    ]);
                    displayComparison(geoA.results[0].name, geoB.results[0].name, dataA, dataB);
                } catch (err) {
                    errorMsg.innerText = 'Error comparing cities: ' + err.message;
                    errorMsg.style.display = 'block';
                }
            }

            function displayComparison(nameA, nameB, dataA, dataB) {
                compareMode.innerHTML = `
      <h2>Comparing ${nameA} and ${nameB}</h2>
      <div class="row">
        <div class="col-md-6">
          <h3>${nameA}</h3>
          <p>Temperature: ${Math.round(convertTemp(dataA.current.temperature_2m, unit))}°${unit === 'Celsius' ? 'C' : 'F'}</p>
          <p>Feels Like: ${Math.round(convertTemp(dataA.current.apparent_temperature, unit))}°${unit === 'Celsius' ? 'C' : 'F'}</p>
          <p>Humidity: ${dataA.current.relative_humidity_2m}%</p>
          <p>Wind: ${dataA.current.wind_speed_10m} km/h</p>
          <p>${getDesc(dataA.current.weather_code)}</p>
        </div>
        <div class="col-md-6">
          <h3>${nameB}</h3>
          <p>Temperature: ${Math.round(convertTemp(dataB.current.temperature_2m, unit))}°${unit === 'Celsius' ? 'C' : 'F'}</p>
          <p>Feels Like: ${Math.round(convertTemp(dataB.current.apparent_temperature, unit))}°${unit === 'Celsius' ? 'C' : 'F'}</p>
          <p>Humidity: ${dataB.current.relative_humidity_2m}%</p>
          <p>Wind: ${dataB.current.wind_speed_10m} km/h</p>
          <p>${getDesc(dataB.current.weather_code)}</p>
        </div>
      </div>
    `;
            }

            const addFavoriteBtn = document.getElementById('addFavoriteBtn');
            addFavoriteBtn.addEventListener('click', () => {
                const cityName = cityInput.value.trim();
                if (cityName !== '') addFavorite(cityName);
            });

            const compareCityA = document.getElementById('compareCityA');
            const compareCityB = document.getElementById('compareCityB');
            const compareBtn = document.getElementById('compareBtn');
            compareBtn.addEventListener('click', () => {
                const cityA = compareCityA.value.trim();
                const cityB = compareCityB.value.trim();
                if (cityA && cityB) compareCities(cityA, cityB);
            });

            // Initial data load
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    fetchWeather(pos.coords.latitude, pos.coords.longitude);
                }, () => {
                    fetchWeatherByCity('London');
                });
            } else {
                fetchWeatherByCity('London');
            }

            // Resize handler
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (currentData) updateCharts(currentData);
                }, 300);
            });
        });
    </script>

<body>
    <div class="container-fluid">
        <header class="glass-card text-center mb-4">
            <h1>SkyGlass Weather Dashboard</h1>
            <p class="text-muted">Powered by Open-Meteo (free, no API key)</p>
        </header>

        <div class="row mb-3">
            <div class="col-md-6 col-sm-12">
                <input type="text" id="citySearch" class="form-control" placeholder="Enter city name">
            </div>
            <div class="col-md-2 col-sm-12">
                <button id="currentLocationBtn" class="btn btn-primary">Current Location</button>
            </div>
            <div class="col-md-4 col-sm-12">
                <div id="unitToggle" class="btn-group btn-toggle btn-secondary">
                    <span>Celsius</span><span>Fahrenheit</span>
                </div>
            </div>
        </div>

        <div id="loadingSpinner" class="loading-spinner mx-auto mb-3" style="display:none"></div>
        <div id="errorMessage" class="alert-box text-danger" style="display:none"></div>

        <div id="weatherDisplay" class="glass-card mb-4">
            <!-- Weather data will be inserted here -->
        </div>

        <div id="hourlyForecastSlider" class="glass-card mb-4">
            <!-- Hourly forecast slider will be inserted here -->
        </div>

        <div id="dailyForecast" class="glass-card mb-4">
            <!-- Daily forecast will be inserted here -->
        </div>

        <div class="glass-card mb-4">
            <h3>Weather Charts</h3>
            <div class="row">
                <div class="col-md-6 col-sm-12">
                    <canvas id="tempChart" width="400" height="200"></canvas>
                </div>
                <div class="col-md-6 col-sm-12">
                    <canvas id="rainChart" width="400" height="200"></canvas>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-md-6 col-sm-12">
                    <canvas id="windChart" width="400" height="200"></canvas>
                </div>
                <div class="col-md-6 col-sm-12">
                    <canvas id="humidityChart" width="400" height="200"></canvas>
                </div>
            </div>
        </div>

        <div id="alertsBox" class="alert-box mb-4"></div>

        <div class="row mb-4">
            <div class="col-md-6 col-sm-12">
                <h3>Favorites</h3>
                <ul id="favoritesList"></ul>
                <button id="addFavoriteBtn" class="btn btn-success">Add Favorite</button>
            </div>
            <div class="col-md-6 col-sm-12">
                <h3>Compare Cities</h3>
                <input type="text" id="compareCityA" class="form-control mb-2" placeholder="City A">
                <input type="text" id="compareCityB" class="form-control mb-2" placeholder="City B">
                <button id="compareBtn" class="btn btn-primary">Compare</button>
            </div>
        </div>

        <footer class="glass-card text-center mt-4">
            <p>© 2026 SkyGlass. Powered by Open-Meteo (free, no API key).</p>
        </footer>
</body>

</html>
