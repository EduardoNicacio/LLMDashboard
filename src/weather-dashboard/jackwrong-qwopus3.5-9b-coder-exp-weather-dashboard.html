<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyGlass | Premium Weather Dashboard</title>

    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- Custom CSS & Glassmorphism --- */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: var(--text-primary);
            overflow-x: hidden;
            transition: background 1s ease;
        }

        /* Dynamic Background Blobs */
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            animation: float 10s infinite alternate;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(20px, -20px) scale(1.1);
            }
        }

        /* Glass Panel Utility */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 24px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Animations */
        .fade-in-up {
            animation: fadeInUp 0.8s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delay-100 {
            animation-delay: 0.1s;
        }

        .delay-200 {
            animation-delay: 0.2s;
        }

        .delay-300 {
            animation-delay: 0.3s;
        }

        /* Custom Scroll Snap for Hourly Forecast */
        .scroll-snap-container {
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 20px;
        }

        .scroll-snap-container::-webkit-scrollbar {
            display: none;
        }

        .scroll-snap-item {
            min-width: 100%;
            scroll-snap-align: center;
            display: flex;
            justify-content: space-between;
            padding: 0 2rem;
        }

        /* Comparison Mode Styling */
        .comparison-active .glass-card.secondary {
            border-color: rgba(168, 85, 247, 0.5);
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.1), transparent);
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col relative">

    <!-- Background Blobs -->
    <div id="bg-blobs" class="fixed inset-0 pointer-events-none overflow-hidden"></div>

    <!-- Header / Navigation -->
    <header class="w-full p-6 flex justify-between items-center z-50 glass-panel absolute top-4 left-4 right-4">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-cloud-bolt text-cyan-400 text-2xl"></i>
            <h1
                class="text-2xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">
                SkyGlass</h1>
        </div>

        <div class="flex items-center gap-3">
            <!-- Search -->
            <div class="relative group">
                <input type="text" id="city-input" placeholder="Search city..."
                    class="bg-black/20 border border-white/10 rounded-full py-2 pl-4 pr-10 text-sm focus:outline-none focus:border-cyan-500 transition-all w-64">
                <i
                    class="fa-solid fa-magnifying-glass absolute right-3 top-2.5 text-gray-400 group-hover:text-white transition-colors"></i>
            </div>

            <!-- Location Button -->
            <button onclick="getLocation()" id="loc-btn" class="p-2 rounded-full hover:bg-white/10 transition-colors">
                <i class="fa-solid fa-location-crosshairs text-cyan-400"></i>
            </button>

            <!-- Unit Toggle -->
            <div class="flex bg-black/20 rounded-lg p-1 border border-white/10">
                <button onclick="setUnit('C')" id="btn-c"
                    class="px-3 py-1 text-xs font-medium rounded-md transition-all bg-white/10 text-white shadow-sm">°C</button>
                <button onclick="setUnit('F')" id="btn-f"
                    class="px-3 py-1 text-xs font-medium rounded-md transition-all text-gray-400 hover:text-white">°F</button>
            </div>

            <!-- Comparison Toggle -->
            <button onclick="toggleComparison()" id="comp-btn"
                class="p-2 rounded-full hover:bg-white/10 transition-colors relative group">
                <i class="fa-solid fa-scale-balanced text-purple-400"></i>
                <span
                    class="absolute -top-8 left-1/2 -translate-x-1/2 bg-black/80 px-2 py-1 rounded text-xs opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Compare
                    Cities</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto p-6 pt-24 z-10 space-y-8">

        <!-- Loading State -->
        <div id="loading"
            class="absolute inset-0 flex items-center justify-center bg-black/50 backdrop-blur-sm z-50 hidden">
            <div class="loader"></div>
        </div>

        <!-- Current Weather Hero -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6 fade-in-up delay-100">

            <!-- Main Card (Temp & Condition) -->
            <div class="lg:col-span-2 glass-panel p-8 relative overflow-hidden group cursor-pointer"
                onclick="fetchWeather()">
                <div id="weather-condition-bg"
                    class="absolute inset-0 bg-gradient-to-br from-blue-900/40 to-purple-900/40 transition-colors duration-1000">
                </div>

                <div class="relative z-10 flex justify-between items-start">
                    <div>
                        <h2 id="city-name"
                            class="text-5xl font-bold tracking-tighter mb-2 text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">
                            Loading...</h2>
                        <p id="weather-desc"
                            class="text-xl text-cyan-300 font-medium capitalize flex items-center gap-2">
                            <i id="condition-icon" class="fa-solid fa-sun"></i>
                            <span id="condition-text">Clear Sky</span>
                        </p>
                    </div>
                    <div class="text-right">
                        <div id="temp-display" class="text-8xl font-bold tracking-tighter drop-shadow-lg">--°</div>
                        <div id="feels-like" class="text-xl text-gray-300 flex items-center justify-end gap-2 mt-1">
                            Feels like <span id="feels-temp">--°</span>
                        </div>
                    </div>
                </div>

                <!-- High/Low -->
                <div class="mt-8 flex justify-between text-sm font-medium border-t border-white/10 pt-4 relative z-10">
                    <span class="text-gray-300"><i class="fa-solid fa-sun mr-2"></i>High: <span id="high-temp"
                            class="text-white">--</span></span>
                    <span class="text-gray-300"><i class="fa-solid fa-moon mr-2"></i>Low: <span id="low-temp"
                            class="text-white">--</span></span>
                </div>

                <!-- Sunrise / Sunset -->
                <div class="mt-4 flex justify-between text-sm relative z-10 opacity-80">
                    <span>Sunrise: <span id="sunrise-time">--</span></span>
                    <span>Sunset: <span id="sunset-time">--</span></span>
                </div>
            </div>

            <!-- Alerts & AQI -->
            <div class="glass-panel p-6 flex flex-col gap-4 fade-in-up delay-200">
                <h3 class="text-lg font-semibold border-b border-white/10 pb-2">Alerts</h3>
                <ul id="alerts-list"
                    class="space-y-2 text-sm text-gray-300 flex-grow overflow-auto max-h-48 custom-scrollbar">
                    <!-- Alerts injected here -->
                </ul>

                <div class="mt-auto pt-6 border-t border-white/10">
                    <h3 class="text-lg font-semibold mb-2">Air Quality</h3>
                    <div id="aqi-container" class="flex items-center gap-4">
                        <!-- AQI injected here -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Charts Row -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-6 fade-in-up delay-300">
            <div class="glass-panel p-4 h-64 relative">
                <h3 class="text-sm font-semibold mb-2 text-gray-400 absolute top-4 left-4 z-10">Temperature Trend</h3>
                <canvas id="tempChart"></canvas>
            </div>
            <div class="glass-panel p-4 h-64 relative">
                <h3 class="text-sm font-semibold mb-2 text-gray-400 absolute top-4 left-4 z-10">Wind Speed</h3>
                <canvas id="windChart"></canvas>
            </div>
        </section>

        <!-- Hourly Forecast Slider -->
        <section class="glass-panel p-6 fade-in-up delay-300">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Hourly Forecast</h2>
                <span id="current-time-display" class="text-sm text-cyan-400 font-mono"></span>
            </div>
            <div class="scroll-snap-container w-full h-32 flex items-end pb-1">
                <!-- Hourly items injected here -->
            </div>
        </section>

        <!-- 7-Day Forecast -->
        <section class="glass-panel p-6 fade-in-up delay-300">
            <h2 class="text-xl font-bold mb-4">7-Day Forecast</h2>
            <div id="daily-forecast" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- Daily items injected here -->
            </div>
        </section>

    </main>

    <!-- Footer / Comparison Mode Overlay -->
    <footer id="comparison-footer"
        class="hidden fixed bottom-0 left-0 w-full p-6 z-50 bg-black/80 backdrop-blur-md border-t border-white/10">
        <div class="container mx-auto flex justify-between items-center text-sm text-gray-400">
            <span>SkyGlass v1.0</span>
            <button onclick="toggleComparison()" id="close-comp-btn"
                class="text-cyan-400 hover:text-white transition-colors">Close Comparison</button>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // ==========================================
        // API CONFIGURATION (Open-Meteo - no API key needed)
        // ==========================================
        const GEO_URL = 'https://geocoding-api.open-meteo.com/v1/search?name={city}&count=5&language=en&format=json';
        const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast';
        const AIR_URL = 'https://air-quality-api.open-meteo.com/v1/air-quality';

        // ==========================================
        // WMO WEATHER CODE MAPPINGS
        // ==========================================
        const wmoDesc = {
            0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
            45: 'Foggy', 48: 'Depositing rime fog',
            51: 'Light drizzle', 53: 'Moderate drizzle', 55: 'Dense drizzle',
            56: 'Freezing drizzle', 57: 'Freezing drizzle',
            61: 'Slight rain', 63: 'Moderate rain', 65: 'Heavy rain',
            66: 'Freezing rain', 67: 'Freezing rain',
            71: 'Slight snow', 73: 'Moderate snow', 75: 'Heavy snow', 77: 'Snow grains',
            80: 'Slight rain showers', 81: 'Moderate rain showers', 82: 'Violent rain showers',
            85: 'Slight snow showers', 86: 'Heavy snow showers',
            95: 'Thunderstorm', 96: 'Thunderstorm with slight hail', 99: 'Thunderstorm with heavy hail'
        };

        function getWmoIcon(code, isDay) {
            if (code <= 1) return isDay ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            if (code === 2) return isDay ? 'fa-solid fa-cloud-sun' : 'fa-solid fa-cloud-moon';
            if (code === 3) return 'fa-solid fa-cloud';
            if (code >= 45 && code <= 48) return 'fa-solid fa-smog';
            if (code >= 51 && code <= 55) return 'fa-solid fa-cloud-drizzle';
            if (code >= 61 && code <= 67) return 'fa-solid fa-cloud-rain';
            if (code >= 71 && code <= 77) return 'fa-solid fa-snowflake';
            if (code >= 80 && code <= 82) return 'fa-solid fa-cloud-rain';
            if (code >= 85 && code <= 86) return 'fa-solid fa-snowflake';
            if (code >= 95 && code <= 99) return 'fa-solid fa-cloud-bolt';
            return 'fa-solid fa-sun';
        }

        function degToCompass(deg) {
            const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
            return dirs[Math.round(deg / 22.5) % 16];
        }

        // ==========================================
        // STATE MANAGEMENT
        // ==========================================
        let state = {
            unit: 'C',
            city: null,
            isComparisonMode: false,
            comparisonCity: null,
            charts: {}
        };

        // ==========================================
        // DOM ELEMENTS
        // ==========================================
        const els = {
            input: document.getElementById('city-input'),
            loading: document.getElementById('loading'),
            city: document.getElementById('city-name'),
            desc: document.getElementById('weather-desc'),
            icon: document.getElementById('condition-icon'),
            temp: document.getElementById('temp-display'),
            feels: document.getElementById('feels-temp'),
            high: document.getElementById('high-temp'),
            low: document.getElementById('low-temp'),
            sunrise: document.getElementById('sunrise-time'),
            sunset: document.getElementById('sunset-time'),
            alerts: document.getElementById('alerts-list'),
            aqi: document.getElementById('aqi-container'),
            hourlyContainer: document.querySelector('.scroll-snap-container'),
            dailyContainer: document.getElementById('daily-forecast'),
            bgBlobs: document.getElementById('bg-blobs')
        };

        // ==========================================
        // INITIALIZATION
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            updateTimeDisplay();
            if (navigator.geolocation) {
                getLocation();
            } else {
                fetchWeather("London");
            }
            els.input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') fetchWeather(els.input.value);
            });
        });

        // ==========================================
        // CORE FUNCTIONS
        // ==========================================

        async function fetchWeather(city = null, callback = null) {
            const targetCity = city || els.input.value;
            if (!targetCity) return;
            showLoading(true);
            try {
                const geoRes = await fetch(GEO_URL.replace('{city}', encodeURIComponent(targetCity)));
                if (!geoRes.ok) throw new Error('City not found');
                const geoData = await geoRes.json();
                if (!geoData.results || geoData.results.length === 0) throw new Error('City not found');
                const { latitude, longitude, name } = geoData.results[0];
                state.city = name;

                const weatherUrl = `${WEATHER_URL}?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,visibility,is_day&hourly=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max&timezone=auto&forecast_days=7`;
                const weatherRes = await fetch(weatherUrl);
                if (!weatherRes.ok) throw new Error('Weather API failed');
                const data = await weatherRes.json();

                let aqiData = null;
                try {
                    const aqiRes = await fetch(`${AIR_URL}?latitude=${latitude}&longitude=${longitude}&current=pm10,pm2_5,european_aqi&timezone=auto`);
                    if (aqiRes.ok) aqiData = await aqiRes.json();
                } catch (e) { }

                updateCurrentUI(data, name, aqiData);
                updateCharts(data.hourly);
                updateHourlySlider(data.hourly);
                updateDailyForecast(data.daily);

            } catch (error) {
                console.error(error);
                els.alerts.innerHTML = `<li class="text-red-400"><i class="fa-solid fa-triangle-exclamation mr-2"></i>${error.message}</li>`;
            } finally {
                showLoading(false);
                if (callback) callback();
            }
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        fetchWeatherByCoords(position.coords.latitude, position.coords.longitude);
                    },
                    () => {
                        alert("Geolocation denied. Please allow location access.");
                    }
                );
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }

        async function fetchWeatherByCoords(lat, lon) {
            showLoading(true);
            try {
                const weatherUrl = `${WEATHER_URL}?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,visibility,is_day&hourly=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max&timezone=auto&forecast_days=7`;
                const weatherRes = await fetch(weatherUrl);
                if (!weatherRes.ok) throw new Error('Weather API failed');
                const data = await weatherRes.json();

                let aqiData = null;
                try {
                    const aqiRes = await fetch(`${AIR_URL}?latitude=${lat}&longitude=${lon}&current=pm10,pm2_5,european_aqi&timezone=auto`);
                    if (aqiRes.ok) aqiData = await aqiRes.json();
                } catch (e) { }

                updateCurrentUI(data, `${lat.toFixed(4)}, ${lon.toFixed(4)}`, aqiData);
                updateCharts(data.hourly);
                updateHourlySlider(data.hourly);
                updateDailyForecast(data.daily);
            } catch (e) {
                console.error(e);
            } finally {
                showLoading(false);
            }
        }

        // ==========================================
        // UI UPDATES
        // ==========================================

        function updateCurrentUI(data, cityName, aqiData) {
            const current = data.current;
            const daily = data.daily;
            const temp = Math.round(current.temperature_2m);
            const feels = Math.round(current.apparent_temperature);
            const weatherCode = current.weather_code;
            const isDay = current.is_day === 1;

            els.city.innerText = cityName || "Unknown Location";

            const descText = wmoDesc[weatherCode] || 'Unknown';
            els.desc.innerHTML = `<i class="${getWmoIcon(weatherCode, isDay)}"></i> <span>${descText}</span>`;
            els.icon.className = getWmoIcon(weatherCode, isDay);

            const displayTemp = state.unit === 'F' ? Math.round(temp * 9 / 5 + 32) : temp;
            const feelsDisplay = state.unit === 'F' ? Math.round(feels * 9 / 5 + 32) : feels;
            els.temp.innerText = `${displayTemp}°`;
            els.feels.innerText = `${feelsDisplay}°`;

            if (daily && daily.temperature_2m_max && daily.temperature_2m_max.length > 0) {
                const hi = Math.round(daily.temperature_2m_max[0]);
                const lo = Math.round(daily.temperature_2m_min[0]);
                els.high.innerText = `${state.unit === 'F' ? Math.round(hi * 9 / 5 + 32) : hi}°`;
                els.low.innerText = `${state.unit === 'F' ? Math.round(lo * 9 / 5 + 32) : lo}°`;
            }

            if (daily && daily.sunrise && daily.sunrise[0]) {
                const formatTime = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                els.sunrise.innerText = formatTime(daily.sunrise[0]);
                els.sunset.innerText = formatTime(daily.sunset[0]);
            }

            els.alerts.innerHTML = '<li class="text-gray-500 italic">No active weather alerts.</li>';

            if (aqiData && aqiData.current) {
                const aqi = aqiData.current.european_aqi || 0;
                els.aqi.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-gray-400 text-sm">Air Quality Index</span>
                        <div class="px-3 py-1 rounded-full ${getAQIColor(aqi)} text-white font-bold shadow-lg border border-white/20">
                            ${aqi}
                        </div>
                    </div>`;
            } else {
                els.aqi.innerHTML = '<span class="text-gray-500 text-sm italic">Air Quality data unavailable</span>';
            }

            updateEnvironment(current.temperature_2m, current.relative_humidity_2m);
        }

        function updateEnvironment(temp, humidity) {
            const hour = new Date().getHours();
            let gradient = "";
            if (temp > 20 && humidity < 50) {
                gradient = "from-orange-400/30 via-pink-600/30 to-purple-900/80";
            } else if (temp < 10 || humidity > 80) {
                gradient = "from-blue-600/50 via-cyan-700/40 to-slate-900/90";
            } else {
                gradient = "from-indigo-900/80 via-purple-900/60 to-black/90";
            }
            if (hour >= 18 || hour < 6) {
                gradient = "from-slate-900/95 via-blue-900/40 to-black/95";
            } else if (hour >= 6 && hour < 12) {
                gradient = "from-orange-300/30 via-yellow-200/20 to-blue-800/60";
            }
            els.bgBlobs.innerHTML = `
                <div class="blob w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply top-[-10%] left-[-10%]" style="background: ${gradient.split(' ')[0]}"></div>
                <div class="blob w-80 h-80 bg-blue-400 rounded-full mix-blend-overlay bottom-[20%] right-[-5%]" style="background: ${gradient.split(' ')[1]}"></div>
            `;
            document.body.style.filter = gradient.includes("blue") ? "brightness(0.8)" : "brightness(1.2)";
        }

        function updateCharts(hourlyData) {
            if (!hourlyData || !hourlyData.time) return;
            const tempCtx = document.getElementById('tempChart').getContext('2d');
            const windCtx = document.getElementById('windChart').getContext('2d');
            if (state.charts.temp) state.charts.temp.destroy();
            if (state.charts.wind) state.charts.wind.destroy();

            const hours = hourlyData.time.slice(0, 6).map(t =>
                new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            );

            state.charts.temp = new Chart(tempCtx, {
                type: 'line',
                data: {
                    labels: hours,
                    datasets: [{
                        label: 'Temperature',
                        data: hourlyData.temperature_2m.slice(0, 6),
                        borderColor: '#22d3ee',
                        backgroundColor: 'rgba(34, 211, 238, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { grid: { color: 'rgba(255,255,255,0.1)' } }, y: { grid: { color: 'rgba(255,255,255,0.1)' } } }
                }
            });

            state.charts.wind = new Chart(windCtx, {
                type: 'bar',
                data: {
                    labels: hours,
                    datasets: [{
                        label: 'Wind Speed (m/s)',
                        data: hourlyData.wind_speed_10m.slice(0, 6),
                        backgroundColor: 'rgba(168, 85, 247, 0.6)',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { grid: { display: false } }, y: { grid: { color: 'rgba(255,255,255,0.1)' } } }
                }
            });
        }

        function updateHourlySlider(hourlyData) {
            if (!hourlyData || !hourlyData.time) return;
            const isDay = new Date().getHours() >= 6 && new Date().getHours() < 18;
            els.hourlyContainer.innerHTML = hourlyData.time.map((t, i) => `
                <div class="scroll-snap-item flex flex-col items-center gap-2 min-w-[80px]">
                    <span class="text-xs text-gray-400">${new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                    <div class="flex flex-col items-center gap-1">
                        <i class="${getWmoIcon(hourlyData.weather_code[i], isDay)} text-xl"></i>
                        <span class="text-lg font-bold">${Math.round(hourlyData.temperature_2m[i])}°</span>
                    </div>
                </div>
            `).join('');
        }

        function updateDailyForecast(dailyData) {
            if (!dailyData || !dailyData.time) return;
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const isDay = new Date().getHours() >= 6 && new Date().getHours() < 18;
            let html = '';
            for (let i = 1; i < dailyData.time.length; i++) {
                const dateObj = new Date(dailyData.time[i]);
                const dayName = days[dateObj.getDay()];
                const maxTemp = Math.round(dailyData.temperature_2m_max[i]);
                const minTemp = Math.round(dailyData.temperature_2m_min[i]);
                const wCode = dailyData.weather_code[i];

                html += `
                    <div class="glass-card p-4 flex items-center gap-4 relative overflow-hidden group">
                        <span class="text-gray-400 font-medium w-8">${dayName}</span>
                        <i class="${getWmoIcon(wCode, isDay)} text-2xl text-white/50 absolute -right-4 top-1/2 -translate-y-1/2 opacity-30"></i>
                        <div class="flex flex-col items-center z-10">
                            <span class="text-xl font-bold">${maxTemp}°</span>
                            <span class="text-xs text-gray-400">${minTemp}°</span>
                        </div>
                        <div class="ml-auto w-12 h-12 rounded-full bg-white/5 flex items-center justify-center z-10">
                            <i class="${getWmoIcon(wCode, isDay)} text-xl"></i>
                        </div>
                    </div>
                `;
            }
            els.dailyContainer.innerHTML = html;
        }

        // ==========================================
        // UTILITIES
        // ==========================================

        function setUnit(unit) {
            state.unit = unit;
            document.getElementById('btn-c').className = unit === 'C' ? "px-3 py-1 text-xs font-medium rounded-md transition-all bg-white/10 text-white shadow-sm" : "px-3 py-1 text-xs font-medium rounded-md transition-all text-gray-400 hover:text-white";
            document.getElementById('btn-f').className = unit === 'F' ? "px-3 py-1 text-xs font-medium rounded-md transition-all bg-white/10 text-white shadow-sm" : "px-3 py-1 text-xs font-medium rounded-md transition-all text-gray-400 hover:text-white";
            fetchWeather(state.city);
        }

        function toggleComparison() {
            state.isComparisonMode = !state.isComparisonMode;
            const footer = document.getElementById('comparison-footer');
            if (state.isComparisonMode) {
                footer.classList.remove('hidden');
                setTimeout(() => fetchWeather("London"), 500);
            } else {
                footer.classList.add('hidden');
                state.comparisonCity = null;
            }
        }

        function getAQIColor(aqi) {
            if (aqi === 0 || aqi == null) return 'bg-gray-500';
            if (aqi <= 50) return 'bg-green-500';
            if (aqi <= 100) return 'bg-yellow-500';
            if (aqi <= 150) return 'bg-orange-500';
            return 'bg-red-500';
        }

        function showLoading(show) {
            els.loading.classList.toggle('hidden', !show);
        }

        function updateTimeDisplay() {
            const now = new Date();
            document.getElementById('current-time-display').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        setInterval(updateTimeDisplay, 60000);
    </script>
</body>

</html>
