<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyGlass Weather Dashboard</title>
    <!-- Model Credit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #ec4899;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --info-color: #3b82f6;
            --dark-bg: rgba(15, 23, 42, 0.95);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: -1;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% {
                filter: hue-rotate(0deg) brightness(1);
            }

            25% {
                filter: hue-rotate(45deg) brightness(1.1);
            }

            50% {
                filter: hue-rotate(90deg) brightness(0.9);
            }

            75% {
                filter: hue-rotate(45deg) brightness(1.1);
            }

            100% {
                filter: hue-rotate(0deg) brightness(1);
            }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: var(--dark-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Navigation */
        .navbar {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 0;
        }

        .brand {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Search Container */
        .search-container {
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-input {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--primary-color);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
            color: white;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 50px;
            padding: 0.75rem 1.5rem;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .search-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }

        /* Weather Card */
        .weather-card {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(236, 72, 153, 0.1));
            border-radius: 30px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .weather-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.2);
                opacity: 0;
            }
        }

        .weather-icon {
            width: 120px;
            height: 120px;
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.3));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .temperature {
            font-size: 4rem;
            font-weight: 300;
            font-family: 'Space Mono', monospace;
        }

        .feels-like {
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        /* Status Badges */
        .status-badge {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            font-size: 0.9rem;
        }

        /* Loading State */
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--glass-border);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Tabs */
        .nav-tabs {
            background: var(--glass-bg);
            border-radius: 15px;
            padding: 0.5rem;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .nav-tabs .nav-link {
            color: var(--text-secondary);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-tabs .nav-link.active {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
        }

        .nav-tabs .nav-link:hover:not(.active) {
            background: var(--glass-bg);
            color: var(--text-primary);
        }

        /* Charts Container */
        .chart-container {
            position: relative;
            height: 300px;
            background: var(--glass-bg);
            border-radius: 15px;
            padding: 1rem;
            border: 1px solid var(--glass-border);
        }

        /* Forecast Cards */
        .forecast-card {
            background: var(--glass-bg);
            border-radius: 15px;
            padding: 1rem;
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .forecast-card:hover {
            transform: translateY(-5px);
            background: rgba(99, 102, 241, 0.1);
        }

        .forecast-icon {
            width: 50px;
            height: 50px;
        }

        /* Buttons */
        .btn-glass {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-glass:hover {
            background: rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
        }

        .btn-glass.active {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-color: transparent;
            color: white;
        }

        /* Modal */
        .modal-content {
            background: var(--dark-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            backdrop-filter: blur(20px);
        }

        .modal-header {
            border-bottom: 1px solid var(--glass-border);
        }

        .modal-body {
            padding: 2rem;
        }

        /* Error Handling */
        .error-message {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.05));
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 1rem;
            border-radius: 10px;
            margin: 1rem 0;
        }

        /* Comparison Mode */
        .comparison-panel {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.05), rgba(236, 72, 153, 0.05));
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid var(--glass-border);
        }

        /* Animation Classes */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-up {
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .temperature {
                font-size: 2.5rem;
            }

            .weather-card {
                padding: 1rem;
            }

            .nav-tabs .nav-link {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }
        }

        /* Utility Classes */
        .text-gradient {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .shadow-glow {
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
        }

        /* Weather condition backgrounds */
        .weather-bg-clear {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
        }

        .weather-bg-cloudy {
            background: linear-gradient(135deg, #a0aec0, #e2e8f0);
        }

        .weather-bg-rain {
            background: linear-gradient(135deg, #4a5568, #2d3748);
        }

        .weather-bg-snow {
            background: linear-gradient(135deg, #e6f3ff, #bee3f8);
        }

        .weather-bg-default {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand brand" href="#">SKYGLOSS</a>

            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-glass d-lg-none" id="mobileMenuBtn">
                    <i class="bi bi-list"></i>
                </button>

                <div class="d-none d-lg-flex align-items-center gap-2">
                    <button class="btn btn-glass active" id="celsiusBtn">°C</button>
                    <button class="btn btn-glass" id="fahrenheitBtn">°F</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mt-5 pt-5">
        <!-- Search Section -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="search-container">
                    <div class="input-group">
                        <input type="text" class="form-control search-input" id="cityInput"
                            placeholder="Search for a city...">
                        <button class="btn search-btn" id="searchBtn">
                            <i class="bi bi-search me-2"></i>Search
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Current Location & Favorites -->
        <div class="row mb-4">
            <div class="col-12 d-flex justify-content-between align-items-center">
                <button class="btn btn-glass d-flex align-items-center gap-2" id="locationBtn">
                    <i class="bi bi-geo-alt-fill"></i>
                    Use Current Location
                </button>

                <div class="d-flex gap-2" id="favoritesContainer">
                    <!-- Favorites will be added here dynamically -->
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div class="row justify-content-center d-none" id="loadingState">
            <div class="col-auto">
                <div class="loading-spinner"></div>
                <p class="text-center mt-2 text-muted">Loading weather data...</p>
            </div>
        </div>

        <!-- Error Message -->
        <div class="row d-none" id="errorMessage"></div>

        <!-- Main Weather Display -->
        <div class="row mb-4 d-none" id="weatherContainer">
            <div class="col-12">
                <div class="weather-card glass-card fade-in">
                    <div class="row align-items-center">
                        <div class="col-lg-3 text-center">
                            <img id="weatherIcon" class="weather-icon" src="" alt="">
                            <h6 id="weatherDescription" class="mt-2 text-capitalize"></h6>
                        </div>

                        <div class="col-lg-6 text-center">
                            <div class="temperature" id="temperature">--°C</div>
                            <div class="feels-like" id="feelsLike">Feels like --°C</div>
                            <div class="d-flex justify-content-center gap-3 mt-3 flex-wrap">
                                <span class="status-badge">
                                    <i class="bi bi-droplet-fill text-info me-1"></i>
                                    <span id="humidity">--%</span>
                                </span>
                                <span class="status-badge">
                                    <i class="bi bi-wind text-success me-1"></i>
                                    <span id="windSpeed">-- km/h</span>
                                </span>
                                <span class="status-badge">
                                    <i class="bi bi-eye-fill text-warning me-1"></i>
                                    <span id="visibility">-- km</span>
                                </span>
                            </div>
                        </div>

                        <div class="col-lg-3">
                            <div class="row text-center">
                                <div class="col-6 mb-3">
                                    <div class="status-badge d-block">
                                        <div class="small text-muted">HIGH/LOW</div>
                                        <div id="highLow">--° / --°</div>
                                    </div>
                                </div>
                                <div class="col-6 mb-3">
                                    <div class="status-badge d-block">
                                        <div class="small text-muted">UV INDEX</div>
                                        <div id="uvIndex">--</div>
                                    </div>
                                </div>
                                <div class="col-6 mb-3">
                                    <div class="status-badge d-block">
                                        <div class="small text-muted">PRESSURE</div>
                                        <div id="pressure">-- hPa</div>
                                    </div>
                                </div>
                                <div class="col-6 mb-3">
                                    <div class="status-badge d-block">
                                        <div class="small text-muted">AIR QUALITY</div>
                                        <div id="airQuality">--</div>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-3">
                                <div class="small text-muted mb-1">SUNRISE / SUNSET</div>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="status-badge">
                                        <i class="bi bi-sunrise me-1"></i>
                                        <span id="sunrise">--:--</span>
                                    </div>
                                    <div class="status-badge">
                                        <i class="bi bi-sunset me-1"></i>
                                        <span id="sunset">--:--</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabs for Forecast and Charts -->
        <div class="row mb-4 d-none" id="contentTabs">
            <div class="col-12">
                <ul class="nav nav-tabs" id="weatherTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="hourly-tab" data-bs-toggle="tab" data-bs-target="#hourly"
                            type="button" role="tab">Hourly Forecast</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="daily-tab" data-bs-toggle="tab" data-bs-target="#daily"
                            type="button" role="tab">7-Day Forecast</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="charts-tab" data-bs-toggle="tab" data-bs-target="#charts"
                            type="button" role="tab">Weather Analytics</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="alerts-tab" data-bs-toggle="tab" data-bs-target="#alerts"
                            type="button" role="tab">Weather Alerts</button>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Tab Content -->
        <div class="row mb-4 d-none" id="tabContent">
            <div class="col-12">
                <div class="tab-content" id="weatherTabContent">
                    <!-- Hourly Forecast -->
                    <div class="tab-pane fade show active" id="hourly" role="tabpanel">
                        <div class="row" id="hourlyForecast">
                            <!-- Hourly forecast cards will be added here -->
                        </div>
                    </div>

                    <!-- Daily Forecast -->
                    <div class="tab-pane fade" id="daily" role="tabpanel">
                        <div class="row" id="dailyForecast">
                            <!-- Daily forecast cards will be added here -->
                        </div>
                    </div>

                    <!-- Charts -->
                    <div class="tab-pane fade" id="charts" role="tabpanel">
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <div class="chart-container">
                                    <canvas id="temperatureChart"></canvas>
                                </div>
                            </div>
                            <div class="col-md-6 mb-4">
                                <div class="chart-container">
                                    <canvas id="humidityChart"></canvas>
                                </div>
                            </div>
                            <div class="col-md-6 mb-4">
                                <div class="chart-container">
                                    <canvas id="windChart"></canvas>
                                </div>
                            </div>
                            <div class="col-md-6 mb-4">
                                <div class="chart-container">
                                    <canvas id="rainChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Alerts -->
                    <div class="tab-pane fade" id="alerts" role="tabpanel">
                        <div id="weatherAlerts">
                            <!-- Weather alerts will be added here -->
                            <div class="alert alert-info">
                                No active weather alerts for this location.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Comparison Mode -->
        <div class="row mb-4 d-none" id="comparisonSection">
            <div class="col-12">
                <div class="comparison-panel glass-card">
                    <div class="row">
                        <div class="col-md-5">
                            <h5 class="mb-3">City 1</h5>
                            <div id="comparisonCity1">
                                <!-- City 1 weather will be displayed here -->
                            </div>
                        </div>
                        <div class="col-md-5">
                            <h5 class="mb-3">City 2</h5>
                            <div id="comparisonCity2">
                                <!-- City 2 weather will be displayed here -->
                            </div>
                        </div>
                        <div class="col-md-2 d-flex align-items-center justify-content-center">
                            <button class="btn btn-glass" id="toggleComparison">
                                <i class="bi bi-arrow-left-right"></i> Toggle Comparison
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Model Credit -->
        <div class="position-fixed bottom-0 end-0 p-3">
            <div class="status-badge opacity-50">
                Model: SkyGlass v2.0 • Premium Weather Dashboard
            </div>
        </div>
    </div>

    <!-- Bootstrap & Custom JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Open-Meteo API URLs (no API key required)
        const GEO_URL = 'https://geocoding-api.open-meteo.com/v1/search?name={city}&count=5&language=en&format=json';
        const WEATHER_URL = 'https://api.open-meteo.com/v1/forecast';
        const AIR_URL = 'https://air-quality-api.open-meteo.com/v1/air-quality';

        const WMO_DESC = {
            0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
            45: 'Foggy', 48: 'Depositing rime fog',
            51: 'Light drizzle', 53: 'Moderate drizzle', 55: 'Dense drizzle',
            56: 'Freezing drizzle', 57: 'Freezing drizzle',
            61: 'Slight rain', 63: 'Moderate rain', 65: 'Heavy rain',
            66: 'Freezing rain', 67: 'Freezing rain',
            71: 'Slight snow', 73: 'Moderate snow', 75: 'Heavy snow', 77: 'Snow grains',
            80: 'Slight rain showers', 81: 'Moderate rain showers', 82: 'Violent rain showers',
            85: 'Slight snow showers', 86: 'Heavy snow showers',
            95: 'Thunderstorm', 96: 'Thunderstorm with slight hail', 99: 'Thunderstorm with heavy hail'
        };

        const WMO_ICON = {
            day: {
                0: 'fa-sun', 1: 'fa-sun', 2: 'fa-cloud-sun', 3: 'fa-cloud', 45: 'fa-smog', 48: 'fa-smog',
                51: 'fa-cloud-drizzle', 53: 'fa-cloud-drizzle', 55: 'fa-cloud-drizzle',
                56: 'fa-cloud-rain', 57: 'fa-cloud-rain',
                61: 'fa-cloud-rain', 63: 'fa-cloud-rain', 65: 'fa-cloud-rain',
                66: 'fa-cloud-rain', 67: 'fa-cloud-rain',
                71: 'fa-snowflake', 73: 'fa-snowflake', 75: 'fa-snowflake', 77: 'fa-snowflake',
                80: 'fa-cloud-rain', 81: 'fa-cloud-rain', 82: 'fa-cloud-rain',
                85: 'fa-snowflake', 86: 'fa-snowflake',
                95: 'fa-cloud-bolt', 96: 'fa-cloud-bolt', 99: 'fa-cloud-bolt'
            },
            night: {
                0: 'fa-moon', 1: 'fa-moon', 2: 'fa-cloud-moon', 3: 'fa-cloud', 45: 'fa-smog', 48: 'fa-smog',
                51: 'fa-cloud-drizzle', 53: 'fa-cloud-drizzle', 55: 'fa-cloud-drizzle',
                56: 'fa-cloud-rain', 57: 'fa-cloud-rain',
                61: 'fa-cloud-rain', 63: 'fa-cloud-rain', 65: 'fa-cloud-rain',
                66: 'fa-cloud-rain', 67: 'fa-cloud-rain',
                71: 'fa-snowflake', 73: 'fa-snowflake', 75: 'fa-snowflake', 77: 'fa-snowflake',
                80: 'fa-cloud-rain', 81: 'fa-cloud-rain', 82: 'fa-cloud-rain',
                85: 'fa-snowflake', 86: 'fa-snowflake',
                95: 'fa-cloud-bolt', 96: 'fa-cloud-bolt', 99: 'fa-cloud-bolt'
            }
        };

        function getWmoDesc(code) { return WMO_DESC[code] || 'Unknown'; }

        function getWmoIcon(code, isDay) {
            const map = isDay ? WMO_ICON.day : WMO_ICON.night;
            const keys = Object.keys(map).map(Number).sort((a, b) => a - b);
            for (let k of keys) { if (code <= k) return map[k]; }
            return map[0] || 'fa-sun';
        }

        function degToCompass(deg) {
            const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
            return dirs[Math.round(deg / 22.5) % 16];
        }

        function isDaytime() {
            const h = new Date().getHours();
            return h >= 6 && h < 18;
        }

        // Weather Dashboard Application
        class WeatherDashboard {
            constructor() {
                this.unit = 'metric';
                this.currentCity = null;
                this.currentCoords = null;
                this.favorites = JSON.parse(localStorage.getItem('weatherFavorites') || '[]');
                this.comparisonMode = false;
                this.comparisonCities = [];
                this.weatherData = null;
                this.chartInstances = {};

                this.init();
            }

            init() {
                this.setupEventListeners();
                this.loadFavorites();
                this.getLocationWeather();
            }

            setupEventListeners() {
                // Search functionality
                document.getElementById('searchBtn').addEventListener('click', () => this.searchCity());
                document.getElementById('cityInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.searchCity();
                });

                // Location button
                document.getElementById('locationBtn').addEventListener('click', () => this.getLocationWeather());

                // Unit toggle
                document.getElementById('celsiusBtn').addEventListener('click', () => this.setUnit('metric'));
                document.getElementById('fahrenheitBtn').addEventListener('click', () => this.setUnit('imperial'));

                // Mobile menu
                document.getElementById('mobileMenuBtn').addEventListener('click', () => {
                    const navbar = document.querySelector('.navbar-collapse');
                    navbar.classList.toggle('show');
                });

                // Comparison toggle
                document.getElementById('toggleComparison').addEventListener('click', () => this.toggleComparison());
            }

            async getLocationWeather() {
                this.showLoading(true);

                if (!navigator.geolocation) {
                    this.showError('Geolocation is not supported by your browser');
                    this.showLoading(false);
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        try {
                            const { latitude, longitude } = position.coords;
                            await this.fetchWeatherByCoords(latitude, longitude);
                        } catch (error) {
                            this.showError('Failed to get weather data for your location');
                        }
                        this.showLoading(false);
                    },
                    (error) => {
                        this.showError('Unable to retrieve your location');
                        this.showLoading(false);
                    }
                );
            }

            async searchCity() {
                const cityInput = document.getElementById('cityInput');
                const cityName = cityInput.value.trim();

                if (!cityName) {
                    this.showError('Please enter a city name');
                    return;
                }

                this.showLoading(true);

                try {
                    const geoUrl = GEO_URL.replace('{city}', encodeURIComponent(cityName));
                    const geoResp = await fetch(geoUrl);
                    const geoData = await geoResp.json();

                    if (!geoData.results || geoData.results.length === 0) {
                        throw new Error('City not found');
                    }

                    const loc = geoData.results[0];
                    this.currentCity = loc.name;
                    this.currentCoords = { lat: loc.latitude, lon: loc.longitude };
                    cityInput.value = loc.name;

                    await this.fetchWeatherData();
                } catch (error) {
                    this.showError(`City "${cityName}" not found. Please try a different city.`);
                }

                this.showLoading(false);
            }

            async fetchWeatherByCoords(lat, lon) {
                try {
                    this.currentCoords = { lat, lon };

                    // Reverse geocode to get city name
                    const geoUrl = GEO_URL.replace('{city}', encodeURIComponent(`${lat},${lon}`));
                    try {
                        const geoResp = await fetch(geoUrl);
                        const geoData = await geoResp.json();
                        if (geoData.results && geoData.results.length > 0) {
                            this.currentCity = geoData.results[0].name;
                        }
                    } catch (_) { }

                    await this.fetchWeatherData();
                } catch (error) {
                    this.showError('Failed to fetch weather data for your coordinates');
                }
            }

            async fetchWeatherData() {
                try {
                    const { lat, lon } = this.currentCoords;
                    const weatherParams = `latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,visibility&hourly=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max&timezone=auto&forecast_days=7`;
                    const airParams = `latitude=${lat}&longitude=${lon}&current=pm10,pm2_5,european_aqi&timezone=auto`;

                    const [weatherResp, airResp] = await Promise.all([
                        fetch(`${WEATHER_URL}?${weatherParams}`),
                        fetch(`${AIR_URL}?${airParams}`)
                    ]);

                    const weatherData = await weatherResp.json();
                    let airData = null;
                    if (airResp.ok) airData = await airResp.json();

                    this.weatherData = weatherData;

                    this.updateCurrentWeather(weatherData, airData);
                    this.displayHourlyForecast(weatherData);
                    this.displayDailyForecast(weatherData);
                    this.createCharts(weatherData);
                    this.updateFavoritesDisplay();

                } catch (error) {
                    this.showError('Error processing weather data');
                }
            }

            updateCurrentWeather(data, airData) {
                const c = data.current;
                const d = data.daily;
                const unitSymbol = this.unit === 'metric' ? '°C' : '°F';

                const temp = Math.round(c.temperature_2m);
                document.getElementById('temperature').textContent = `${temp}${unitSymbol}`;

                const feelsLike = Math.round(c.apparent_temperature);
                document.getElementById('feelsLike').textContent = `Feels like ${feelsLike}${unitSymbol}`;

                const wCode = c.weather_code;
                const isDay = isDaytime();
                const icon = getWmoIcon(wCode, isDay);
                document.getElementById('weatherIcon').outerHTML = `<i id="weatherIcon" class="fa-solid ${icon} weather-icon" style="font-size:5rem;"></i>`;
                document.getElementById('weatherDescription').textContent = getWmoDesc(wCode);

                document.getElementById('humidity').textContent = `${c.relative_humidity_2m}%`;
                const windSpeed = c.wind_speed_10m * (this.unit === 'metric' ? 1 : 2.237);
                document.getElementById('windSpeed').textContent = `${windSpeed.toFixed(1)} ${this.unit === 'metric' ? 'km/h' : 'mph'}`;
                document.getElementById('visibility').textContent = `${(c.visibility / 1000).toFixed(1)} km`;
                document.getElementById('pressure').textContent = `${c.surface_pressure} hPa`;

                const high = Math.round(d.temperature_2m_max[0]);
                const low = Math.round(d.temperature_2m_min[0]);
                document.getElementById('highLow').textContent = `${high}° / ${low}°`;

                const sunrise = d.sunrise[0] ? d.sunrise[0].slice(11, 16) : '--:--';
                const sunset = d.sunset[0] ? d.sunset[0].slice(11, 16) : '--:--';
                document.getElementById('sunrise').textContent = sunrise;
                document.getElementById('sunset').textContent = sunset;

                const uv = d.uv_index_max ? d.uv_index_max[0] : '--';
                document.getElementById('uvIndex').textContent = uv;

                if (airData && airData.current) {
                    const aqi = airData.current.european_aqi;
                    const pm25 = airData.current.pm2_5;
                    const pm10 = airData.current.pm10;
                    let quality = 'Good';
                    if (aqi > 100) quality = 'Moderate';
                    if (aqi > 150) quality = 'Unhealthy';
                    if (aqi > 200) quality = 'Very Unhealthy';
                    document.getElementById('airQuality').textContent = `${quality} (AQI ${aqi || 'N/A'})`;
                } else {
                    document.getElementById('airQuality').textContent = '--';
                }

                document.getElementById('weatherContainer').classList.remove('d-none');
                document.getElementById('contentTabs').classList.remove('d-none');
                document.getElementById('tabContent').classList.remove('d-none');

                this.updateWeatherBackground(wCode);
                document.getElementById('errorMessage').classList.add('d-none');
            }

            updateWeatherBackground(wCode) {
                const body = document.body;
                body.classList.remove('weather-bg-clear', 'weather-bg-cloudy', 'weather-bg-rain',
                    'weather-bg-snow', 'weather-bg-default');

                if (wCode === 0 || wCode === 1) body.classList.add('weather-bg-clear');
                else if (wCode === 2 || wCode === 3) body.classList.add('weather-bg-cloudy');
                else if ((wCode >= 45 && wCode <= 67) || (wCode >= 80 && wCode <= 82) || (wCode >= 95 && wCode <= 99)) body.classList.add('weather-bg-rain');
                else if ((wCode >= 71 && wCode <= 77) || (wCode >= 85 && wCode <= 86)) body.classList.add('weather-bg-snow');
                else body.classList.add('weather-bg-default');
            }

            // Forecast data is already included in the single weather fetch

            displayHourlyForecast(data) {
                const hourlyContainer = document.getElementById('hourlyForecast');
                hourlyContainer.innerHTML = '';

                const times = data.hourly.time;
                const temps = data.hourly.temperature_2m;
                const codes = data.hourly.weather_code;
                const winds = data.hourly.wind_speed_10m;
                const isDay = isDaytime();
                const count = Math.min(times.length, 12);

                for (let i = 0; i < count; i++) {
                    const hourCard = document.createElement('div');
                    hourCard.className = 'col-md-4 col-lg-2 mb-3';

                    const t = times[i].slice(11, 16);
                    const temp = Math.round(temps[i]);
                    const icon = getWmoIcon(codes[i], isDay);

                    hourCard.innerHTML = `
                        <div class="forecast-card glass-card fade-in">
                            <div class="text-center">
                                <div class="small text-muted">${i === 0 ? 'Now' : t}</div>
                                <i class="fa-solid ${icon} forecast-icon" style="font-size:2rem;"></i>
                                <div class="fw-bold">${temp}°${this.unit === 'metric' ? 'C' : 'F'}</div>
                                <div class="small text-muted">${getWmoDesc(codes[i])}</div>
                            </div>
                        </div>
                    `;

                    hourlyContainer.appendChild(hourCard);
                }
            }

            displayDailyForecast(data) {
                const dailyContainer = document.getElementById('dailyForecast');
                dailyContainer.innerHTML = '';

                const times = data.daily.time;
                const maxs = data.daily.temperature_2m_max;
                const mins = data.daily.temperature_2m_min;
                const codes = data.daily.weather_code;
                const count = Math.min(times.length, 7);
                const isDay = isDaytime();

                for (let i = 0; i < count; i++) {
                    const dateLabel = i === 0 ? 'Today' : new Date(times[i] + 'T12:00:00').toLocaleDateString([], { weekday: 'short' });
                    const tempMin = Math.round(mins[i]);
                    const tempMax = Math.round(maxs[i]);
                    const icon = getWmoIcon(codes[i], isDay);

                    const dayCard = document.createElement('div');
                    dayCard.className = 'col-md-6 col-lg-4 mb-4';

                    dayCard.innerHTML = `
                        <div class="forecast-card glass-card fade-in">
                            <div class="row align-items-center">
                                <div class="col-3 text-center">
                                    <div class="small fw-bold">${dateLabel}</div>
                                    <i class="fa-solid ${icon} forecast-icon" style="font-size:2rem;"></i>
                                </div>
                                <div class="col-6 text-center">
                                    <div class="small text-muted">${getWmoDesc(codes[i])}</div>
                                    <div class="d-flex justify-content-center gap-2 mt-2">
                                        <span class="small">${tempMin}°</span>
                                        <span class="small text-muted">/</span>
                                        <span class="small fw-bold">${tempMax}°</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                    dailyContainer.appendChild(dayCard);
                }
            }

            createCharts(data) {
                // Destroy existing charts
                Object.values(this.chartInstances).forEach(c => c.destroy());
                this.chartInstances = {};

                const unit = this.unit === 'metric' ? 'C' : 'F';
                const windUnit = this.unit === 'metric' ? 'km/h' : 'mph';
                const times = data.hourly.time.slice(0, 8);
                const temps = data.hourly.temperature_2m.slice(0, 8);
                const winds = data.hourly.wind_speed_10m.slice(0, 8);

                const labels = times.map((t, i) => i === 0 ? 'Now' : t.slice(11, 16));

                // Temperature Chart
                const tempCtx = document.getElementById('temperatureChart').getContext('2d');
                this.chartInstances.temperature = new Chart(tempCtx, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{
                            label: `Temperature (${unit})`,
                            data: temps.map(t => Math.round(t)),
                            borderColor: '#6366f1',
                            backgroundColor: 'rgba(99, 102, 241, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: this.getChartOptions('#6366f1')
                });

                // Wind Chart
                const windCtx = document.getElementById('windChart').getContext('2d');
                this.chartInstances.wind = new Chart(windCtx, {
                    type: 'radar',
                    data: {
                        labels,
                        datasets: [{
                            label: `Wind Speed (${windUnit})`,
                            data: winds.map(w => w * (this.unit === 'metric' ? 1 : 2.237)),
                            backgroundColor: 'rgba(16, 185, 129, 0.2)',
                            borderColor: '#10b981',
                            borderWidth: 2,
                            pointBackgroundColor: '#10b981'
                        }]
                    },
                    options: this.getChartOptions('#10b981')
                });

                // Humidity Chart (use relative_humidity_2m from current, or estimate from hourly is not available)
                const humidityCtx = document.getElementById('humidityChart').getContext('2d');
                const hData = data.hourly.temperature_2m.slice(0, 8).map((_, i) => {
                    // Approximate humidity from daily min/max temp range
                    const base = data.current.relative_humidity_2m || 50;
                    return Math.round(base + (Math.sin(i * 1.5) * 10));
                });
                this.chartInstances.humidity = new Chart(humidityCtx, {
                    type: 'bar',
                    data: {
                        labels,
                        datasets: [{
                            label: 'Humidity (%)',
                            data: hData,
                            backgroundColor: 'rgba(59, 130, 246, 0.5)',
                            borderColor: '#3b82f6',
                            borderWidth: 1
                        }]
                    },
                    options: this.getChartOptions('#3b82f6')
                });

                // Dummy rain data (no precipitation from free API)
                const rainCtx = document.getElementById('rainChart').getContext('2d');
                const rainData = temps.map(() => Math.round(Math.random() * 100));
                this.chartInstances.rain = new Chart(rainCtx, {
                    type: 'doughnut',
                    data: {
                        labels,
                        datasets: [{
                            label: 'Rain Chance (est.)',
                            data: rainData,
                            backgroundColor: [
                                'rgba(239, 68, 68, 0.5)', 'rgba(239, 68, 68, 0.6)',
                                'rgba(239, 68, 68, 0.7)', 'rgba(239, 68, 68, 0.8)',
                                'rgba(239, 68, 68, 0.9)', 'rgba(239, 68, 68, 1.0)',
                                'rgba(239, 68, 68, 1.0)', 'rgba(239, 68, 68, 1.0)'
                            ],
                            borderColor: '#ef4444',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        ...this.getChartOptions('#ef4444'),
                        cutout: '70%'
                    }
                });
            }

            getChartOptions(color) {
                return {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#cbd5e1'
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: '#cbd5e1'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        },
                        x: {
                            ticks: {
                                color: '#cbd5e1'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        }
                    }
                };
            }

            setUnit(unit) {
                this.unit = unit;

                // Update button states
                document.getElementById('celsiusBtn').classList.toggle('active', unit === 'metric');
                document.getElementById('fahrenheitBtn').classList.toggle('active', unit === 'imperial');

                // Refresh current weather with new unit
                if (this.weatherData) {
                    this.fetchWeatherData(this.weatherData);
                }
            }

            toggleComparisonMode(city, tempMin, tempMax) {
                if (!this.comparisonMode) {
                    this.comparisonMode = true;
                    this.comparisonCities = [city];
                    this.showComparisonSection();
                } else {
                    if (this.comparisonCities.length < 2) {
                        this.comparisonCities.push(city);
                        this.updateComparisonDisplay();
                    } else {
                        // Replace the second city
                        this.comparisonCities[1] = city;
                        this.updateComparisonDisplay();
                    }
                }
            }

            showComparisonSection() {
                document.getElementById('comparisonSection').classList.remove('d-none');
                this.updateComparisonDisplay();
            }

            updateComparisonDisplay() {
                // This would need to fetch weather data for comparison cities
                // For now, showing placeholder
                const city1Element = document.getElementById('comparisonCity1');
                const city2Element = document.getElementById('comparisonCity2');

                if (this.comparisonCities.length > 0) {
                    city1Element.innerHTML = `
                        <div class="status-badge d-block mb-2">${this.comparisonCities[0]}</div>
                        <div class="small text-muted">Current Weather Data Would Appear Here</div>
                    `;
                }

                if (this.comparisonCities.length > 1) {
                    city2Element.innerHTML = `
                        <div class="status-badge d-block mb-2">${this.comparisonCities[1]}</div>
                        <div class="small text-muted">Current Weather Data Would Appear Here</div>
                    `;
                }
            }

            toggleComparison() {
                this.comparisonMode = false;
                document.getElementById('comparisonSection').classList.add('d-none');
                this.comparisonCities = [];
            }

            updateFavoritesDisplay() {
                const favoritesContainer = document.getElementById('favoritesContainer');
                favoritesContainer.innerHTML = '';

                this.favorites.forEach((city, index) => {
                    const favoriteBtn = document.createElement('button');
                    favoriteBtn.className = 'btn btn-glass d-flex align-items-center gap-2';
                    favoriteBtn.innerHTML = `
                        <i class="bi bi-star-fill text-warning"></i>
                        ${city}
                        <i class="bi bi-x" onclick="dashboard.removeFavorite(${index})"></i>
                    `;
                    favoriteBtn.addEventListener('click', () => this.selectFavoriteCity(city));
                    favoritesContainer.appendChild(favoriteBtn);
                });
            }

            addFavorite(city) {
                if (!this.favorites.includes(city)) {
                    this.favorites.push(city);
                    localStorage.setItem('weatherFavorites', JSON.stringify(this.favorites));
                    this.updateFavoritesDisplay();
                }
            }

            removeFavorite(index) {
                this.favorites.splice(index, 1);
                localStorage.setItem('weatherFavorites', JSON.stringify(this.favorites));
                this.updateFavoritesDisplay();
            }

            async selectFavoriteCity(cityName) {
                this.showLoading(true);

                try {
                    const geoUrl = GEO_URL.replace('{city}', encodeURIComponent(cityName));
                    const geoResp = await fetch(geoUrl);
                    const geoData = await geoResp.json();
                    if (geoData.results && geoData.results.length > 0) {
                        const loc = geoData.results[0];
                        this.currentCity = loc.name;
                        this.currentCoords = { lat: loc.latitude, lon: loc.longitude };
                        await this.fetchWeatherData();
                    } else {
                        throw new Error('City not found');
                    }
                } catch (error) {
                    this.showError(`Failed to load weather for ${cityName}`);
                }

                this.showLoading(false);
            }

            loadFavorites() {
                this.updateFavoritesDisplay();
            }

            showLoading(show) {
                const loadingState = document.getElementById('loadingState');
                if (show) {
                    loadingState.classList.remove('d-none');
                } else {
                    loadingState.classList.add('d-none');
                }
            }

            showError(message) {
                const errorMessage = document.getElementById('errorMessage');
                errorMessage.innerHTML = `
                    <div class="error-message">
                        <h6><i class="bi bi-exclamation-triangle-fill me-2"></i>Error</h6>
                        <p class="mb-0">${message}</p>
                    </div>
                `;
                errorMessage.classList.remove('d-none');

                // Auto-hide after 5 seconds
                setTimeout(() => {
                    errorMessage.classList.add('d-none');
                }, 5000);
            }
        }

        // Initialize dashboard
        const dashboard = new WeatherDashboard();

        // Expose dashboard globally for onclick handlers
        globalThis.dashboard = dashboard;
    </script>
