<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyGlass | Premium Weather Dashboard</title>
    <!-- Bootstrap CSS for quick responsiveness and utility -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

    <style>
        /* ======================================== */
        /* 🎨 GLOBAL STYLES & GLASSMORPHISM */
        /* ======================================== */
        :root {
            --primary-color: #007bff;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            transition: background-color 1s ease, background-image 1s ease;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Dynamic Background Styling (Simulated) */
        body.sunny {
            background: linear-gradient(to bottom right, #ffcc80, #ffab91);
        }

        body.rainy {
            background: linear-gradient(to bottom right, #4a69bd, #2c3e50);
        }

        body.night {
            background: radial-gradient(circle at center, #1b2735 0%, #0d1117 100%);
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            transition: all 0.5s ease;
        }

        /* Main Layout */
        #app-container {
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-content {
            width: 100%;
            max-width: 1400px;
        }

        /* Header & Search */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .search-bar input,
        .unit-toggle button {
            border-radius: 50px;
            padding: 12px 25px;
            border: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        /* Current Weather Display */
        #current-weather {
            text-align: center;
            padding: 40px;
            margin-bottom: 25px;
        }

        #temp-display {
            font-size: 6rem;
            font-weight: 700;
            line-height: 1;
        }

        .weather-icon {
            font-size: 4rem;
            margin: 15px 0;
        }

        /* Forecast Sections */
        .forecast-section {
            margin-top: 30px;
        }

        .hourly-slider-container {
            overflow-x: auto;
            padding-bottom: 20px;
            white-space: nowrap;
            scrollbar-width: none;
            /* Firefox */
        }

        .hourly-slider-container::-webkit-scrollbar {
            display: none;
            /* Chrome, Safari, Opera */
        }

        /* Charts */
        #chartCanvasContainer {
            height: 300px;
            margin-top: 20px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            #temp-display {
                font-size: 4rem;
            }

            .glass-card {
                padding: 20px !important;
            }

            body {
                padding: 10px;
            }
        }

        /* Loading State */
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid var(--primary-color);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div id="app-container">
        <div class="main-content">
            <!-- Header & Search -->
            <header class="glass-card p-4 mb-4 text-white" style="background: rgba(0, 123, 255, 0.2);">
                <h1 class="display-4 fw-bold mb-1">SkyGlass</h1>
                <p class="mb-3 opacity-75">Your personalized atmospheric companion.</p>

                <div class="d-flex justify-content-center gap-3 search-bar">
                    <input type="text" id="cityInput" placeholder="Enter city name (e.g., London)"
                        class="form-control w-auto" />
                    <button id="searchButton" class="btn btn-primary"><i class="fas fa-search me-2"></i> Search</button>
                    <button id="currentLocationBtn" class="btn btn-outline-light"><i
                            class="fas fa-location-on me-1"></i> Current Location</button>
                </div>

                <!-- Unit Toggle -->
                <div class="mt-3 d-flex justify-center gap-2">
                    <span class="text-muted small">Units:</span>
                    <button id="unitC" class="btn btn-sm btn-outline-light active">°C</button>
                    <button id="unitF" class="btn btn-sm btn-outline-light">°F</button>
                </div>
            </header>

            <!-- Current Weather Display -->
            <div id="current-weather" class="glass-card text-center">
                <div id="loadingIndicator" class="loader mx-auto mb-3 d-none"></div>
                <h2 id="cityName" class="mb-1 fs-1">Welcome to SkyGlass</h2>
                <p id="dateDisplay" class="text-muted"></p>

                <i id="weatherIcon" class="fas fa-sun weather-icon mb-3"></i>
                <div id="temp-display">--</div>
                <p id="description" class="fs-4 fw-bold text-white mb-2"></p>

                <!-- Detailed Stats -->
                <div class="row g-3 mt-4" id="detailsGrid">
                    <div class="col-md-3 col-6">
                        <div class="glass-card p-3 text-center"><i class="fas fa-tint text-info me-2"></i> Humidity:
                            <span id="humidity">-</span>%</div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="glass-card p-3 text-center"><i class="fas fa-wind text-primary me-2"></i> Wind:
                            <span id="windSpeed">-</span> m/s</div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="glass-card p-3 text-center"><i class="fas fa-tachometer-alt text-warning me-2"></i>
                            Pressure: <span id="pressure">-</span> hPa</div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="glass-card p-3 text-center"><i class="fas fa-eye text-success me-2"></i> Visibility:
                            <span id="visibility">-</span> km</div>
                    </div>
                </div>

                <!-- Sunrise/Sunset & Air Quality -->
                <div class="row g-3 mt-4" id="secondaryDetailsGrid">
                    <div class="col-md-6">
                        <div class="glass-card p-3 text-center small"><i class="fas fa-sunrise me-2"></i> Sunrise: <span
                                id="sunrise">-</span></div>
                    </div>
                    <div class="col-md-6">
                        <div class="glass-card p-3 text-center small"><i class="fas fa-sunset me-2"></i> Sunset: <span
                                id="sunset">-</span></div>
                    </div>
                </div>

            </div>

            <!-- Forecast Tabs -->
            <div class="row g-4 forecast-section">
                <!-- Hourly Forecast (Slider) -->
                <div class="col-lg-12 glass-card p-3">
                    <h5 class="mb-3 text-white"><i class="fas fa-clock me-2"></i> Hourly Forecast</h5>
                    <div id="hourlyForecast" class="d-flex overflow-x-auto py-3 hourly-slider-container">
                        <!-- Hourly cards injected here -->
                    </div>
                </div>

                <!-- 7-Day Forecast & Charts -->
                <div class="col-lg-12 glass-card p-4">
                    <h5 class="mb-3 text-white"><i class="fas fa-chart-line me-2"></i> Temperature Trend (Next 7 Days)
                    </h5>
                    <canvas id="tempChart"></canvas>
                </div>

                <!-- Comparison Mode / Alerts -->
                <div class="col-lg-12 glass-card p-4 mt-3" style="background: rgba(0, 0, 0, 0.1);">
                    <h5 class="mb-3 text-white"><i class="fas fa-bell me-2"></i> Weather Alerts & Comparison</h5>
                    <div id="alertsBox" class="alert alert-warning small mb-3 d-none" role="alert"></div>
                    <div class="d-flex gap-3 align-items-center">
                        <input type="text" id="compareCityInput" placeholder="Compare with another city..."
                            class="form-control w-50" />
                        <button id="compareButton" class="btn btn-outline-light"><i
                                class="fas fa-exchange-alt me-1"></i> Compare</button>
                    </div>
                </div>

            </div>

        </div>
    </div>


    <!-- ======================================== -->
    <!-- ⚙️ JAVASCRIPT & API LOGIC -->
    <!-- ======================================== -->
    <script>
        // ===============================================================
        // !!! CONFIGURATION AREA - REPLACE WITH YOUR ACTUAL KEY !!!
        // ===============================================================
        const API_KEY = "YOUR_API_KEY_HERE";
        const BASE_URL = "https://api.openweathermap.org/data/2.5/";

        // State Management
        let currentWeatherData = null;
        let unitSystem = 'metric'; // 'metric' for Celsius, 'imperial' for Fahrenheit
        let tempChartInstance = null;

        // DOM Elements Cache
        const elements = {
            cityInput: document.getElementById('cityInput'),
            searchButton: document.getElementById('searchButton'),
            currentLocationBtn: document.getElementById('currentLocationBtn'),
            unitC: document.getElementById('unitC'),
            unitF: document.getElementById('unitF'),
            loadingIndicator: document.getElementById('loadingIndicator'),
            cityName: document.getElementById('cityName'),
            dateDisplay: document.getElementById('dateDisplay'),
            weatherIcon: document.getElementById('weatherIcon'),
            tempDisplay: document.getElementById('temp-display'),
            description: document.getElementById('description'),
            humidity: document.getElementById('humidity'),
            windSpeed: document.getElementById('windSpeed'),
            pressure: document.getElementById('pressure'),
            visibility: document.getElementById('visibility'),
            sunrise: document.getElementById('sunrise'),
            sunset: document.getElementById('sunset'),
            hourlyForecastContainer: document.getElementById('hourlyForecast'),
            tempChartCanvas: document.getElementById('tempChart'),
            alertsBox: document.getElementById('alertsBox'),
        };

        // ===============================================================
        // 🛠️ UTILITY FUNCTIONS
        // ===============================================================

        /** Converts Unix timestamp to readable time string */
        const formatTime = (timestamp) => {
            return new Date(timestamp * 1000).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        };

        /** Converts Unix timestamp to readable date string */
        const formatDate = (timestamp) => {
            return new Date(timestamp * 1000).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
        };

        /** Updates the visual theme based on weather/time */
        const updateTheme = (weatherCode, timeOfDay) => {
            let bodyClass = '';
            if (timeOfDay === 'night') {
                bodyClass = 'night';
            } else if (['0600', '1800'].includes(String(Math.floor(new Date().getHours())))) { // Sunset/Sunrise approximation
                bodyClass = 'sunny';
            } else if (weatherCode >= 200 && weatherCode < 300) { // Thunderstorm/Rainy codes often start with 5xx or 6xx
                bodyClass = 'rainy';
            } else {
                bodyClass = 'sunny';
            }

            document.body.className = bodyClass;
        };

        /** Maps OpenWeatherMap condition to an icon class */
        const getWeatherIcon = (main) => {
            switch (main) {
                case 'Clear': return '<i class="fas fa-sun"></i>';
                case 'Clouds': return '<i class="fas fa-cloud"></i>';
                case 'Rain': return '<i class="fas fa-cloud-show-rain"></i>';
                case 'Drizzle': return '<i class="fas fa-cloud-show-scatter-rain"></i>';
                case 'Snow': return '<i class="fas fa-snowflake"></i>';
                case 'Thunderstorm': return '<i class="fas fa-bolt"></i>';
                default: return '<i class="fas fa-smog"></i>';
            }
        };

        // ===============================================================
        // 📡 API FETCH LOGIC
        // ===============================================================

        /** Handles the loading state UI */
        const setLoading = (isLoading) => {
            elements.loadingIndicator.classList.toggle('d-none', !isLoading);
            document.querySelectorAll('#current-weather *').forEach(el => {
                if (!['loadingIndicator'].includes(el.id)) el.style.opacity = isLoading ? '0.5' : '1';
            });
        };

        /** Fetches current weather data for a given city */
        const fetchCurrentWeather = async (city) => {
            if (!API_KEY || API_KEY === "YOUR_OPENWEATHERMAP_API_KEY") {
                alert("ERROR: Please replace 'YOUR_OPENWEATHERMAP_API_KEY' in the script with your actual key.");
                return;
            }

            setLoading(true);
            try {
                const url = `${BASE_URL}weather?q=${city}&appid=${API_KEY}`;
                const response = await fetch(url);

                if (!response.ok) throw new Error(`City not found or API error: ${response.statusText}`);

                const data = await response.json();
                currentWeatherData = data;
                updateUI(data);
            } catch (error) {
                console.error("Weather Fetch Error:", error);
                alert(`Could not fetch weather for ${city}. Please check the city name or your API key.`);
                currentWeatherData = null;
            } finally {
                setLoading(false);
            }
        };

        /** Fetches 7-day forecast data */
        const fetchForecastData = async (lat, lon) => {
            if (!API_KEY || API_KEY === "YOUR_OPENWEATHERMAP_API_KEY") return [];
            try {
                // 5 day / 3 hour forecast is usually sufficient for a good daily summary
                const url = `${BASE_URL}forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Forecast API error: ${response.statusText}`);
                return await response.json();
            } catch (error) {
                console.error("Forecast Fetch Error:", error);
                return [];
            }
        };

        /** Fetches Air Quality data */
        const fetchAirQuality = async (lat, lon) => {
            if (!API_KEY || API_KEY === "YOUR_OPENWEATHERMAP_API_KEY") return null;
            try {
                const url = `${BASE_URL}air_pollution?lat=${lat}&lon=${lon}&appid=${API_KEY}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Air Quality API error: ${response.statusText}`);
                return await response.json();
            } catch (error) {
                console.error("Air Quality Fetch Error:", error);
                return null;
            }
        };

        // ===============================================================
        // 🖥️ UI RENDERING LOGIC
        // ===============================================================

        /** Updates all visible weather data points */
        const updateUI = (data) => {
            if (!data) return;

            const tempUnit = unitSystem === 'metric' ? 'C' : 'F';
            const toTargetUnit = (value, fromUnit) => {
                if (fromUnit === 'metric' && unitSystem === 'imperial') {
                    return (value * 9 / 5) + 32; // C to F
                } else if (fromUnit === 'imperial' && unitSystem === 'metric') {
                    return ((value - 32) * 5 / 9); // F to C
                }
                return value;
            };

            const tempK = data.main.temp;
            const currentTemp = toTargetUnit(tempK, 'metric');
            const feelsLike = toTargetUnit(data.main.feels_like, 'metric');

            // 1. Core Info Update
            elements.cityName.textContent = data.name || "Weather Data";
            elements.dateDisplay.textContent = formatDate(data.dt);
            elements.description.textContent = data.weather[0].description.toUpperCase();
            elements.tempDisplay.textContent = `${Math.round(currentTemp)}${tempUnit}`;

            // 2. Icon & Theme Update
            const weatherMain = data.weather[0].main;
            elements.weatherIcon.className = `fas ${getWeatherIcon(weatherMain).replace('<i class="fas ', '').replace('</i>', '')}`;
            updateTheme(data.weather[0].id, new Date().getHours());

            // 3. Detailed Stats Update (Unit Conversion handled internally)
            elements.humidity.textContent = data.main.humidity;
            elements.windSpeed.textContent = `${data.wind.speed} ${unitSystem === 'metric' ? 'm/s' : 'mph'}`;
            elements.pressure.textContent = data.main.pressure;
            elements.visibility.textContent = (data.visibility / 1000).toFixed(1); // Convert meters to km

            // 4. Time Data Update
            const sunriseTime = formatTime(data.sys.sunrise);
            const sunsetTime = formatTime(data.sys.sunset);
            elements.sunrise.textContent = sunriseTime;
            elements.sunset.textContent = sunsetTime;

            // 5. Air Quality Integration (Requires separate call)
            fetchAirQuality(data.coord.lat, data.coord.lon).then(aqData => {
                if (aqData && aqData.list[0].main) {
                    const airQualityIndex = aqData.list[0].main.aqi;
                    let qualityText = "";
                    switch (airQualityIndex) {
                        case 1: qualityText = "Good"; break;
                        case 2: qualityText = "Fair"; break;
                        case 3: qualityText = "Moderate"; break;
                        default: qualityText = "Poor";
                    }
                    // Inject AQI into a dedicated spot or update visibility/description if needed.
                    console.log(`Air Quality Index: ${airQualityIndex}`);
                } else {
                    elements.alertsBox.textContent = "Air Quality data unavailable for this location.";
                    elements.alertsBox.classList.remove('d-none');
                }
            });

            // 6. Forecast Rendering (Requires separate call)
            renderForecast(data.coord.lat, data.coord.lon);
        };

        /** Renders the hourly forecast cards */
        const renderHourlyForecast = (forecastData) => {
            elements.hourlyForecastContainer.innerHTML = '';
            if (!forecastData || !forecastData.list) return;

            // Show next 12 hours for a good slider view
            const hourlyList = forecastData.list.slice(0, 12);

            hourlyList.forEach(item => {
                const time = new Date(item.dt * 1000).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                const temp = toTargetUnit(item.main.temp, 'metric');
                const iconHtml = getWeatherIcon(item.weather[0].main);

                const card = document.createElement('div');
                card.className = `glass-card p-3 text-center me-2 flex-shrink-0 w-100`;
                card.innerHTML = `
                    <p class="mb-1 small">${time}</p>
                    <i class="fas ${getWeatherIcon(item.weather[0].main).replace('<i class="fas ', '').replace('</i>', '')} fs-3 mb-1"></i>
                    <p class="fw-bold">${Math.round(temp)}${unitSystem === 'metric' ? '°C' : '°F'}</p>
                `;
                elements.hourlyForecastContainer.appendChild(card);
            });
        };

        /** Renders the 7-day forecast and updates charts */
        const renderForecast = async (lat, lon) => {
            // Fetch detailed forecast data
            const forecastData = await fetchForecastData(lat, lon);
            renderHourlyForecast(forecastData); // Reuses hourly rendering logic for simplicity

            // Prepare 7-day summary data for charting
            const dailySummaries = {};
            const dates = [];

            // Group by day (00:00 UTC) to get min/max for the day
            forecastData.list.forEach(item => {
                const dateKey = new Date(item.dt * 1000).toDateString();
                if (!dailySummaries[dateKey]) {
                    dailySummaries[dateKey] = { temps: [], rainChance: 0, windSpeeds: [] };
                    dates.push(new Date(item.dt * 1000)); // Store date object for labels
                }
                const temp = toTargetUnit(item.main.temp, 'metric');
                dailySummaries[dateKey].temps.push(temp);
                // Rain chance is often derived from precipitation amount in OpenWeatherMap forecast API
            });

            // Finalize daily data structure for charting
            const chartLabels = [];
            const tempsData = [];
            const rainChanceData = [];

            Object.keys(dailySummaries).forEach((dateKey, index) => {
                const summary = dailySummaries[dateKey];
                // Calculate average temperature for the day
                const avgTemp = Math.round(summary.temps.reduce((a, b) => a + b, 0) / summary.temps.length);

                chartLabels.push(dates[index].toLocaleDateString('en-US', { weekday: 'short' }));
                tempsData.push(avgTemp);
                // Placeholder for rain chance (requires more complex parsing of precipitation data)
                rainChanceData.push(Math.floor(Math.random() * 50)); // Mocking random chance for demo
            });

            updateChart(chartLabels, tempsData, rainChanceData);
        };


        /** Initializes or updates the Chart.js instance */
        const updateChart = (labels, tempValues, rainValues) => {
            if (tempChartInstance) {
                tempChartInstance.destroy(); // Destroy previous chart instance
            }

            const ctx = elements.tempChartCanvas.getContext('2d');
            tempChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: `Temperature (${unitSystem === 'metric' ? '°C' : '°F'})`,
                            data: tempValues,
                            borderColor: '#007bff',
                            backgroundColor: 'rgba(0, 123, 255, 0.1)',
                            fill: true,
                            tension: 0.4 // Smooth curve
                        },
                        {
                            label: `Rain Chance (%)`,
                            data: rainValues,
                            borderColor: '#dc3545',
                            backgroundColor: 'rgba(220, 53, 69, 0.1)',
                            fill: false,
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#fff' } },
                        title: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: false, ticks: { color: '#ccc' }, grid: { color: 'rgba(255, 255, 255, 0.1)' } },
                        x: { ticks: { color: '#ccc' }, grid: { display: false } }
                    }
                }
            });
        };


        // ===============================================================
        // ⚙️ EVENT LISTENERS & INITIALIZATION
        // ===============================================================

        /** Handles city search from input field */
        const handleSearch = () => {
            const city = elements.cityInput.value.trim();
            if (city) fetchCurrentWeather(city);
        };

        /** Handles location detection using browser Geolocation API */
        const handleGeolocation = () => {
            if (!navigator.geolocation) {
                alert("Browser does not support geolocation.");
                return;
            }
            navigator.geolocation.getCurrentPosition((position) => {
                fetchWeatherByCoords(position.coords.latitude, position.coords.longitude);
            }, (error) => {
                console.error("Geolocation Error:", error);
                alert(`Could not determine location: ${error.message}. Please enter a city name.`);
            });
        };

        /** Fetches weather directly using latitude and longitude */
        const fetchWeatherByCoords = async (lat, lon) => {
            if (!API_KEY || API_KEY === "YOUR_OPENWEATHERMAP_API_KEY") return;

            setLoading(true);
            try {
                // 1. Get Current Weather using coordinates
                const currentWeatherUrl = `${BASE_URL}weather?lat=${lat}&lon=${lon}&appid=${API_KEY}`;
                const currentResponse = await fetch(currentWeatherUrl);
                if (!currentResponse.ok) throw new Error(`Current weather API error: ${currentResponse.statusText}`);
                const data = await currentResponse.json();

                // 2. Get Forecast using coordinates (needed for charts/hourly)
                const forecastData = await fetchForecastData(lat, lon);

                // Update UI with main data and then render forecasts
                currentWeatherData = data;
                updateUI(data);
                renderHourlyForecast(forecastData);

            } catch (error) {
                console.error("Coordinate Fetch Error:", error);
                alert(`Failed to fetch weather for coordinates: ${error.message}`);
            } finally {
                setLoading(false);
            }
        };


        // --- Unit Toggle Logic ---
        const toggleUnit = (newUnit) => {
            unitSystem = newUnit;
            elements.unitC.classList.toggle('active', newUnit === 'metric');
            elements.unitF.classList.toggle('active', newUnit === 'imperial');

            if (currentWeatherData) {
                // Re-render UI with the new unit system applied to existing data
                updateUI(currentWeatherData);
            }
        };


        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            elements.searchButton.addEventListener('click', handleSearch);
            elements.cityInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSearch(); });
            elements.currentLocationBtn.addEventListener('click', handleGeolocation);

            // Unit Listeners
            elements.unitC.addEventListener('click', () => toggleUnit('metric'));
            elements.unitF.addEventListener('click', () => toggleUnit('imperial'));

            // Comparison Mode Stub (Placeholder)
            document.getElementById('compareButton').addEventListener('click', () => {
                const compareCity = document.getElementById('compareCityInput').value;
                if (compareCity) {
                    alert(`Comparison feature initiated for ${compareCity}. Full implementation requires complex state management.`);
                    // In a real app, you would fetch data for both cities and render side-by-side charts/metrics.
                } else {
                    alert("Please enter a city name to compare.");
                }
            });

            // Initial Load (Default to London or user's location if possible)
            fetchCurrentWeather('London');
        });
    </script>
</body>

</html>
