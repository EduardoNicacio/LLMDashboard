<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyGlass | Premium Weather Dashboard</title>
    <!-- Bootstrap CSS for quick responsiveness and utility -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

    <style>
        /* ======================================== */
        /* 🎨 GLOBAL STYLES & GLASSMORPHISM */
        /* ======================================== */
        :root {
            --primary-color: #007bff;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            transition: background-color 1s ease, background-image 1s ease;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Dynamic Background Styling (Simulated) */
        body.sunny {
            background: linear-gradient(to bottom right, #ffcc80, #ffab91);
        }

        body.rainy {
            background: linear-gradient(to bottom right, #4a69bd, #2c3e50);
        }

        body.night {
            background: radial-gradient(circle at center, #1b2735 0%, #0d1117 100%);
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            transition: all 0.5s ease;
        }

        /* Main Layout */
        #app-container {
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-content {
            width: 100%;
            max-width: 1400px;
        }

        /* Header & Search */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .search-bar input,
        .unit-toggle button {
            border-radius: 50px;
            padding: 12px 25px;
            border: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        /* Current Weather Display */
        #current-weather {
            text-align: center;
            padding: 40px;
            margin-bottom: 25px;
        }

        #temp-display {
            font-size: 6rem;
            font-weight: 700;
            line-height: 1;
        }

        .weather-icon {
            font-size: 4rem;
            margin: 15px 0;
        }

        /* Forecast Sections */
        .forecast-section {
            margin-top: 30px;
        }

        .hourly-slider-container {
            overflow-x: auto;
            padding-bottom: 20px;
            white-space: nowrap;
            scrollbar-width: none;
            /* Firefox */
        }

        .hourly-slider-container::-webkit-scrollbar {
            display: none;
            /* Chrome, Safari, Opera */
        }

        /* Charts */
        #chartCanvasContainer {
            height: 300px;
            margin-top: 20px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            #temp-display {
                font-size: 4rem;
            }

            .glass-card {
                padding: 20px !important;
            }

            body {
                padding: 10px;
            }
        }

        /* Loading State */
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid var(--primary-color);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div id="app-container">
        <div class="main-content">
            <!-- Header & Search -->
            <header class="glass-card p-4 mb-4 text-white" style="background: rgba(0, 123, 255, 0.2);">
                <h1 class="display-4 fw-bold mb-1">SkyGlass</h1>
                <p class="mb-3 opacity-75">Your personalized atmospheric companion.</p>

                <div class="d-flex justify-content-center gap-3 search-bar">
                    <input type="text" id="cityInput" placeholder="Enter city name (e.g., London)"
                        class="form-control w-auto" />
                    <button id="searchButton" class="btn btn-primary"><i class="fas fa-search me-2"></i> Search</button>
                    <button id="currentLocationBtn" class="btn btn-outline-light"><i
                            class="fas fa-location-on me-1"></i> Current Location</button>
                </div>

                <!-- Unit Toggle -->
                <div class="mt-3 d-flex justify-center gap-2">
                    <span class="text-muted small">Units:</span>
                    <button id="unitC" class="btn btn-sm btn-outline-light active">°C</button>
                    <button id="unitF" class="btn btn-sm btn-outline-light">°F</button>
                </div>
            </header>

            <!-- Current Weather Display -->
            <div id="current-weather" class="glass-card text-center">
                <div id="loadingIndicator" class="loader mx-auto mb-3 d-none"></div>
                <h2 id="cityName" class="mb-1 fs-1">Welcome to SkyGlass</h2>
                <p id="dateDisplay" class="text-muted"></p>

                <i id="weatherIcon" class="fas fa-sun weather-icon mb-3"></i>
                <div id="temp-display">--</div>
                <p id="description" class="fs-4 fw-bold text-white mb-2"></p>

                <!-- Detailed Stats -->
                <div class="row g-3 mt-4" id="detailsGrid">
                    <div class="col-md-3 col-6">
                        <div class="glass-card p-3 text-center"><i class="fas fa-tint text-info me-2"></i> Humidity:
                            <span id="humidity">-</span>%
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="glass-card p-3 text-center"><i class="fas fa-wind text-primary me-2"></i> Wind:
                            <span id="windSpeed">-</span> m/s
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="glass-card p-3 text-center"><i class="fas fa-tachometer-alt text-warning me-2"></i>
                            Pressure: <span id="pressure">-</span> hPa</div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="glass-card p-3 text-center"><i class="fas fa-eye text-success me-2"></i> Visibility:
                            <span id="visibility">-</span> km
                        </div>
                    </div>
                </div>

                <!-- Sunrise/Sunset & Air Quality -->
                <div class="row g-3 mt-4" id="secondaryDetailsGrid">
                    <div class="col-md-6">
                        <div class="glass-card p-3 text-center small"><i class="fas fa-sunrise me-2"></i> Sunrise: <span
                                id="sunrise">-</span></div>
                    </div>
                    <div class="col-md-6">
                        <div class="glass-card p-3 text-center small"><i class="fas fa-sunset me-2"></i> Sunset: <span
                                id="sunset">-</span></div>
                    </div>
                </div>

            </div>

            <!-- Forecast Tabs -->
            <div class="row g-4 forecast-section">
                <!-- Hourly Forecast (Slider) -->
                <div class="col-lg-12 glass-card p-3">
                    <h5 class="mb-3 text-white"><i class="fas fa-clock me-2"></i> Hourly Forecast</h5>
                    <div id="hourlyForecast" class="d-flex overflow-x-auto py-3 hourly-slider-container">
                        <!-- Hourly cards injected here -->
                    </div>
                </div>

                <!-- 7-Day Forecast & Charts -->
                <div class="col-lg-12 glass-card p-4">
                    <h5 class="mb-3 text-white"><i class="fas fa-chart-line me-2"></i> Temperature Trend (Next 7 Days)
                    </h5>
                    <canvas id="tempChart"></canvas>
                </div>

                <!-- Comparison Mode / Alerts -->
                <div class="col-lg-12 glass-card p-4 mt-3" style="background: rgba(0, 0, 0, 0.1);">
                    <h5 class="mb-3 text-white"><i class="fas fa-bell me-2"></i> Weather Alerts & Comparison</h5>
                    <div id="alertsBox" class="alert alert-warning small mb-3 d-none" role="alert"></div>
                    <div class="d-flex gap-3 align-items-center">
                        <input type="text" id="compareCityInput" placeholder="Compare with another city..."
                            class="form-control w-50" />
                        <button id="compareButton" class="btn btn-outline-light"><i
                                class="fas fa-exchange-alt me-1"></i> Compare</button>
                    </div>
                </div>

            </div>

        </div>
    </div>


    <!-- ======================================== -->
    <!-- ⚙️ JAVASCRIPT & API LOGIC -->
    <!-- ======================================== -->
    <script>
        // ===============================================================
        // !!! CONFIGURATION AREA - REPLACE WITH YOUR ACTUAL KEY !!!
        // ===============================================================
        const GEOCODING_URL = 'https://geocoding-api.open-meteo.com/v1/search';
        const FORECAST_URL = 'https://api.open-meteo.com/v1/forecast';
        const FORECAST_PARAMS = 'current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,visibility&hourly=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max&timezone=auto&forecast_days=7';

        // State Management
        let currentWeatherData = null;
        let unitSystem = 'metric'; // 'metric' for Celsius, 'imperial' for Fahrenheit
        let tempChartInstance = null;

        // DOM Elements Cache
        const elements = {
            cityInput: document.getElementById('cityInput'),
            searchButton: document.getElementById('searchButton'),
            currentLocationBtn: document.getElementById('currentLocationBtn'),
            unitC: document.getElementById('unitC'),
            unitF: document.getElementById('unitF'),
            loadingIndicator: document.getElementById('loadingIndicator'),
            cityName: document.getElementById('cityName'),
            dateDisplay: document.getElementById('dateDisplay'),
            weatherIcon: document.getElementById('weatherIcon'),
            tempDisplay: document.getElementById('temp-display'),
            description: document.getElementById('description'),
            humidity: document.getElementById('humidity'),
            windSpeed: document.getElementById('windSpeed'),
            pressure: document.getElementById('pressure'),
            visibility: document.getElementById('visibility'),
            sunrise: document.getElementById('sunrise'),
            sunset: document.getElementById('sunset'),
            hourlyForecastContainer: document.getElementById('hourlyForecast'),
            tempChartCanvas: document.getElementById('tempChart'),
            alertsBox: document.getElementById('alertsBox'),
        };

        // ===============================================================
        // 🛠️ UTILITY FUNCTIONS
        // ===============================================================

        const wmoIcons = {
            0: 'fa-solid fa-sun', 1: 'fa-solid fa-sun', 2: 'fa-solid fa-cloud-sun', 3: 'fa-solid fa-cloud',
            45: 'fa-solid fa-smog', 48: 'fa-solid fa-smog',
            51: 'fa-solid fa-cloud-drizzle', 53: 'fa-solid fa-cloud-drizzle', 55: 'fa-solid fa-cloud-drizzle',
            61: 'fa-solid fa-cloud-rain', 63: 'fa-solid fa-cloud-rain', 65: 'fa-solid fa-cloud-rain',
            71: 'fa-solid fa-snowflake', 73: 'fa-solid fa-snowflake', 75: 'fa-solid fa-snowflake', 77: 'fa-solid fa-snowflake',
            80: 'fa-solid fa-cloud-rain', 81: 'fa-solid fa-cloud-rain', 82: 'fa-solid fa-cloud-rain',
            85: 'fa-solid fa-snowflake', 86: 'fa-solid fa-snowflake',
            95: 'fa-solid fa-cloud-bolt', 96: 'fa-solid fa-cloud-bolt', 99: 'fa-solid fa-cloud-bolt'
        };
        const wmoDesc = {
            0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
            45: 'Foggy', 48: 'Depositing rime fog',
            51: 'Light drizzle', 53: 'Moderate drizzle', 55: 'Dense drizzle',
            61: 'Slight rain', 63: 'Moderate rain', 65: 'Heavy rain',
            71: 'Slight snow', 73: 'Moderate snow', 75: 'Heavy snow', 77: 'Snow grains',
            80: 'Slight rain showers', 81: 'Moderate rain showers', 82: 'Violent rain showers',
            85: 'Slight snow showers', 86: 'Heavy snow showers',
            95: 'Thunderstorm', 96: 'Thunderstorm with slight hail', 99: 'Thunderstorm with heavy hail'
        };
        function getIcon(c) { return wmoIcons[c] || 'fa-solid fa-cloud'; }
        function getDesc(c) { return wmoDesc[c] || 'Unknown'; }

        /** Converts ISO string to readable time */
        const formatTime = (isoStr) => {
            if (!isoStr) return '--:--';
            return new Date(isoStr).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        };

        /** Converts ISO string to readable date */
        const formatDate = (isoStr) => {
            if (!isoStr) return '';
            return new Date(isoStr).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
        };

        /** Updates the visual theme based on weather code */
        const updateTheme = (wmoCode, timeOfDay) => {
            let bodyClass = '';
            if (timeOfDay === 'night') {
                bodyClass = 'night';
            } else if (wmoCode >= 95) {
                bodyClass = 'rainy';
            } else if (wmoCode >= 61 && wmoCode <= 82) {
                bodyClass = 'rainy';
            } else {
                bodyClass = 'sunny';
            }
            document.body.className = bodyClass;
        };

        /** Maps WMO weather code to Font Awesome icon class string */
        const getWeatherIcon = (code) => {
            return getIcon(code);
        };

        // ===============================================================
        // 📡 API FETCH LOGIC
        // ===============================================================

        /** Handles the loading state UI */
        const setLoading = (isLoading) => {
            elements.loadingIndicator.classList.toggle('d-none', !isLoading);
            document.querySelectorAll('#current-weather *').forEach(el => {
                if (!['loadingIndicator'].includes(el.id)) el.style.opacity = isLoading ? '0.5' : '1';
            });
        };

        /** Fetches all weather data for a given city using Open-Meteo */
        const fetchCurrentWeather = async (city) => {
            setLoading(true);
            try {
                const geoRes = await fetch(`${GEOCODING_URL}?name=${city}&count=5&language=en&format=json`);
                if (!geoRes.ok) throw new Error('City not found');
                const geoData = await geoRes.json();
                if (!geoData.results || !geoData.results.length) throw new Error('City not found');

                const { latitude, longitude, name } = geoData.results[0];
                const forecastRes = await fetch(`${FORECAST_URL}?latitude=${latitude}&longitude=${longitude}&${FORECAST_PARAMS}`);
                if (!forecastRes.ok) throw new Error('Failed to fetch weather data');
                const forecastData = await forecastRes.json();

                forecastData._cityName = name;
                currentWeatherData = forecastData;
                updateUI(forecastData);
            } catch (error) {
                console.error("Weather Fetch Error:", error);
                alert(`Could not fetch weather for ${city}. ${error.message}`);
                currentWeatherData = null;
            } finally {
                setLoading(false);
            }
        };

        /** Fetches weather data by coordinates */
        const fetchWeatherByCoords = async (lat, lon) => {
            setLoading(true);
            try {
                const forecastRes = await fetch(`${FORECAST_URL}?latitude=${lat}&longitude=${lon}&${FORECAST_PARAMS}`);
                if (!forecastRes.ok) throw new Error('Failed to fetch weather data');
                const data = await forecastRes.json();

                data._cityName = 'Current Location';
                currentWeatherData = data;
                updateUI(data);
            } catch (error) {
                console.error("Coordinate Fetch Error:", error);
                alert(`Failed to fetch weather: ${error.message}`);
            } finally {
                setLoading(false);
            }
        };

        // ===============================================================
        // 🖥️ UI RENDERING LOGIC
        // ===============================================================

        const toTargetUnit = (value) => {
            return unitSystem === 'imperial' ? (value * 9 / 5) + 32 : value;
        };

        /** Updates all visible weather data points */
        const updateUI = (data) => {
            if (!data) return;

            const tempUnit = unitSystem === 'metric' ? '°C' : '°F';
            const c = data.current, d = data.daily;
            const cityName = data._cityName || 'Weather Data';
            const wmoCode = c.weather_code;

            elements.cityName.textContent = cityName;
            elements.dateDisplay.textContent = formatDate(c.time);
            elements.description.textContent = getDesc(wmoCode).toUpperCase();
            elements.tempDisplay.textContent = `${Math.round(toTargetUnit(c.temperature_2m))}${tempUnit}`;

            elements.weatherIcon.className = getIcon(wmoCode);

            updateTheme(wmoCode, new Date().getHours() < 6 || new Date().getHours() >= 18 ? 'night' : 'day');

            elements.humidity.textContent = c.relative_humidity_2m;
            elements.windSpeed.textContent = `${c.wind_speed_10m} ${unitSystem === 'metric' ? 'km/h' : 'mph'}`;
            elements.pressure.textContent = c.surface_pressure;
            elements.visibility.textContent = (c.visibility / 1000).toFixed(1);

            elements.sunrise.textContent = d.sunrise ? formatTime(d.sunrise[0]) : '--:--';
            elements.sunset.textContent = d.sunset ? formatTime(d.sunset[0]) : '--:--';

            renderHourlyForecast(data.hourly);
            renderChart(d);
        };

        /** Renders hourly forecast cards from Open-Meteo hourly data */
        const renderHourlyForecast = (hourly) => {
            elements.hourlyForecastContainer.innerHTML = '';
            if (!hourly || !hourly.time) return;

            for (let i = 0; i < Math.min(hourly.time.length, 12); i++) {
                const time = new Date(hourly.time[i]).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                const temp = Math.round(toTargetUnit(hourly.temperature_2m[i]));
                const icon = getIcon(hourly.weather_code[i]);

                const card = document.createElement('div');
                card.className = 'glass-card p-3 text-center me-2 flex-shrink-0';
                card.innerHTML = `
                    <p class="mb-1 small">${time}</p>
                    <i class="${icon} fs-3 mb-1"></i>
                    <p class="fw-bold">${temp}${unitSystem === 'metric' ? '°C' : '°F'}</p>
                `;
                elements.hourlyForecastContainer.appendChild(card);
            }
        };

        /** Prepares canvas with explicit size to prevent infinite resize loops */
        const prepareCanvas = (canvas) => {
            const parent = canvas.parentElement;
            const dpr = window.devicePixelRatio || 1;
            const w = parent.clientWidth;
            const h = 250;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
        };

        /** Renders the 7-day chart from Open-Meteo daily data */
        const renderChart = (daily) => {
            if (!daily || !daily.time) return;

            const labels = daily.time.map(d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short' }));
            const highs = daily.temperature_2m_max.map(t => Math.round(toTargetUnit(t)));
            const lows = daily.temperature_2m_min.map(t => Math.round(toTargetUnit(t)));

            if (tempChartInstance) tempChartInstance.destroy();

            prepareCanvas(elements.tempChartCanvas);
            const ctx = elements.tempChartCanvas.getContext('2d');
            tempChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        {
                            label: `High ${unitSystem === 'metric' ? '°C' : '°F'}`,
                            data: highs,
                            borderColor: '#007bff',
                            backgroundColor: 'rgba(0, 123, 255, 0.1)',
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: `Low ${unitSystem === 'metric' ? '°C' : '°F'}`,
                            data: lows,
                            borderColor: '#dc3545',
                            backgroundColor: 'rgba(220, 53, 69, 0.1)',
                            fill: false,
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: false,
                    plugins: { legend: { labels: { color: '#fff' } } },
                    scales: {
                        y: { beginAtZero: false, ticks: { color: '#ccc' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                        x: { ticks: { color: '#ccc' }, grid: { display: false } }
                    }
                }
            });
        };


        // ===============================================================
        // ⚙️ EVENT LISTENERS & INITIALIZATION
        // ===============================================================

        /** Handles city search from input field */
        const handleSearch = () => {
            const city = elements.cityInput.value.trim();
            if (city) fetchCurrentWeather(city);
        };

        /** Handles location detection using browser Geolocation API */
        const handleGeolocation = () => {
            if (!navigator.geolocation) {
                alert("Browser does not support geolocation.");
                return;
            }
            navigator.geolocation.getCurrentPosition((position) => {
                fetchWeatherByCoords(position.coords.latitude, position.coords.longitude);
            }, (error) => {
                console.error("Geolocation Error:", error);
                alert(`Could not determine location: ${error.message}. Please enter a city name.`);
            });
        };

        // fetchWeatherByCoords is defined in the API FETCH LOGIC section above


        // --- Unit Toggle Logic ---
        const toggleUnit = (newUnit) => {
            unitSystem = newUnit;
            elements.unitC.classList.toggle('active', newUnit === 'metric');
            elements.unitF.classList.toggle('active', newUnit === 'imperial');

            if (currentWeatherData) {
                // Re-render UI with the new unit system applied to existing data
                updateUI(currentWeatherData);
            }
        };


        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            elements.searchButton.addEventListener('click', handleSearch);
            elements.cityInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSearch(); });
            elements.currentLocationBtn.addEventListener('click', handleGeolocation);

            // Unit Listeners
            elements.unitC.addEventListener('click', () => toggleUnit('metric'));
            elements.unitF.addEventListener('click', () => toggleUnit('imperial'));

            // Comparison Mode Stub (Placeholder)
            document.getElementById('compareButton').addEventListener('click', () => {
                const compareCity = document.getElementById('compareCityInput').value;
                if (compareCity) {
                    alert(`Comparison feature initiated for ${compareCity}. Full implementation requires complex state management.`);
                    // In a real app, you would fetch data for both cities and render side-by-side charts/metrics.
                } else {
                    alert("Please enter a city name to compare.");
                }
            });

            // Initial Load (Default to London or user's location if possible)
            fetchCurrentWeather('London');

            // Debounced resize handler to re-render chart
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (currentWeatherData) renderChart(currentWeatherData.daily);
                }, 300);
            });
        });
    </script>
</body>

</html>
