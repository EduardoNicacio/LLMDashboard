        /* ---------------------------------------------------------------------
           RENDER: ALERTS
           --------------------------------------------------------------------- */
        function renderAlerts(w) {
            const alerts = [];
            const c = w.current;
            // Severe weather codes
            if ([95, 96, 99].includes(c.code)) alerts.push({ sev: "severe", title: "Thunderstorm warning", desc: wInfo(c.code).label + " conditions in your area. Stay indoors and avoid open spaces." });
            if (c.wind > 50) alerts.push({ sev: "severe", title: "High wind alert", desc: `Sustained winds of ${fmt(windConv(c.wind), 0)} ${windUnit()}. Secure loose objects and limit travel.` });
            if ((w.hourly[0]?.uv ?? 0) >= 8) alerts.push({ sev: "", title: "High UV index", desc: `UV index is ${fmt(w.hourly[0].uv, 1)} (${uvLabel(w.hourly[0].uv)}). Use sunscreen and protective clothing between 10am-4pm.` });
            if (c.visibility != null && visConv(c.visibility) < 2) alerts.push({ sev: "", title: "Low visibility", desc: `Visibility reduced to ${fmt(visConv(c.visibility), 1)} ${visUnit()}. Drive carefully and use headlights.` });
            if (c.humidity >= 90 && c.temp > 25) alerts.push({ sev: "", title: "Heat & humidity", desc: "Very humid and warm - risk of heat-related illness. Stay hydrated." });
            // Heavy precipitation next 12h
            const heavy = w.hourly.slice(0, 12).some(h => (h.precip || 0) > 5);
            if (heavy) alerts.push({ sev: "", title: "Heavy precipitation expected", desc: "Heavy rain or snow forecast in the next 12 hours. Plan travel accordingly." });
            // Cold alert
            if (c.temp <= -10) alerts.push({ sev: "", title: "Extreme cold", desc: `Temperature of ${fmt(tConv(c.temp), 0)}${deg(state.unit)}. Limit time outdoors and dress in layers.` });

            if (!alerts.length) {
                $("#alertsCard").innerHTML = `
      <h3>${iconSVG("alert", 16)} Weather alerts</h3>
      <div class="no-alerts">All clear - no active advisories for this location.</div>
    `;
                return;
            }
            $("#alertsCard").innerHTML = `
    <h3>${iconSVG("alert", 16)} Weather alerts (${alerts.length})</h3>
    ${alerts.map(a => `
      <div class="alert ${a.sev}">
        <div class="alert-icon">${iconSVG("alert", 20)}</div>
        <div class="alert-body">
          <div class="alert-title">${a.title}</div>
          <div class="alert-desc">${a.desc}</div>
        </div>
      </div>
    `).join("")}
  `;
        }

        /* ---------------------------------------------------------------------
           FAVORITES
           --------------------------------------------------------------------- */
        function saveFavorites() {
            localStorage.setItem("sg_fav", JSON.stringify(state.favorites));
        }
        function renderFavorites() {
            const list = $("#favList");
            if (!state.favorites.length) {
                list.innerHTML = `<div class="fav-empty">No favorites yet. Click the ★ icon to save a city.</div>`;
                return;
            }
            list.innerHTML = state.favorites.map(f => `
    <div class="fav-item" data-id="${f.id}">
      <div class="ico">${iconSVG(wInfo(f.code || 0).icon, 30)}</div>
      <div class="meta">
        <div class="name">${escapeHtml(f.name)}</div>
        <div class="sub">${escapeHtml(f.country || "")}</div>
      </div>
      <div class="t">${f.temp != null ? fmt(tConv(f.temp), 0) + "°" : ""}</div>
      <button class="fav-remove" title="Remove" data-remove="${f.id}">×</button>
    </div>
  `).join("");
            list.querySelectorAll(".fav-item").forEach(el => {
                el.onclick = (e) => {
                    if (e.target.closest("[data-remove]")) return;
                    const id = el.dataset.id;
                    const f = state.favorites.find(x => x.id === id);
                    if (f) loadCity({ lat: f.lat, lon: f.lon, name: f.name, country: f.country, admin: f.admin || "", tz: f.tz || "auto" }, f.name);
                };
            });
            list.querySelectorAll("[data-remove]").forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    state.favorites = state.favorites.filter(x => x.id !== btn.dataset.remove);
                    saveFavorites();
                    renderFavorites();
                    toast("Removed from favorites", "info");
                };
            });
        }
        function isFav(place) {
            return state.favorites.some(f => Math.abs(f.lat - place.lat) < .05 && Math.abs(f.lon - place.lon) < .05);
        }
        function toggleFavorite() {
            if (!state.current) return;
            const p = state.current.place;
            const c = state.current.current;
            if (isFav(p)) {
                state.favorites = state.favorites.filter(f => !(Math.abs(f.lat - p.lat) < .05 && Math.abs(f.lon - p.lon) < .05));
                toast("Removed from favorites", "info");
            } else {
                state.favorites.unshift({
                    id: p.id, name: p.name, country: p.country, admin: p.admin,
                    lat: p.lat, lon: p.lon, tz: p.tz, code: c.code, temp: c.temp,
                });
                toast("Added to favorites", "success");
            }
            saveFavorites();
            renderFavorites();
            updateFavBtn();
        }
        function updateFavBtn() {
            const btn = $("#favBtn");
            const icon = $("#favIcon");
            if (!state.current) { btn.classList.remove("active"); icon.setAttribute("fill", "none"); return; }
            const isF = isFav(state.current.place);
            btn.classList.toggle("active", isF);
            icon.setAttribute("fill", isF ? "#ffd166" : "none");
            icon.setAttribute("stroke", isF ? "#ffd166" : "currentColor");
        }

        /* ---------------------------------------------------------------------
           COMPARE MODE
           --------------------------------------------------------------------- */
        async function loadCompareCity(place) {
            showLoader("Loading comparison…");
            try {
                const { data, aqi } = await fetchWeather(place);
                state.compare = { active: true, city: place, data, aqi };
                hideLoader();
                renderCompare();
            } catch (e) {
                hideLoader();
                toast("Compare failed: " + e.message);
            }
        }
        function renderCompare() {
            if (!state.compare.active || !state.compare.data) return;
            const place = state.compare.city;
            const w = normalizeWeatherData(state.compare.data, state.compare.aqi, place);
            const c = w.current;
            const info = wInfo(c.code);
            const temp = tConv(c.temp);
            // Render a banner and a comparison hero card
            let banner = document.getElementById("compareBanner");
            if (!banner) {
                banner = document.createElement("div");
                banner.id = "compareBanner";
                banner.className = "compare-banner glass";
                banner.style.padding = "16px 20px";
                banner.style.marginBottom = "18px";
                banner.style.gridColumn = "span 2";
                $("#mainGrid").prepend(banner);
            }
            banner.innerHTML = `
    <div class="row" style="gap:16px">
      <div style="width:54px;height:54px">${iconSVG(info.icon, 54)}</div>
      <div>
        <div style="font-size:18px;font-weight:600;font-family:'Space Grotesk',sans-serif">${escapeHtml(place.name)} · ${fmt(temp, 0)}${deg(state.unit)}</div>
        <div style="font-size:12px;color:var(--text-dim)">${escapeHtml([place.admin, place.country].filter(Boolean).join(", "))} · ${info.label} · Feels ${fmt(tConv(c.feels), 0)}${deg(state.unit)}</div>
      </div>
    </div>
    <div class="row" style="gap:14px;font-size:13px">
      <div>💧 ${c.humidity}%</div>
      <div>💨 ${fmt(windConv(c.wind), 0)} ${windUnit()}</div>
      <div>UV ${w.hourly[0]?.uv ?? "-"}</div>
    </div>
  `;
        }
        function exitCompare() {
            state.compare = { active: false, city: null, data: null, aqi: null };
            $("#compareBar").classList.remove("open");
            const banner = document.getElementById("compareBanner");
            if (banner) banner.remove();
            toast("Comparison closed", "info");
        }

        /* ---------------------------------------------------------------------
           MAIN LOAD
           --------------------------------------------------------------------- */
        async function loadCity(place, displayName) {
            showLoader("Loading " + (displayName || place.name) + "…");
            try {
                const { data, aqi } = await fetchWeather(place);
                const w = normalizeWeatherData(data, aqi, { ...place });
                state.current = w;
                renderAll();
                if (state.compare.active) renderCompare();
                hideLoader();
            } catch (e) {
                hideLoader();
                console.error(e);
                toast("Couldn't load weather: " + e.message);
            }
        }

        function renderAll() {
            if (!state.current) return;
            renderHero(state.current);
            renderMetrics(state.current);
            renderSun(state.current);
            renderHourly(state.current);
            renderDaily(state.current);
            renderCharts(state.current);
            renderAlerts(state.current);
            updateFavBtn();
        }

        /* ---------------------------------------------------------------------
           SEARCH
           --------------------------------------------------------------------- */
        let searchTimer;
        function bindSearch() {
            const input = $("#searchInput");
            const results = $("#searchResults");
            const clear = $("#clearSearch");

            input.addEventListener("input", () => {
                const q = input.value.trim();
                clear.style.display = q ? "flex" : "none";
                clearTimeout(searchTimer);
                if (!q) { results.classList.remove("open"); return; }
                searchTimer = setTimeout(async () => {
                    try {
                        const matches = await geocodeCity(q);
                        if (!matches.length) { results.classList.remove("open"); return; }
                        results.innerHTML = matches.map(m => `
          <div class="search-item" data-lat="${m.lat}" data-lon="${m.lon}" data-tz="${m.tz}" data-name="${escapeHtml(m.name)}" data-country="${escapeHtml(m.country)}" data-admin="${escapeHtml(m.admin)}">
            <span style="color:var(--accent)">${iconSVG("compass", 18)}</span>
            <span>${escapeHtml(m.name)}${m.admin ? `, <span style='color:var(--text-mute)'>${escapeHtml(m.admin)}</span>` : ""}</span>
            <span class="country">${escapeHtml(m.country)}</span>
          </div>
        `).join("");
                        results.classList.add("open");
                        results.querySelectorAll(".search-item").forEach(it => {
                            it.onclick = () => {
                                const place = { name: it.dataset.name, admin: it.dataset.admin, country: it.dataset.country, lat: parseFloat(it.dataset.lat), lon: parseFloat(it.dataset.lon), tz: it.dataset.tz, id: `${it.dataset.lat},${it.dataset.lon}` };
                                results.classList.remove("open");
                                input.value = place.name;
                                loadCity(place, place.name);
                            };
                        });
                    } catch (e) {
                        results.classList.remove("open");
                        toast(e.message);
                    }
                }, 350);
            });
            input.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    const first = $("#searchResults .search-item");
                    if (first) first.click();
                } else if (e.key === "Escape") {
                    results.classList.remove("open");
                }
            });
            clear.addEventListener("click", () => { input.value = ""; clear.style.display = "none"; results.classList.remove("open"); input.focus(); });
            document.addEventListener("click", (e) => {
                if (!e.target.closest(".search-wrap")) results.classList.remove("open");
            });
        }

        /* ---------------------------------------------------------------------
           COMPARE SEARCH
           --------------------------------------------------------------------- */
        let cmpTimer;
        function bindCompareSearch() {
            const input = $("#compareSearch");
            input.addEventListener("input", () => {
                clearTimeout(cmpTimer);
                const q = input.value.trim();
                if (!q) return;
                cmpTimer = setTimeout(async () => {
                    try {
                        const matches = await geocodeCity(q);
                        if (!matches.length) return;
                        const m = matches[0];
                        const place = { name: m.name, admin: m.admin, country: m.country, lat: m.lat, lon: m.lon, tz: m.tz, id: `${m.lat},${m.lon}` };
                        input.value = m.name;
                        loadCompareCity(place);
                    } catch (e) {
                        toast(e.message);
                    }
                }, 400);
            });
        }

        /* ---------------------------------------------------------------------
           GEOLOCATION
           --------------------------------------------------------------------- */
        function bindGeo() {
            $("#geoBtn").addEventListener("click", () => {
                if (!navigator.geolocation) { toast("Geolocation not supported", "info"); return; }
                showLoader("Getting your location…");
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    try {
                        // Reverse geocode by using search with a generic name isn't ideal; instead use Open-Meteo's reverse geocoding via Nominatim? 
                        // Simpler: search for "current location" coords & label as "My Location"
                        const lat = pos.coords.latitude, lon = pos.coords.longitude;
                        const place = { name: "My Location", admin: "", country: "", lat, lon, tz: "auto", id: `${lat.toFixed(3)},${lon.toFixed(3)}` };
                        await loadCity(place, "your location");
                    } catch (e) {
                        hideLoader();
                        toast("Failed: " + e.message);
                    }
                }, (err) => {
                    hideLoader();
                    toast("Location denied or unavailable (" + err.message + ")", "info");
                }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 });
            });
        }

        /* ---------------------------------------------------------------------
           UNIT TOGGLE
           --------------------------------------------------------------------- */
        function bindUnits() {
            const c = $("#unitC"), f = $("#unitF");
            function apply() {
                c.classList.toggle("on", state.unit === "C");
                f.classList.toggle("on", state.unit === "F");
                localStorage.setItem("sg_unit", state.unit);
                if (state.current) renderAll();
                if (state.compare.active) renderCompare();
            }
            c.onclick = () => { state.unit = "C"; apply(); };
            f.onclick = () => { state.unit = "F"; apply(); };
            apply();
        }

        /* ---------------------------------------------------------------------
           COMPARE BUTTON
           --------------------------------------------------------------------- */
        function bindCompare() {
            const bar = $("#compareBar");
            $("#compareBtn").onclick = () => {
                state.compare.active = !state.compare.active;
                bar.classList.toggle("open", state.compare.active);
                if (!state.compare.active) exitCompare();
                else { toast("Compare mode: search a second city", "info"); $("#compareSearch").focus(); }
            };
            $("#closeCompare").onclick = exitCompare;
            $("#pickFromFav").onclick = () => {
                if (!state.favorites.length) { toast("No favorites saved", "info"); return; }
                const names = state.favorites.map((f, i) => `${i + 1}. ${f.name}`).join("\n");
                const choice = prompt("Pick a favorite:\n" + names);
                if (!choice) return;
                const idx = parseInt(choice) - 1;
                const f = state.favorites[idx];
                if (f) loadCompareCity({ name: f.name, admin: f.admin, country: f.country, lat: f.lat, lon: f.lon, tz: f.tz, id: f.id });
            };
        }

        /* ---------------------------------------------------------------------
           FAVORITE BUTTON
           --------------------------------------------------------------------- */
        $("#favBtn").addEventListener("click", toggleFavorite);

        /* ---------------------------------------------------------------------
           CHARTS CARD HTML
           --------------------------------------------------------------------- */
        function buildChartsCard() {
            $("#chartsCard").innerHTML = `
    <div class="charts-head">
      <h3>${iconSVG("thermo", 16)} Trend charts</h3>
      <div class="chart-tabs">
        <button class="chart-tab on" data-chart="temp">Temperature</button>
        <button class="chart-tab" data-chart="rain">Rain</button>
        <button class="chart-tab" data-chart="wind">Wind</button>
        <button class="chart-tab" data-chart="hum">Humidity</button>
      </div>
    </div>
    <div class="chart-wrap" id="chartWrap-temp"><canvas id="chartTemp"></canvas></div>
    <div class="chart-wrap" id="chartWrap-rain" style="display:none"><canvas id="chartRain"></canvas></div>
    <div class="chart-wrap" id="chartWrap-wind" style="display:none"><canvas id="chartWind"></canvas></div>
    <div class="chart-wrap" id="chartWrap-hum"  style="display:none"><canvas id="chartHum"></canvas></div>
  `;
        }

        /* ---------------------------------------------------------------------
           AUTO-REFRESH (every 10 min)
           --------------------------------------------------------------------- */
        function startAutoRefresh() {
            setInterval(() => {
                if (state.current) loadCity(state.current.place, state.current.place.name);
            }, 10 * 60 * 1000);
        }

        /* ---------------------------------------------------------------------
           INIT
           --------------------------------------------------------------------- */
        async function init() {
            buildChartsCard();
            renderFavorites();
            bindSearch();
            bindCompareSearch();
            bindGeo();
            bindUnits();
            bindCompare();
            startAutoRefresh();
            // initial city: try favorites[0] → geolocation → default
            if (state.favorites.length) {
                const f = state.favorites[0];
                loadCity({ name: f.name, admin: f.admin, country: f.country, lat: f.lat, lon: f.lon, tz: f.tz, id: f.id }, f.name);
            } else if (navigator.geolocation) {
                showLoader("Detecting your location…");
                navigator.geolocation.getCurrentPosition((pos) => {
                    hideLoader();
                    const place = { name: "My Location", admin: "", country: "", lat: pos.coords.latitude, lon: pos.coords.longitude, tz: "auto", id: `${pos.coords.latitude.toFixed(3)},${pos.coords.longitude.toFixed(3)}` };
                    loadCity(place, "your location");
                }, () => {
                    hideLoader();
                    loadCity({ name: "London", admin: "England", country: "United Kingdom", lat: 51.5074, lon: -0.1278, tz: "Europe/London", id: "51.507,-0.128" }, "London");
                }, { timeout: 6000 });
            } else {
                loadCity({ name: "London", admin: "England", country: "United Kingdom", lat: 51.5074, lon: -0.1278, tz: "Europe/London", id: "51.507,-0.128" }, "London");
            }
        }

        init();
    </script>

</body>

</html>
