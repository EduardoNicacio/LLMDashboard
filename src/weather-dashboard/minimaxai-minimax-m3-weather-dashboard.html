<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyGlass - Weather, Refined.</title>

    <!-- =====================================================
     EXTERNAL LIBRARIES
     ===================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <style>
        /* ===================================================
     RESET & ROOT TOKENS
     =================================================== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg-1: #0b1224;
            --bg-2: #1a2547;
            --glass: rgba(255, 255, 255, .08);
            --glass-strong: rgba(255, 255, 255, .14);
            --glass-border: rgba(255, 255, 255, .18);
            --text: #f4f6fb;
            --text-dim: rgba(244, 246, 251, .7);
            --text-mute: rgba(244, 246, 251, .5);
            --accent: #7cc6ff;
            --accent-2: #a78bfa;
            --accent-3: #f0b4ff;
            --good: #4ade80;
            --warn: #fbbf24;
            --bad: #f87171;
            --shadow: 0 12px 40px rgba(0, 0, 0, .35);
            --radius: 22px;
            --radius-sm: 14px;
        }

        html,
        body {
            height: 100%
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            color: var(--text);
            background: #0b1224;
            overflow-x: hidden;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        ::selection {
            background: rgba(124, 198, 255, .35);
            color: #fff
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, .12);
            border-radius: 8px
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, .22)
        }

        /* ===================================================
     ANIMATED BACKGROUND
     =================================================== */
        .bg-stage {
            position: fixed;
            inset: 0;
            z-index: -3;
            background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
            transition: background 1.4s ease;
        }

        .bg-stage.day-clear {
            background: linear-gradient(160deg, #3a8bd6 0%, #6fb1f5 50%, #b9d6ff 100%)
        }

        .bg-stage.day-cloudy {
            background: linear-gradient(160deg, #3d4a66 0%, #6a7a99 50%, #9eb0c7 100%)
        }

        .bg-stage.day-rain {
            background: linear-gradient(160deg, #1e2a44 0%, #314c6e 50%, #4f6a8c 100%)
        }

        .bg-stage.day-snow {
            background: linear-gradient(160deg, #7b95b3 0%, #aec1d8 50%, #dde8f3 100%)
        }

        .bg-stage.day-storm {
            background: linear-gradient(160deg, #0f1626 0%, #20293f 50%, #3a445e 100%)
        }

        .bg-stage.dawn {
            background: linear-gradient(160deg, #3b2960 0%, #c66a8a 55%, #f5a87a 100%)
        }

        .bg-stage.dusk {
            background: linear-gradient(160deg, #2a1c4a 0%, #7a3b6e 50%, #e07b54 100%)
        }

        .bg-stage.night-clear {
            background: linear-gradient(160deg, #070b1c 0%, #141a3a 50%, #232a55 100%)
        }

        .bg-stage.night-cloudy {
            background: linear-gradient(160deg, #0a0f1f 0%, #1a2138 50%, #2b3354 100%)
        }

        .bg-stage.night-rain {
            background: linear-gradient(160deg, #060912 0%, #10182a 50%, #1c2640 100%)
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .55;
            z-index: -2;
            pointer-events: none;
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        .bg-orb.a {
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, #7cc6ff, transparent 70%);
            top: -120px;
            left: -120px
        }

        .bg-orb.b {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, #a78bfa, transparent 70%);
            bottom: -140px;
            right: -120px;
            opacity: .45
        }

        .bg-orb.c {
            width: 360px;
            height: 360px;
            background: radial-gradient(circle, #f0b4ff, transparent 70%);
            top: 40%;
            right: 20%;
            opacity: .25
        }

        /* Sun / Moon */
        .celestial {
            position: fixed;
            top: 8%;
            right: 8%;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
            transition: opacity 1s ease, transform 1s ease, background 1s ease;
            box-shadow: 0 0 80px rgba(255, 220, 150, .55);
        }

        .celestial.sun {
            background: radial-gradient(circle at 30% 30%, #fff5b8, #ffd166 60%, #ff9a3c 100%)
        }

        .celestial.moon {
            background: radial-gradient(circle at 30% 30%, #f5f3e7, #cfd5e6 60%, #8d96b3 100%);
            box-shadow: 0 0 60px rgba(220, 225, 250, .35)
        }

        .celestial.hidden {
            opacity: 0;
            transform: scale(.6)
        }

        /* Particle layers */
        .particles {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden
        }

        .particle {
            position: absolute;
            will-change: transform, opacity
        }

        .rain-drop {
            width: 2px;
            background: linear-gradient(to bottom, transparent, rgba(180, 210, 255, .7));
            border-radius: 1px;
            animation: rain-fall linear infinite;
        }

        @keyframes rain-fall {
            0% {
                transform: translateY(-20px);
                opacity: 0
            }

            10% {
                opacity: .9
            }

            100% {
                transform: translateY(110vh);
                opacity: .9
            }
        }

        .snow-flake {
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, .9);
            border-radius: 50%;
            animation: snow-fall linear infinite;
        }

        @keyframes snow-fall {
            0% {
                transform: translate(0, -20px) rotate(0);
                opacity: 0
            }

            10% {
                opacity: 1
            }

            100% {
                transform: translate(40px, 110vh) rotate(360deg);
                opacity: .4
            }
        }

        .cloud {
            background: rgba(255, 255, 255, .18);
            border-radius: 100px;
            filter: blur(6px);
            animation: cloud-drift linear infinite;
        }

        @keyframes cloud-drift {
            0% {
                transform: translateX(-200px)
            }

            100% {
                transform: translateX(calc(100vw + 200px))
            }
        }

        .star {
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle ease-in-out infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: .2;
                transform: scale(.8)
            }

            50% {
                opacity: 1;
                transform: scale(1.2)
            }
        }

        .lightning {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, .85);
            z-index: -1;
            opacity: 0;
            pointer-events: none;
        }

        .lightning.flash {
            animation: flash .25s ease-out
        }

        @keyframes flash {
            0% {
                opacity: 0
            }

            20% {
                opacity: .9
            }

            100% {
                opacity: 0
            }
        }

        /* ===================================================
     APP LAYOUT
     =================================================== */
        .app {
            position: relative;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 28px 60px;
            z-index: 1
        }

        @media(max-width:768px) {
            .app {
                padding: 16px 14px 40px
            }
        }

        /* Glass panel base */
        .glass {
            background: var(--glass);
            backdrop-filter: blur(22px) saturate(160%);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .glass::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255, 255, 255, .12), transparent 40%);
        }

        /* Header */
        .topbar {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            background: linear-gradient(135deg, #7cc6ff, #a78bfa 60%, #f0b4ff);
            display: grid;
            place-items: center;
            box-shadow: 0 6px 20px rgba(124, 198, 255, .35);
            flex-shrink: 0;
        }

        .brand-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -.5px;
            background: linear-gradient(120deg, #fff, #b8d6ff 70%, #d4b8ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .brand-sub {
            font-size: 11px;
            color: var(--text-mute);
            letter-spacing: .5px;
            text-transform: uppercase;
            margin-top: -3px
        }

        .search-wrap {
            flex: 1;
            min-width: 240px;
            max-width: 520px;
            position: relative
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--glass);
            backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            transition: border-color .2s, background .2s;
        }

        .search-box:focus-within {
            border-color: rgba(124, 198, 255, .55);
            background: var(--glass-strong)
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: 0;
            outline: 0;
            color: var(--text);
            font: inherit;
            font-size: 14px;
        }

        .search-box input::placeholder {
            color: var(--text-mute)
        }

        .search-results {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: rgba(20, 28, 52, .92);
            backdrop-filter: blur(22px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            max-height: 300px;
            overflow: auto;
            z-index: 50;
            box-shadow: var(--shadow);
            display: none;
        }

        .search-results.open {
            display: block
        }

        .search-item {
            padding: 11px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, .06);
            transition: background .15s;
            font-size: 14px;
        }

        .search-item:last-child {
            border-bottom: 0
        }

        .search-item:hover {
            background: rgba(124, 198, 255, .14)
        }

        .search-item .country {
            color: var(--text-mute);
            font-size: 12px;
            margin-left: auto
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            background: var(--glass);
            backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: 13px;
            color: var(--text);
            cursor: pointer;
            transition: transform .15s, background .15s, border-color .15s;
        }

        .icon-btn:hover {
            background: var(--glass-strong);
            border-color: rgba(124, 198, 255, .45)
        }

        .icon-btn:active {
            transform: scale(.94)
        }

        .icon-btn.active {
            background: linear-gradient(135deg, rgba(124, 198, 255, .3), rgba(167, 139, 250, .3));
            border-color: rgba(124, 198, 255, .6)
        }

        .unit-toggle {
            display: flex;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 13px;
            padding: 4px;
            backdrop-filter: blur(18px)
        }

        .unit-toggle button {
            border: 0;
            background: transparent;
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: 9px;
            cursor: pointer;
            font: 600 13px 'Inter';
            transition: all .2s;
        }

        .unit-toggle button.on {
            background: linear-gradient(135deg, rgba(124, 198, 255, .4), rgba(167, 139, 250, .4));
            color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .2)
        }

        /* Layout grid */
        .grid {
            display: grid;
            gap: 18px
        }

        .layout {
            grid-template-columns: 1.7fr 1fr;
            grid-template-rows: auto auto auto auto
        }

        .layout-compare {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto auto
        }

        @media(max-width:1024px) {

            .layout,
            .layout-compare {
                grid-template-columns: 1fr
            }
        }

        .span-2 {
            grid-column: span 2
        }

        @media(max-width:1024px) {
            .span-2 {
                grid-column: span 1
            }
        }

        /* Hero card */
        .hero {
            padding: 26px 28px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-height: 280px
        }

        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap
        }

        .hero-loc h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -.5px;
            line-height: 1.1
        }

        .hero-loc .sub {
            color: var(--text-dim);
            font-size: 13px;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .hero-icon {
            width: 88px;
            height: 88px;
            flex-shrink: 0
        }

        .hero-main {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap
        }

        .hero-temp {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 96px;
            line-height: 1;
            font-weight: 300;
            letter-spacing: -4px;
            display: flex;
            align-items: flex-start;
        }

        .hero-temp .deg {
            font-size: 36px;
            opacity: .6;
            margin-top: 8px
        }

        .hero-temp .unit {
            font-size: 32px;
            opacity: .5;
            margin-top: 14px;
            font-weight: 400
        }

        .hero-cond {
            font-size: 15px;
            color: var(--text-dim);
            margin-top: 4px
        }

        .hero-stats {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, .08)
        }

        .hero-stat {
            display: flex;
            flex-direction: column;
            gap: 2px
        }

        .hero-stat .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: var(--text-mute)
        }

        .hero-stat .val {
            font-size: 15px;
            font-weight: 600
        }

        /* Metrics grid */
        .metrics {
            padding: 18px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px
        }

        .metric {
            padding: 14px 14px 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .07);
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 90px;
            position: relative;
            overflow: hidden;
        }

        .metric-head {
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .metric-head .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: var(--text-mute);
            display: flex;
            align-items: center;
            gap: 6px
        }

        .metric .val {
            font-size: 22px;
            font-weight: 600;
            font-family: 'Space Grotesk', sans-serif
        }

        .metric .extra {
            font-size: 11px;
            color: var(--text-mute)
        }

        .metric svg.icon {
            width: 32px;
            height: 32px;
            opacity: .85
        }

        .metric-bar {
            margin-top: auto;
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, .08);
            overflow: hidden
        }

        .metric-bar>i {
            display: block;
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transition: width .8s cubic-bezier(.2, .7, .2, 1)
        }

        .aqi-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .3px
        }

        .aqi-good {
            background: rgba(74, 222, 128, .2);
            color: #86efac
        }

        .aqi-moderate {
            background: rgba(251, 191, 36, .2);
            color: #fcd34d
        }

        .aqi-unhealthy-sg {
            background: rgba(251, 146, 60, .2);
            color: #fdba74
        }

        .aqi-unhealthy {
            background: rgba(248, 113, 113, .22);
            color: #fca5a5
        }

        .aqi-very-unhealthy {
            background: rgba(217, 70, 239, .22);
            color: #f0abfc
        }

        .aqi-hazardous {
            background: rgba(159, 18, 57, .3);
            color: #fda4af
        }

        /* Sun card */
        .sun-card {
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px
        }

        .sun-card h3 {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .sun-arc {
            position: relative;
            height: 120px;
            width: 100%
        }

        .sun-arc svg {
            width: 100%;
            height: 100%;
            overflow: visible
        }

        .sun-arc .arc-line {
            stroke: rgba(255, 255, 255, .18);
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 3 4
        }

        .sun-arc .arc-fill {
            stroke: url(#sun-grad);
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            filter: drop-shadow(0 0 6px rgba(255, 210, 120, .6))
        }

        .sun-arc .sun-dot {
            fill: #ffd166;
            filter: drop-shadow(0 0 8px rgba(255, 210, 120, .9))
        }

        .sun-arc .sun-dot.now {
            fill: #fff5b8
        }

        .sun-times {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-dim)
        }

        .sun-times div {
            display: flex;
            align-items: center;
            gap: 6px
        }

        .sun-times strong {
            color: #fff;
            font-weight: 600
        }

        /* Hourly slider */
        .hourly-card {
            padding: 20px
        }

        .hourly-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px
        }

        .hourly-head h3 {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .hourly-track {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 6px 4px 6px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .hourly-track::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0
        }

        .hourly-item {
            flex: 0 0 78px;
            scroll-snap-align: start;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .07);
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all .2s;
        }

        .hourly-item:hover {
            background: rgba(124, 198, 255, .12);
            transform: translateY(-2px)
        }

        .hourly-item.now {
            background: linear-gradient(180deg, rgba(124, 198, 255, .22), rgba(167, 139, 250, .18));
            border-color: rgba(124, 198, 255, .4)
        }

        .hourly-item .h {
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 500
        }

        .hourly-item .h.now {
            color: #7cc6ff;
            font-weight: 700
        }

        .hourly-item .ic {
            width: 30px;
            height: 30px
        }

        .hourly-item .t {
            font-size: 15px;
            font-weight: 600;
            font-family: 'Space Grotesk', sans-serif
        }

        .hourly-item .p {
            font-size: 11px;
            color: var(--accent);
            min-height: 14px
        }

        .hourly-item .w {
            font-size: 10px;
            color: var(--text-mute)
        }

        /* Custom horizontal scrollbar for hourly */
        .hourly-scrollbar {
            position: relative;
            height: 14px;
            margin: 6px 4px 0;
            padding: 5px 0;
            cursor: pointer;
            user-select: none;
            touch-action: none;
            transition: opacity .25s ease;
        }

        .hourly-scrollbar::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 198, 255, .15), transparent 70%);
            opacity: 0;
            transition: opacity .25s;
            pointer-events: none;
        }

        .hourly-scrollbar:hover::before {
            opacity: 1
        }

        .hourly-scrollbar-track {
            position: relative;
            width: 100%;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .06);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, .25);
            overflow: visible;
        }

        .hourly-scrollbar-thumb {
            position: absolute;
            top: 50%;
            left: 0;
            height: 10px;
            min-width: 32px;
            transform: translateY(-50%);
            background: linear-gradient(90deg, #7cc6ff 0%, #a78bfa 100%);
            border-radius: 8px;
            box-shadow:
                0 2px 8px rgba(124, 198, 255, .35),
                0 0 0 1px rgba(255, 255, 255, .18) inset,
                0 1px 0 rgba(255, 255, 255, .3) inset;
            cursor: grab;
            will-change: transform, width;
            transition: box-shadow .2s ease, height .15s ease;
        }

        .hourly-scrollbar-thumb::after {
            content: "";
            position: absolute;
            inset: 2px 25%;
            border-radius: 2px;
            background: linear-gradient(180deg, rgba(255, 255, 255, .45), rgba(255, 255, 255, 0));
            pointer-events: none;
        }

        .hourly-scrollbar-thumb:hover {
            box-shadow:
                0 3px 14px rgba(167, 139, 250, .5),
                0 0 0 1px rgba(255, 255, 255, .25) inset,
                0 1px 0 rgba(255, 255, 255, .4) inset;
        }

        .hourly-scrollbar-thumb:active,
        .hourly-scrollbar.dragging .hourly-scrollbar-thumb {
            cursor: grabbing;
            height: 12px
        }

        .hourly-scrollbar.empty {
            opacity: .35;
            pointer-events: none
        }

        .hourly-scrollbar-hint {
            position: absolute;
            right: 0;
            top: -2px;
            font-size: 10px;
            color: var(--text-mute);
            display: flex;
            align-items: center;
            gap: 4px;
            pointer-events: none;
            letter-spacing: .3px;
            transition: opacity .3s;
        }

        .hourly-scrolled .hourly-scrollbar-hint {
            opacity: 0
        }

        /* 7-day */
        .daily-card {
            padding: 20px
        }

        .daily-head h3 {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px
        }

        .daily-list {
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .daily-row {
            display: grid;
            grid-template-columns: 90px 36px 1fr 80px 50px;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 12px;
            transition: background .2s;
        }

        .daily-row:hover {
            background: rgba(255, 255, 255, .05)
        }

        .daily-row.today {
            background: rgba(124, 198, 255, .12)
        }

        .daily-row .d {
            font-size: 13px;
            font-weight: 500
        }

        .daily-row .ic {
            width: 28px;
            height: 28px
        }

        .daily-row .range-wrap {
            position: relative;
            height: 6px;
            background: rgba(255, 255, 255, .08);
            border-radius: 3px;
            overflow: hidden
        }

        .daily-row .range-bar {
            position: absolute;
            top: 0;
            bottom: 0;
            border-radius: 3px;
            background: linear-gradient(90deg, #7cc6ff, #fbbf24, #f87171)
        }

        .daily-row .range {
            position: absolute;
            top: -3px;
            bottom: -3px;
            width: 3px;
            background: rgba(255, 255, 255, .6);
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(255, 255, 255, .5)
        }

        .daily-row .max {
            font-size: 13px;
            font-weight: 600;
            text-align: right
        }

        .daily-row .min {
            font-size: 13px;
            color: var(--text-mute);
            text-align: right
        }

        .daily-row .pop {
            font-size: 12px;
            color: var(--accent);
            text-align: right
        }

        /* Charts */
        .charts-card {
            padding: 20px
        }

        .charts-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px
        }

        .charts-head h3 {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .chart-tabs {
            display: flex;
            background: rgba(255, 255, 255, .06);
            border-radius: 10px;
            padding: 3px;
            gap: 2px
        }

        .chart-tab {
            border: 0;
            background: transparent;
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font: 600 12px 'Inter';
            transition: all .2s;
        }

        .chart-tab.on {
            background: linear-gradient(135deg, rgba(124, 198, 255, .4), rgba(167, 139, 250, .4));
            color: #fff
        }

        .chart-wrap {
            position: relative;
            height: 240px
        }

        .chart-legend {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-dim)
        }

        /* Alerts */
        .alerts-card {
            padding: 20px
        }

        .alerts-card h3 {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px
        }

        .alert {
            padding: 12px 14px;
            border-radius: 12px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            background: rgba(251, 191, 36, .1);
            border: 1px solid rgba(251, 191, 36, .3);
            margin-bottom: 8px;
        }

        .alert.severe {
            background: rgba(248, 113, 113, .12);
            border-color: rgba(248, 113, 113, .35)
        }

        .alert:last-child {
            margin-bottom: 0
        }

        .alert-icon {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            display: grid;
            place-items: center;
            color: #fbbf24
        }

        .alert.severe .alert-icon {
            color: #f87171
        }

        .alert-body {
            flex: 1;
            min-width: 0
        }

        .alert-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 2px
        }

        .alert-desc {
            font-size: 12px;
            color: var(--text-dim);
            line-height: 1.4
        }

        .no-alerts {
            text-align: center;
            padding: 24px 12px;
            color: var(--text-mute);
            font-size: 13px
        }

        /* Favorites sidebar */
        .fav-card {
            padding: 20px
        }

        .fav-card h3 {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px
        }

        .fav-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 340px;
            overflow: auto
        }

        .fav-item {
            padding: 10px 12px;
            border-radius: 11px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .06);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all .2s;
            position: relative;
        }

        .fav-item:hover {
            background: rgba(124, 198, 255, .1);
            transform: translateX(2px)
        }

        .fav-item .ico {
            width: 30px;
            height: 30px;
            flex-shrink: 0
        }

        .fav-item .meta {
            flex: 1;
            min-width: 0
        }

        .fav-item .name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .fav-item .sub {
            font-size: 11px;
            color: var(--text-mute);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .fav-item .t {
            font-size: 14px;
            font-weight: 600;
            font-family: 'Space Grotesk', sans-serif
        }

        .fav-remove {
            position: absolute;
            right: 8px;
            top: 8px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(248, 113, 113, .2);
            border: 0;
            color: #fca5a5;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            line-height: 1;
        }

        .fav-item:hover .fav-remove {
            display: flex
        }

        .fav-empty {
            text-align: center;
            padding: 18px;
            color: var(--text-mute);
            font-size: 12px
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            backdrop-filter: blur(18px);
            color: var(--text);
            cursor: pointer;
            font: 500 13px 'Inter';
            transition: all .2s;
        }

        .btn:hover {
            background: var(--glass-strong);
            border-color: rgba(124, 198, 255, .5)
        }

        .btn.primary {
            background: linear-gradient(135deg, rgba(124, 198, 255, .35), rgba(167, 139, 250, .35));
            border-color: rgba(124, 198, 255, .5)
        }

        .btn.danger {
            background: rgba(248, 113, 113, .18);
            border-color: rgba(248, 113, 113, .4);
            color: #fecaca
        }

        /* Comparison mode */
        .compare-toggle {
            margin-left: auto
        }

        .compare-bar {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(167, 139, 250, .1);
            border: 1px solid rgba(167, 139, 250, .3);
            border-radius: 12px;
            margin-bottom: 14px;
        }

        .compare-bar.open {
            display: flex;
            flex-wrap: wrap
        }

        .compare-bar select {
            background: rgba(0, 0, 0, .3);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 6px 10px;
            border-radius: 8px;
            font: inherit;
            font-size: 13px;
        }

        .compare-banner {
            grid-column: span 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(167, 139, 250, .12);
            border: 1px solid rgba(167, 139, 250, .3);
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: -8px;
        }

        @media(max-width:1024px) {
            .compare-banner {
                grid-column: span 1
            }
        }

        /* Loading & error states */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 18, 36, .7);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .overlay.open {
            display: flex
        }

        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px
        }

        .loader-spin {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, rgba(124, 198, 255, .9), rgba(167, 139, 250, .9), transparent);
            -webkit-mask: radial-gradient(circle, transparent 55%, #000 56%);
            mask: radial-gradient(circle, transparent 55%, #000 56%);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .loader-text {
            font-size: 13px;
            color: var(--text-dim);
            letter-spacing: .3px
        }

        .skeleton {
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, .05);
            border-radius: 10px
        }

        .skeleton::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .07), transparent);
            animation: shimmer 1.6s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%)
            }

            100% {
                transform: translateX(100%)
            }
        }

        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(248, 113, 113, .95);
            backdrop-filter: blur(20px);
            color: #fff;
            padding: 12px 18px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: all .3s;
            max-width: 90%;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0)
        }

        .toast.info {
            background: rgba(124, 198, 255, .95)
        }

        .toast.success {
            background: rgba(74, 222, 128, .92);
            color: #0b1224
        }

        /* Footer credit */
        .credit {
            text-align: center;
            margin-top: 30px;
            font-size: 11px;
            color: var(--text-mute);
            letter-spacing: .4px;
        }

        .credit .m {
            color: var(--text-dim);
            font-weight: 500;
            background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Utility */
        .hide {
            display: none !important
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px
        }

        /* SVG icons */
        svg {
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none
        }

        svg.solid {
            fill: currentColor;
            stroke: none
        }

        @media(max-width:640px) {
            .hero {
                padding: 20px
            }

            .hero-temp {
                font-size: 72px;
                letter-spacing: -3px
            }

            .hero-temp .deg {
                font-size: 28px;
                margin-top: 6px
            }

            .hero-temp .unit {
                font-size: 24px;
                margin-top: 10px
            }

            .metrics {
                grid-template-columns: 1fr 1fr
            }

            .daily-row {
                grid-template-columns: 60px 30px 1fr 60px 40px;
                gap: 6px;
                font-size: 12px
            }

            .topbar {
                gap: 10px
            }

            .unit-toggle button {
                padding: 6px 8px;
                font-size: 12px
            }
        }
    </style>
</head>

<body>

    <div class="bg-stage" id="bgStage"></div>
    <div class="bg-orb a"></div>
    <div class="bg-orb b"></div>
    <div class="bg-orb c"></div>
    <div class="celestial" id="celestial"></div>
    <div class="lightning" id="lightning"></div>
    <div class="particles" id="particles"></div>

    <div class="app">

        <!-- ============== TOP BAR ============== -->
        <header class="topbar">
            <div class="brand">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="#fff" fill="none" stroke-width="2"

                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none"

            <div class="unit-toggle" role="tablist" aria-label="Temperature unit">

            <button class="icon-btn" id="compareBtn" title="Compare cities">

        <!-- Compare bar -->
        <div class="compare-bar" id="compareBar">

            <button class="btn" id="pickFromFav">Pick from favorites</button>

        <!-- ============== MAIN GRID ============== -->
        <main class="grid layout" id="mainGrid">

                            d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- ============== JAVASCRIPT ============== -->
    <script>
        /* =====================================================================
           SKYGLASS - Weather Dashboard
           =====================================================================
           API CONFIGURATION
           -----------------
           This app uses Open-Meteo (https://open-meteo.com), a free public API
           that does NOT require an API key.
        
           To swap in a different provider (e.g. OpenWeatherMap):
             1. Sign up at https://openweathermap.org/api and get a free key.
             2. Set the API_KEY constant below to your key.
             3. Update the URLs in `geocodeCity` and `fetchWeather` to match
                the provider's endpoint pattern.
             4. Update `normalizeWeatherData` so the returned object matches
                the shape the rest of the app expects (see fields listed
                inside that function).
        
           Open-Meteo endpoints currently in use:
             • Geocoding:  https://geocoding-api.open-meteo.com/v1/search
             • Forecast:   https://api.open-meteo.com/v1/forecast
             • Air Qual.:  https://air-quality-api.open-meteo.com/v1/air-quality
           ===================================================================== */

        const API_KEY = ""; // <-- set this if you switch to OpenWeatherMap / similar

        const ENDPOINTS = {
            geocode: "https://geocoding-api.open-meteo.com/v1/search",
            forecast: "https://api.open-meteo.com/v1/forecast",
            air: "https://air-quality-api.open-meteo.com/v1/air-quality",
        };

        /* ---------------------------------------------------------------------
           STATE
           --------------------------------------------------------------------- */
        const state = {
            unit: localStorage.getItem("sg_unit") || "C",      // "C" | "F"
            favorites: JSON.parse(localStorage.getItem("sg_fav") || "[]"),
            current: null,           // {place, data, aqi}
            compare: { active: false, city: null, data: null, aqi: null },
            charts: { temp: null, rain: null, wind: null, hum: null },
            activeChart: "temp",
            bgKey: "day-clear",
            weatherCode: 0,
        };

        /* ---------------------------------------------------------------------
           HELPERS
           --------------------------------------------------------------------- */
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => Array.from(document.querySelectorAll(s));
        const fmt = (n, d = 0) => Number(n).toFixed(d);
        const deg = (u) => u === "F" ? "°F" : "°C";
        const toF = (c) => c * 9 / 5 + 32;
        const tConv = (c) => state.unit === "F" ? toF(c) : c;
        const windUnit = () => state.unit === "F" ? "mph" : "km/h";
        const windConv = (kmh) => state.unit === "F" ? kmh * 0.621371 : kmh;
        const visUnit = () => state.unit === "F" ? "mi" : "km";

        /* ---------------------------------------------------------------------
           GEOCODING
           --------------------------------------------------------------------- */
        async function geocodeCity(name) {
            const url = `${ENDPOINTS.geocode}?name=${encodeURIComponent(name)}&count=6&language=en&format=json`;
            const r = await fetch(url);
            if (!r.ok) throw new Error("Geocoding failed (" + r.status + ")");
            const j = await r.json();
            if (!j.results || !j.results.length) throw new Error(`No matches for "${name}"`);
            return j.results.map(g => ({
                name: g.name,
                admin: g.admin1 || "",
                country: g.country || "",
                lat: g.latitude,
                lon: g.longitude,
                tz: g.timezone || "auto",
                id: `${g.latitude.toFixed(3)},${g.longitude.toFixed(3)}`,
            }));
        }

        /* ---------------------------------------------------------------------
           FETCH WEATHER (forecast + air quality)
           --------------------------------------------------------------------- */
        async function fetchWeather(place) {
            const params = new URLSearchParams({
                latitude: place.lat,
                longitude: place.lon,
                timezone: place.tz || "auto",
                current: "temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl,cloud_cover,visibility,is_day",
                hourly: "temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_direction_10m,relative_humidity_2m,uv_index,visibility,is_day",
                daily: "weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,sunrise,sunset,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,uv_index_max,uv_index_clear_sky_max",
                forecast_days: 7,
                wind_speed_unit: "kmh",
                temperature_unit: "celsius",
            });
            const url = `${ENDPOINTS.forecast}?${params.toString()}`;
            const r = await fetch(url);
            if (!r.ok) throw new Error("Forecast failed (" + r.status + ")");
            const data = await r.json();

            let aqi = null;
            try {
                const aUrl = `${ENDPOINTS.air}?latitude=${place.lat}&longitude=${place.lon}&current=us_aqi,pm2_5,pm10,ozone&timezone=auto`;
                const ar = await fetch(aUrl);
                if (ar.ok) { aqi = (await ar.json()).current || null; }
            } catch (_) { /* air quality is optional */ }

            return { data, aqi };
        }

        /* ---------------------------------------------------------------------
           NORMALIZE - pull a clean object the rest of the UI uses
           --------------------------------------------------------------------- */
        function normalizeWeatherData(raw, aqi, place) {
            const c = raw.current || {};
            const h = raw.hourly || {};
            const d = raw.daily || {};
            return {
                place,
                current: {
                    temp: c.temperature_2m,
                    feels: c.apparent_temperature,
                    humidity: c.relative_humidity_2m,
                    precip: c.precipitation,
                    code: c.weather_code,
                    wind: c.wind_speed_10m,
                    windDir: c.wind_direction_10m,
                    pressure: c.pressure_msl,
                    clouds: c.cloud_cover,
                    visibility: c.visibility,
                    isDay: c.is_day === 1 || c.is_day === true,
                    time: c.time,
                },
                hourly: h.time ? h.time.map((t, i) => ({
                    time: t, temp: h.temperature_2m[i], feels: h.apparent_temperature[i],
                    pop: h.precipitation_probability ? h.precipitation_probability[i] : null,
                    precip: h.precipitation ? h.precipitation[i] : 0,
                    code: h.weather_code[i], wind: h.wind_speed_10m[i], windDir: h.wind_direction_10m[i],
                    humidity: h.relative_humidity_2m[i], uv: h.uv_index ? h.uv_index[i] : null,
                    vis: h.visibility ? h.visibility[i] : null, isDay: h.is_day ? h.is_day[i] : 1,
                })) : [],
                daily: d.time ? d.time.map((t, i) => ({
                    date: t, code: d.weather_code[i],
                    tmax: d.temperature_2m_max[i], tmin: d.temperature_2m_min[i],
                    fmax: d.apparent_temperature_max[i], fmin: d.apparent_temperature_min[i],
                    sunrise: d.sunrise[i], sunset: d.sunset[i],
                    precip: d.precipitation_sum[i], pop: d.precipitation_probability_max ? d.precipitation_probability_max[i] : 0,
                    windMax: d.wind_speed_10m_max[i], uvMax: d.uv_index_max ? d.uv_index_max[i] : (d.uv_index_clear_sky_max ? d.uv_index_clear_sky_max[i] : 0),
                })) : [],
                aqi,
            };
        }

        /* ---------------------------------------------------------------------
           AQI MAPPING
           --------------------------------------------------------------------- */
        function aqiInfo(v) {
            if (v == null) return { label: "-", cls: "" };
            if (v <= 50) return { label: `${v} · Good`, cls: "aqi-good" };
            if (v <= 100) return { label: `${v} · Moderate`, cls: "aqi-moderate" };
            if (v <= 150) return { label: `${v} · Unhealthy for SG`, cls: "aqi-unhealthy-sg" };
            if (v <= 200) return { label: `${v} · Unhealthy`, cls: "aqi-unhealthy" };
            if (v <= 300) return { label: `${v} · Very Unhealthy`, cls: "aqi-very-unhealthy" };
            return { label: `${v} · Hazardous`, cls: "aqi-hazardous" };
        }

        /* ---------------------------------------------------------------------
           UV INDEX LABEL
           --------------------------------------------------------------------- */
        function uvLabel(v) {
            if (v == null) return "-";
            if (v < 3) return "Low";
            if (v < 6) return "Moderate";
            if (v < 8) return "High";
            if (v < 11) return "Very High";
            return "Extreme";
        }

        /* ---------------------------------------------------------------------
           WIND DIRECTION LABEL
           --------------------------------------------------------------------- */
        function windDirLabel(deg) {
            if (deg == null) return "-";
            const dirs = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
            return dirs[Math.round(deg / 22.5) % 16];
        }

        /* ---------------------------------------------------------------------
           TIME OF DAY → bg class
           --------------------------------------------------------------------- */
        function timeOfDay(date, sunriseISO, sunsetISO) {
            const hour = date.getHours();
            if (!sunriseISO || !sunsetISO) return hour >= 6 && hour < 19 ? "day" : "night";
            const sr = new Date(sunriseISO), ss = new Date(sunsetISO);
            const minutes = hour * 60 + date.getMinutes();
            const srMin = sr.getHours() * 60 + sr.getMinutes();
            const ssMin = ss.getHours() * 60 + ss.getMinutes();
            if (minutes < srMin - 30) return "night";
            if (minutes < srMin + 30) return "dawn";
            if (minutes < ssMin - 30) return "day";
            if (minutes < ssMin + 30) return "dusk";
            return "night";
        }

        /* ---------------------------------------------------------------------
           BACKGROUND ENGINE
           --------------------------------------------------------------------- */
        function applyBackground(weather, sunriseISO, sunsetISO) {
            const stage = $("#bgStage");
            const celest = $("#celestial");
            const particles = $("#particles");
            const code = weather.current ? weather.current.code : 0;
            const info = wInfo(code);
            const isDay = weather.current ? weather.current.isDay : true;
            const tod = isDay ? timeOfDay(new Date(), sunriseISO, sunsetISO) : "night";
            state.bgKey = info.bg[isDay ? 0 : 1] || "day-clear";
            let bgClass = state.bgKey;
            if (tod === "dawn") bgClass = "dawn";
            else if (tod === "dusk") bgClass = "dusk";
            stage.className = "bg-stage " + bgClass;

            // Celestial
            celest.classList.remove("hidden", "sun", "moon");
            if (isDay) {
                if (tod === "dawn" || tod === "dusk") {
                    celest.classList.add("sun");
                    celest.style.opacity = "0.85";
                } else if (tod === "day") {
                    celest.classList.add("sun");
                    celest.style.opacity = "1";
                } else {
                    celest.classList.add("hidden");
                }
            } else {
                celest.classList.add("moon");
                celest.style.opacity = "1";
            }

            // Particles
            particles.innerHTML = "";
            const codesRain = [51, 53, 55, 61, 63, 65, 66, 67, 80, 81, 82];
            const codesStorm = [95, 96, 99];
            const codesSnow = [71, 73, 75, 77, 85, 86];
            const codesFog = [45, 48];
            const codesClearNight = [0, 1];

            if (codesStorm.includes(code)) {
                addRain(particles, 80, true);
                scheduleLightning();
            } else if (codesRain.includes(code)) {
                addRain(particles, isDay ? 60 : 80, false);
            } else if (codesSnow.includes(code)) {
                addSnow(particles, 50);
            } else if (codesFog.includes(code)) {
                // particles stay empty (fog is just a gradient tint)
            } else if (!isDay && codesClearNight.includes(code)) {
                addStars(particles, 60);
            } else if (!isDay) {
                addStars(particles, 30);
            }
            if (isDay && (code === 2 || code === 3 || code === 1)) {
                addClouds(particles, 2);
            }
        }

        let lightningTimer;
        function scheduleLightning() {
            const fire = () => {
                const el = $("#lightning");
                el.classList.add("flash");
                setTimeout(() => el.classList.remove("flash"), 250);
                lightningTimer = setTimeout(fire, 4000 + Math.random() * 6000);
            };
            lightningTimer = setTimeout(fire, 1500);
        }
        function addRain(host, count, heavy) {
            for (let i = 0; i < count; i++) {
                const d = document.createElement("div");
                d.className = "particle rain-drop";
                d.style.left = Math.random() * 100 + "vw";
                d.style.height = (heavy ? 18 + Math.random() * 12 : 10 + Math.random() * 16) + "px";
                d.style.animationDuration = (heavy ? 0.4 + Math.random() * 0.3 : 0.6 + Math.random() * 0.4) + "s";
                d.style.animationDelay = -Math.random() * 2 + "s";
                d.style.opacity = 0.4 + Math.random() * 0.5;
                host.appendChild(d);
            }
        }
        function addSnow(host, count) {
            for (let i = 0; i < count; i++) {
                const s = document.createElement("div");
                s.className = "particle snow-flake";
                s.style.left = Math.random() * 100 + "vw";
                s.style.animationDuration = 6 + Math.random() * 6 + "s";
                s.style.animationDelay = -Math.random() * 8 + "s";
                s.style.opacity = 0.5 + Math.random() * 0.5;
                s.style.transform = `scale(${0.5 + Math.random() * 1})`;
                host.appendChild(s);
            }
        }
        function addStars(host, count) {
            for (let i = 0; i < count; i++) {
                const s = document.createElement("div");
                s.className = "particle star";
                s.style.left = Math.random() * 100 + "vw";
                s.style.top = Math.random() * 100 + "vh";
                s.style.animationDuration = 2 + Math.random() * 3 + "s";
                s.style.animationDelay = -Math.random() * 3 + "s";
                s.style.opacity = 0.3 + Math.random() * 0.7;
                s.style.transform = `scale(${0.5 + Math.random() * 1.5})`;
                host.appendChild(s);
            }
        }
        function addClouds(host, count) {
            for (let i = 0; i < count; i++) {
                const c = document.createElement("div");
                c.className = "particle cloud";
                c.style.top = (5 + Math.random() * 40) + "vh";
                c.style.width = (160 + Math.random() * 220) + "px";
                c.style.height = (40 + Math.random() * 40) + "px";
                c.style.animationDuration = (40 + Math.random() * 40) + "s";

        function formatLocalTime(date, tz) {
            try {
                if (tz && tz !== "auto") {

            return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
        }
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        /* ---------------------------------------------------------------------
           RENDER: METRICS
           --------------------------------------------------------------------- */
        function renderMetrics(w) {
            const c = w.current;
            const uv = w.hourly[0]?.uv ?? null;
            const visKm = c.visibility != null ? visConv(c.visibility) : null;

            const items = [
                { label: "Feels like", val: `${fmt(feels, 0)}${deg(state.unit)}`, sub: `Actual ${fmt(temp, 0)}${deg(state.unit)}`, icon: "thermo", bar: Math.min(100, (feels + 10) / 50 * 100) },
                { label: "Humidity", val: `${c.humidity}%`, sub: c.humidity > 70 ? "Humid" : c.humidity < 30 ? "Dry" : "Comfortable", icon: "drop", bar: c.humidity },
                { label: "Wind", val: `${fmt(windConv(c.wind), 0)} ${windUnit()}`, sub: `${wd} · ${Math.round(c.windDir || 0)}°`, icon: "wind" },

      ${m.bar != null ? `<div class="metric-bar"><i style="width:${Math.max(0, Math.min(100, m.bar))}%"></i></div>` : ""}

        /* ---------------------------------------------------------------------
           RENDER: SUN (sunrise / sunset arc)
           --------------------------------------------------------------------- */
        function renderSun(w) {
            const today = w.daily[0];
            if (!today) { $("#sunCard").innerHTML = ""; return; }
            const sr = new Date(today.sunrise);
            const ss = new Date(today.sunset);
            const now = w.current.time ? new Date(w.current.time) : new Date();

            const srMin = sr.getTime() / (1000 * 60);
            const ssMin = ss.getTime() / (1000 * 60);
            const nowMin = now.getTime() / (1000 * 60);
            const dayLen = ssMin - srMin;
            const progress = Math.max(0, Math.min(1, (nowMin - srMin) / dayLen));

            // Draw a half-arc with cubic Bezier
            const W = 280, H = 120, cx = W / 2, cy = H, r = (W - 20) / 2;
            const x1 = cx - r, y1 = cy, x2 = cx + r, y2 = cy;
            // arc up to height = r
            const path = `M ${x1} ${y1} A ${r} ${r} 0 0 1 ${x2} ${y2}`;
            // sun position
            const ang = Math.PI * (1 - progress);
            const sx = cx - r * Math.cos(ang);
            const sy = cy - r * Math.sin(ang);

            $("#sunCard").innerHTML = `
    <h3>${iconSVG("sun-rise", 18)} Sun timeline</h3>
    <div class="sun-arc">
      <svg viewBox="0 0 ${W} ${H}">
        <defs>
          <linearGradient id="sun-grad" x1="0" x2="1">
            <stop offset="0%" stop-color="#7cc6ff"/>
            <stop offset="50%" stop-color="#ffd166"/>
            <stop offset="100%" stop-color="#f87171"/>
          </linearGradient>
        </defs>
        <path class="arc-line" d="${path}"/>
        <path class="arc-fill" d="${path}" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100 - progress * 100}"/>
        <circle class="sun-dot" cx="${x1}" cy="${y1}" r="4"/>
        <circle class="sun-dot" cx="${x2}" cy="${y2}" r="4"/>
        <circle class="sun-dot now" cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="7"/>
      </svg>
    </div>
    <div class="sun-times">
      <div>${iconSVG("sun-rise", 14)} Sunrise <strong>${formatTime(sr, w.place.tz)}</strong></div>
      <div>Daylight <strong>${formatDuration(dayLen)}</strong></div>
      <div>${iconSVG("sun-rise", 14)} Sunset <strong>${formatTime(ss, w.place.tz)}</strong></div>
    </div>
  `;
        }
        function formatTime(d, tz) {
            try {
                if (tz && tz !== "auto") return new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", timeZone: tz, hour12: false }).format(d);
            } catch (_) { }
            return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
        }
        function formatDuration(min) {
            const h = Math.floor(min / 60), m = Math.round(min % 60);
            return `${h}h ${m}m`;
        }

        /* ---------------------------------------------------------------------
           RENDER: HOURLY
           --------------------------------------------------------------------- */
        function renderHourly(w) {
            const now = w.current.time ? new Date(w.current.time) : new Date();
            // pick next 24 hours starting from current hour
            const startIdx = w.hourly.findIndex(h => new Date(h.time) >= new Date(now.getTime() - 30 * 60 * 1000));
            const idx0 = startIdx >= 0 ? startIdx : 0;
            const slice = w.hourly.slice(idx0, idx0 + 24);
            $("#hourlyCard").innerHTML = `
    <div class="hourly-head">
      <h3>${iconSVG("clock", 16)} Hourly forecast</h3>
      <span style="font-size:12px;color:var(--text-mute)">Next 24 hours</span>
    </div>
    <div class="hourly-track" id="hourlyTrack">
      ${slice.map((h, i) => {
                const d = new Date(h.time);
                const isNow = i === 0;
                const label = isNow ? "Now" : d.toLocaleTimeString([], { hour: "2-digit", hour12: false }).replace(":00", "") + "h";
                const info = wInfo(h.code);
                return `
          <div class="hourly-item ${isNow ? 'now' : ''}">
            <div class="h ${isNow ? 'now' : ''}">${label}</div>
            <div class="ic">${iconSVG(info.icon, 28)}</div>
            <div class="t">${fmt(tConv(h.temp), 0)}°</div>
            <div class="p">${h.pop != null ? h.pop + '%' : ''}</div>
            <div class="w">${fmt(windConv(h.wind), 0)}${windUnit()}</div>
          </div>
        `;
            }).join("")}
    </div>
    <div class="hourly-scrollbar" id="hourlyScrollbar" aria-label="Scroll hourly forecast">
      <div class="hourly-scrollbar-track">
        <div class="hourly-scrollbar-thumb" id="hourlyScrollThumb"></div>
      </div>
      <div class="hourly-scrollbar-hint">
        <svg viewBox="0 0 24 24" width="10" height="10" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        scroll
      </div>
    </div>
  `;
            // Scroll to start and wire the custom scrollbar
            const track = $("#hourlyTrack");
            if (track) track.scrollLeft = 0;
            setupHourlyScrollbar();
        }

        /* ---------------------------------------------------------------------
           CUSTOM HORIZONTAL SCROLLBAR
           - Hides the native scrollbar
           - Renders a glass-styled track + gradient thumb
           - Drag the thumb, click the track, scroll the container - all synced
           --------------------------------------------------------------------- */
        let _hourlyScrollCleanup = null;
        function setupHourlyScrollbar() {
            // tear down any previous bindings
            if (typeof _hourlyScrollCleanup === "function") _hourlyScrollCleanup();

            const track = $("#hourlyTrack");
            const scroller = $("#hourlyScrollbar");
            const thumb = $("#hourlyScrollThumb");
            const card = $("#hourlyCard");
            if (!track || !scroller || !thumb) return;

            let isDragging = false;
            let dragStartX = 0;
            let dragStartScroll = 0;

            function getMetrics() {
                const sw = track.scrollWidth;
                const cw = track.clientWidth;
                const scrollable = Math.max(0, sw - cw);
                const trackPx = scroller.clientWidth;
                const visibleRatio = sw > 0 ? cw / sw : 1;
                const thumbW = Math.max(32, visibleRatio * trackPx);
                const maxThumbX = Math.max(0, trackPx - thumbW);
                return { scrollable, trackPx, thumbW, maxThumbX };
            }

            function update() {
                const { scrollable, thumbW, maxThumbX } = getMetrics();
                if (scrollable <= 0) {
                    scroller.classList.add("empty");
                    thumb.style.width = "100%";
                    thumb.style.transform = "translateX(0)";
                    return;
                }
                scroller.classList.remove("empty");
                thumb.style.width = thumbW + "px";
                const ratio = track.scrollLeft / scrollable;
                const tx = ratio * maxThumbX;
                thumb.style.transform = `translateX(${tx.toFixed(2)}px)`;
                card.classList.toggle("hourly-scrolled", track.scrollLeft > 4);
            }

            // Click on track to jump
            scroller.addEventListener("click", (e) => {
                if (e.target === thumb) return;
                const { scrollable, thumbW, maxThumbX } = getMetrics();
                if (scrollable <= 0) return;
                const rect = scroller.getBoundingClientRect();
                const x = e.clientX - rect.left - thumbW / 2;
                const ratio = Math.max(0, Math.min(1, x / maxThumbX));
                track.scrollTo({ left: ratio * scrollable, behavior: "smooth" });
            });

            // Drag thumb
            thumb.addEventListener("pointerdown", (e) => {
                isDragging = true;
                dragStartX = e.clientX;
                dragStartScroll = track.scrollLeft;
                scroller.classList.add("dragging");
                try { thumb.setPointerCapture(e.pointerId); } catch (_) { }
                e.preventDefault();
            });
            thumb.addEventListener("pointermove", (e) => {
                if (!isDragging) return;
                const { scrollable, maxThumbX } = getMetrics();
                if (maxThumbX <= 0 || scrollable <= 0) return;
                const dx = e.clientX - dragStartX;
                const ratio = dx / maxThumbX;
                track.scrollLeft = dragStartScroll + ratio * scrollable;
            });
            const endDrag = (e) => {
                if (!isDragging) return;
                isDragging = false;
                scroller.classList.remove("dragging");
                try { thumb.releasePointerCapture(e.pointerId); } catch (_) { }
            };
            thumb.addEventListener("pointerup", endDrag);
            thumb.addEventListener("pointercancel", endDrag);
            thumb.addEventListener("lostpointercapture", endDrag);

            // Native scroll → update thumb
            track.addEventListener("scroll", update, { passive: true });

            // Recompute on resize / font load / data change
            let ro;
            if (window.ResizeObserver) {
                ro = new ResizeObserver(update);
                ro.observe(track);
            } else {
                window.addEventListener("resize", update);
            }
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(update).catch(() => { });
            }

            // Cleanup function (called before re-binding on next renderHourly)
            _hourlyScrollCleanup = () => {
                track.removeEventListener("scroll", update);
                if (ro) ro.disconnect();
                window.removeEventListener("resize", update);
            };

            // initial paint (defer a frame so layout is settled)
            requestAnimationFrame(update);
            setTimeout(update, 50);
        }

        /* ---------------------------------------------------------------------
           RENDER: DAILY (7-day)
           --------------------------------------------------------------------- */
        function renderDaily(w) {
            const allMax = Math.max(...w.daily.map(d => d.tmax));
            const allMin = Math.min(...w.daily.map(d => d.tmin));
            const range = Math.max(1, allMax - allMin);

            $("#dailyCard").innerHTML = `
    <div class="daily-head">
      <h3>${iconSVG("calendar", 16)} 7-day forecast</h3>
    </div>
    <div class="daily-list">
      ${w.daily.map((d, i) => {
                const date = new Date(d.date);
                const dayLabel = i === 0 ? "Today" : i === 1 ? "Tomorrow" : date.toLocaleDateString([], { weekday: "long" });
                const info = wInfo(d.code);
                const lo = tConv(d.tmin), hi = tConv(d.tmax);
                const leftPct = (d.tmin - allMin) / range * 100;
                const rightPct = 100 - (d.tmax - allMin) / range * 100;
                const widthPct = 100 - leftPct - rightPct;
                return `
          <div class="daily-row ${i === 0 ? 'today' : ''}">
            <div class="d">${dayLabel}</div>
            <div class="ic">${iconSVG(info.icon, 26)}</div>
            <div class="range-wrap">
              <div class="range-bar" style="left:${leftPct}%;width:${widthPct}%"></div>
            </div>
            <div class="max">${fmt(hi, 0)}°</div>
            <div class="min">${fmt(lo, 0)}°</div>
          </div>
        `;
            }).join("")}
    </div>
  `;
        }

        /* ---------------------------------------------------------------------
           RENDER: CHARTS
           --------------------------------------------------------------------- */
        function destroyCharts() {
            Object.values(state.charts).forEach(c => { if (c) c.destroy(); });
            state.charts = { temp: null, rain: null, wind: null, hum: null };
        }

        function buildHourlyLabels(w) {
            return w.hourly.map(h => {
                const d = new Date(h.time);
                return d.toLocaleTimeString([], { hour: "2-digit", hour12: false }).replace(":00", "h");
            });
        }

            destroyCharts();

            const common = {
                type: "line",

                    responsive: true, maintainAspectRatio: false,

                        { label: "Feels", data: w.hourly.map(h => tConv(h.feels)), borderColor: "#a78bfa", backgroundColor: "transparent", borderDash: [5, 4], tension: .35, pointRadius: 0, pointHoverRadius: 5, borderWidth: 2 },

                    plugins: { ...common.options.plugins, tooltip: { ...common.options.plugins.tooltip, callbacks: { label: c => `${c.dataset.label}: ${fmt(c.parsed.y, 1)}${deg(state.unit)}` } } },
                },
            });

            // RAIN
            state.charts.rain = new Chart($("#chartRain"), {

                    }],

                },

            state.charts.wind = new Chart($("#chartWind"), {

                        borderColor: "#a78bfa", backgroundColor: "rgba(167,139,250,.18)", fill: true, tension: .35, pointRadius: 0, pointHoverRadius: 5, borderWidth: 2.5,

            state.charts.hum = new Chart($("#chartHum"), {
